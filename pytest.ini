[pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short
markers =
    integration: mark test as integration (requires real APIs and --run-integration flag)
    real_model: mark test as requiring a live model endpoint (requires --real-model flag)
    real_slm: Tests that make real Anthropic SLM API calls
