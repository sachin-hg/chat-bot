<h2>🐛 Find The Bug — Debugging Exercises</h2>
<p>Each snippet has exactly one bug. Identify it before revealing the answer.</p>

<details style="margin:12px 0;border:1px solid var(--border);border-radius:6px;padding:12px">
  <summary style="cursor:pointer;font-weight:600">Exercise A — The Vanishing Close Frame (Gotcha 14.1)</summary>
<pre><code class="language-python">async def sse_generator(queue: asyncio.Queue):
    try:
        while True:
            event = await queue.get()
            if event is None:
                break
            yield f"data: {json.dumps(event)}\\n\\n"
    finally:
        await redis.decr("active_connections")   # can raise on Redis error
    yield "data: \\"connection_close\\"\\n\\n"    # send close signal</code></pre>
  <details style="margin-top:8px"><summary>Reveal answer</summary>
  <div class="callout callout-warn" style="margin:8px 0">
    <strong>Bug:</strong> <code>yield "data: connection_close"</code> is AFTER the try/finally block. If <code>redis.decr</code> raises in <code>finally</code>, Python exits the generator with that exception and the yield after try/finally never executes. The client's stream hangs open forever.
    <br><strong>Fix:</strong> Move <code>yield "data: connection_close"</code> INSIDE the while loop, immediately after <code>break</code>.
  </div></details>
</details>

<details style="margin:12px 0;border:1px solid var(--border);border-radius:6px;padding:12px">
  <summary style="cursor:pointer;font-weight:600">Exercise B — The Exploding Context (Gotcha 14.3)</summary>
<pre><code class="language-python">def build_last_3_turns(turn_history: list[dict]) -> list[dict]:
    """Return last 3 user+bot turn pairs for SLM classifier context."""
    return turn_history[-6:]   # 3 user + 3 bot messages</code></pre>
  <details style="margin-top:8px"><summary>Reveal answer</summary>
  <div class="callout callout-warn" style="margin:8px 0">
    <strong>Bug:</strong> Bot responses are full LLM outputs — potentially 500–1000 tokens each. Passing them raw to the SLM classifier fills its small context window with response text, crowding out the user's actual query. The SLM truncates and misclassifies.
    <br><strong>Fix:</strong> Truncate bot messages to 400 chars: <code>{"role": m["role"], "content": m["content"][:400] if m["role"] == "assistant" else m["content"]}</code>
  </div></details>
</details>

<details style="margin:12px 0;border:1px solid var(--border);border-radius:6px;padding:12px">
  <summary style="cursor:pointer;font-weight:600">Exercise C — The Ghost Feature (Gotcha 14.6)</summary>
<pre><code class="language-python">@dataclass
class IntentRecord:
    name: str
    tier: int
    required_tools: list[str]
    clear_keys: list[str]    # session keys to clear on this intent
    min_confidence: float = 0.7

# intent_registry.py — 200 lines later
def get_requirements(intent: str) -> IntentRecord:
    return INTENT_REGISTRY[intent]

# filter_apply_node — clears active_filters on reset_filters intent
def filter_apply_node(state: BotState) -> BotState:
    if state.intent == "reset_filters":
        return state | {"active_filters": {}}
    # ... applies new filters</code></pre>
  <details style="margin-top:8px"><summary>Reveal answer</summary>
  <div class="callout callout-warn" style="margin:8px 0">
    <strong>Bug:</strong> <code>clear_keys</code> is defined in the schema and populated in every <code>IntentRecord</code>, but no code ever reads <code>record.clear_keys</code>. The filter reset logic is hardcoded in <code>filter_apply_node</code> instead. This creates false confidence — engineers add values to <code>clear_keys</code> believing they'll be cleared, but nothing happens.
    <br><strong>Fix:</strong> Either delete <code>clear_keys</code> from the schema, or write a generic node that reads it: <code>for key in record.clear_keys: state.session.pop(key, None)</code>.
  </div></details>
</details>

<div class="callout callout-info"><strong>Who this is for</strong>Engineers who are new to working with LLMs. If you've already built something with the Anthropic or OpenAI API, skim for gaps and continue to Module 0.</div>

<h2>16.1 What a Language Model Actually Does</h2>
<p>An LLM is a <strong>next-token predictor</strong>. It takes a sequence of tokens as input, outputs a probability distribution over the next token, picks from that distribution, appends the result, and repeats until it decides to stop.</p>
<p>There's no fact database, no reasoning engine, no lookup table. The model learned statistical patterns from a huge text corpus during training. When it "knows" something, it means that pattern appeared frequently enough in training to dominate the probability at inference time.</p>
<div class="callout callout-info"><strong>What training actually is</strong> During training, the model reads billions of text examples and is repeatedly asked to predict the next token in each sequence. When it's wrong, its internal weights (billions of floating-point numbers) are nudged slightly — making the correct token a bit more probable next time. After trillions of such nudges across months of GPU compute, those weights encode which tokens tend to follow which patterns. <strong>You never modify these weights at inference time</strong> — you only add context to the window and ask the model to continue the pattern. This is why injecting real data into the prompt works: it changes what the model "sees," not what it knows.</div>
<div class="callout callout-warn"><strong>Why this matters for engineering</strong>The LLM cannot retrieve real data. It can only work with what's in its context window. <strong>Hallucination</strong> is not a bug — it's next-token prediction generating the most-probable token when the correct answer isn't grounded in the context. <strong>Grounding</strong> = injecting real data before asking the model to respond. This is the entire purpose of <code>fetch_data_node → build_prompt_node → llm_node</code>.</div>

<h2>16.2 Tokens — Your Cost and Speed Unit</h2>
<p>Models process <strong>tokens</strong> (subword units), not characters or words.</p>
<pre><code class="language-python">"show me 3BHK in Bandra under 2Cr"
→ ["show", " me", " 3", "BH", "K", " in", " Band", "ra", " under", " 2", "Cr"]
→ 11 tokens

# A 1,000-word document ≈ 1,300 tokens
# Claude uses a different tokenizer — counts differ slightly; use
# anthropic.tokenizer.count_tokens() for exact Claude token counts</code></pre>
<table>

<p><strong>The rule:</strong> Never ask an LLM what it knows about your domain. Tell it what it needs to know, then ask it to respond.</p>

<h2>16.8 RAG — Retrieval-Augmented Generation</h2>
<div class="callout callout-tip">
  <strong>One-sentence definition: RAG = give your LLM a search engine over your own documents.</strong>
  Instead of the LLM hallucinating from training memory, you first search your documents for the most relevant chunks, then inject those chunks into the prompt. The LLM answers from evidence, not memory. This is how you build AI features over private data (your product listings, internal docs, customer history) without fine-tuning.
</div>
<p>RAG is the most important pattern for AI features that work with private or frequently-updated data. <strong>This pipeline already implements it.</strong></p>
<div class="diagram-wrap">
  <div class="diagram-title">Full RAG system — what's happening under the hood</div>
  <pre style="margin:0;border:none;background:transparent;font-size:12px">User query: "3BHK apartments in Bandra under ₹2Cr"
    │
    ▼
[1] EMBED QUERY
    embed("3BHK apartments in Bandra under ₹2Cr")
    → 1536-dimensional vector [0.12, -0.87, 0.44, ...]
    ↑ What does 0.12 mean? Nothing on its own. Embeddings only have meaning
      relative to each other. If "apartment" and "flat" have similar vectors,
      0.12 in position 47 will be similar for both. No single number is
      interpretable — the pattern across all 1536 numbers encodes semantics.
    │
    ▼
[2] VECTOR SEARCH
    SELECT content FROM docs ORDER BY embedding &lt;-&gt; query_vec LIMIT 10
    → Top 10 semantically-nearest document chunks
    │
    ▼
[3] RE-RANK  (optional — rescores top-k with a cross-encoder)
    → Reordered: most-relevant first, irrelevant dropped
    │
    ▼
[4] INJECT INTO PROMPT
    "Answer using ONLY the following context:\n" + retrieved_chunks + user_query
    │
    ▼
[5] GENERATE → grounded response</pre>
</div>
<div class="callout callout-tip">
  <strong>Where do those 1536 numbers come from?</strong>
  An embedding model (e.g. OpenAI's <code>text-embedding-3-small</code>) is a neural network trained on massive text corpora. You pass in text; it outputs a fixed-size vector. The network learned — during training — to place semantically similar texts near each other in that 1536-dimensional space. "apartment" and "flat" end up close; "apartment" and "crocodile" end up far apart.
  <br><br>
  You never train this yourself. You call an API: <code>client.embeddings.create(input="3BHK in Bandra", model="text-embedding-3-small")</code> → get 1536 numbers back. Store those numbers. At query time, embed the query the same way and find stored vectors that are geometrically close (cosine similarity). Close vectors = semantically similar text.
</div>
<p><strong>Components:</strong> embedding model (text→vector), vector database (stores/searches), optional cross-encoder reranker, LLM (generates from grounded context).</p>

<div class="diagram-wrap">
  <div class="diagram-title">Offline indexing pipeline — what you must build FIRST before query-time RAG works</div>
  <pre style="margin:0;border:none;background:transparent;font-size:12px">Your documents (PDFs, DB rows, API results, HTML pages)
    │
    ▼  Document Loader
Load raw text — LangChain has loaders for PDF, Web, Notion, GitHub, SQL
    │
    ▼  Chunker
Split into overlapping chunks: chunk_size=512 characters (≈128 tokens), overlap=50 chars
    │
    ▼  Embedding model  (called once per chunk, at index time)
chunk_text → client.embeddings.create(input=chunk_text, model="text-embedding-3-small")
         → [0.12, -0.87, 0.44, ...]  (1536 floats per chunk)
    │
    ▼  Vector store
Store (chunk_text, embedding_vector, metadata) in pgvector / ChromaDB / Pinecone
    │
    Vector DB now contains your searchable index
    ── Updated nightly or on document change (incremental re-index)

At query time (Section 16.8 diagram above): embed query → search → inject → generate</pre>
</div>
<div class="callout callout-warn"><strong>Most RAG tutorials skip the indexing step.</strong> They start from "now you have a vector DB." You must build and maintain the indexing pipeline. Property listings updated daily? Re-index nightly. New document uploaded? Re-index that document immediately. Stale index → confident but wrong answers.</div>

  <tr><th></th><th>RAG</th><th>Fine-tuning</th><th>Zero-shot prompting</th></tr>

  <tr><td>Private per-user data</td><td>✓ Retrieve at runtime</td><td>✗ Can't fine-tune per user</td><td>✗ won't fit in prompt</td></tr>
  <tr><td>Need new reasoning style</td><td>✗ Only changes knowledge</td><td>✓ Right tool</td><td>~ limited</td></tr>
  <tr><td>Time to update</td><td>Immediate re-index</td><td>Days–weeks</td><td>Minutes</td></tr>
  <tr><td>Training cost</td><td>Near zero</td><td>$200–$2,000+</td><td>Zero</td></tr>
</table>

<h3>Naive RAG failure modes — what breaks in production</h3>
<table>
  <tr><th>Failure</th><th>Symptom</th><th>Root cause</th><th>Fix</th></tr>
  <tr><td>Chunk too large</td><td>LLM ignores middle of chunk</td><td>2,000-token chunk; answer buried at line 80</td><td>Smaller chunks (256–512 tokens)</td></tr>
  <tr><td>Chunk too small</td><td>Answer split across chunks, none complete</td><td>50-token chunks break mid-sentence</td><td>Larger chunks or parent-document retrieval</td></tr>
  <tr><td>Retrieval miss</td><td>LLM hallucinated; document existed</td><td>Query vocab ≠ document vocab</td><td>Hybrid search (BM25 + vector), query expansion</td></tr>
  <tr><td>Context overflow</td><td>Truncation or confusion</td><td>10 × 500-token chunks = 5K tokens</td><td>Max 3–5 chunks for 8K context models</td></tr>
  <tr><td>Staleness</td><td>Confident but outdated answer</td><td>Index not re-embedded after update</td><td>Incremental re-indexing on document change</td></tr>
  <tr><td>Multi-hop failure</td><td>Two-part question answered partially</td><td>Top-k returns documents independently</td><td>Iterative retrieval or Graph RAG</td></tr>
</table>

<div class="callout callout-info"><strong>BM25 and Graph RAG — what the failure mode fixes actually mean</strong><br>
<strong>BM25</strong> (Best Match 25) is keyword-based search — think Ctrl+F across your documents, but smarter. Vector search finds semantically similar text even with different words. BM25 finds exact keyword matches that vector search might miss (e.g., a property ID like "HOM-9873", a rare locality name, or a precise number). <strong>Hybrid search</strong> runs both and combines scores: keyword precision + semantic recall. This is the standard production approach — most teams use RRF (Reciprocal Rank Fusion) to merge the two ranked lists.<br><br>
<strong>Graph RAG</strong> is for documents with entity relationships: person → company → event → location. A single text chunk doesn't contain the full answer — you need to traverse the graph. Example: "Which Housing.com agents have closed deals in Bandra West with buyers from Delhi?" needs to join agents, transactions, locality, and buyer_city — a knowledge graph query, not a vector similarity search. For a straightforward property search chatbot, you don't need Graph RAG. Use it when your knowledge has network structure that a flat vector index can't capture.
</div>
<h3>Chunking intuition — why size dominates RAG quality</h3>
<div class="callout callout-info">
  <strong>The Lost-in-the-Middle Problem</strong>
  LLMs anchor on the beginning and end of context. A 2,000-token chunk with the answer on line 80 will often be retrieved (it's relevant) but the answer will be missed. Right-sized chunks ensure the entire chunk is signal, not noise.
  <br><br>
  <strong>Production rule:</strong> Start at 512 characters + 10% overlap (<code>RecursiveCharacterTextSplitter</code> default — ≈128 tokens). Tune by RAGAS scores: context relevance &lt; 0.7 → try smaller. Faithfulness &lt; 0.7 → try larger (more context per chunk reduces hallucination on partial facts).<br>
  <strong>Token-accurate splitting:</strong> To split by tokens instead of characters, pass <code>length_function=tiktoken_len</code> to <code>RecursiveCharacterTextSplitter</code>, where <code>tiktoken_len</code> counts BPE tokens. Use this when your context window budget is tight and character counts are misleading (e.g., Chinese text uses ~1 char per token; English averages ~4 chars per token).
</div>
${quizSection(16, 'Track A: LLM Fundamentals', 'Tokens, temperature, hallucination, grounding, prompt caching, model selection, RAG vs fine-tuning, chunking strategies, naive RAG failure modes')}`);

<h2>17.1 The Complete SSE Frame Anatomy</h2>
<p>Every pipeline node completion, every text token, every carousel is an SSE frame. Here is what the server sends over the wire for a single turn:</p>
<pre><code class="language-plaintext">event: pipeline_step
data: {"node":"safety","status":"completed","latency_ms":2}

event: pipeline_step
data: {"node":"classify","status":"completed","latency_ms":187,"detail":{"domain":"property_search","intent":"search_properties"}}

event: chat_event
data: {"messageState":"IN_PROGRESS","chatResponse":{"type":"property_carousel","properties":[{"id":"abc","title":"3BHK Bandra West","price":"₹1.95Cr"}]}}

event: message_delta
data: {"content":{"text":"I found"},"chunkIndex":0}

event: message_delta
data: {"content":{"text":" 8 properties"},"chunkIndex":1}

... (50–100 message_delta events for a typical response)

event: chat_event
data: {"messageState":"COMPLETED","chatResponse":{"text":"I found 8 sea-facing..."}}

event: connection_close
data: {"reason":"response_complete"}</code></pre>
<div class="callout callout-tip"><strong>Order is guaranteed and semantic</strong>pipeline_steps → chat_event (carousel, BEFORE text) → message_delta×N → chat_event(COMPLETED) → connection_close. The carousel appears before text starts streaming — <code>respond_node</code> runs before <code>llm_node</code>.</div>
<div class="callout callout-warn"><strong>Mobile reconnection and Last-Event-ID</strong>
Order is only guaranteed on an uninterrupted HTTP/1.1 connection. On mobile networks that drop mid-stream, the browser's <code>EventSource</code> API will retry using the <code>Last-Event-ID</code> header — but only if your frames include an <code>id:</code> field. The <code>fetch()+ReadableStream</code> pattern used here does NOT auto-retry. You have two options:
<ol style="margin:4px 0">
  <li><strong>Server-side event IDs + client-side replay:</strong> Add <code>id: {turn_id}-{frame_index}\n</code> to every frame. On reconnect, client resends the request with <code>Last-Event-ID</code> header; server replays frames from that index (stored in Redis for the session). Complex to implement correctly.</li>
  <li><strong>Simpler: re-send the whole message on network error.</strong> Detect <code>reader.read()</code> throwing (connection drop), reset state to <code>idle</code>, show "Connection interrupted — tap to retry" and let the user re-send. The session is in Redis so context is preserved. This is what most production chat UIs do.</li>
</ol>
The frames above do NOT include <code>id:</code> fields — they rely on option 2 (user re-send) for interrupted streams.
</div>

<h2>17.2 Consuming SSE in the Browser — The Right Way</h2>
<p><code>EventSource</code> (the W3C SSE API) only supports GET requests and no custom headers — useless for authenticated POST-based chat. Use <code>fetch()</code> with <code>ReadableStream</code>:</p>
<pre><code class="language-javascript">async function* streamChat(message, conversationId, token) {
  const response = await fetch('/api/v1/chat/send-message-streamed', {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'Authorization': \`Bearer \${token}\`,   // ← impossible with EventSource
    },
    body: JSON.stringify({ message, conversation_id: conversationId }),
  });

  if (!response.ok) {
    if (response.status === 401) throw new Error('AUTH_EXPIRED');
    throw new Error(\`HTTP_\${response.status}\`);
  }

  const reader = response.body.getReader();
  const decoder = new TextDecoder();
  let buffer = '';
  let currentEvent = '';

  while (true) {
    const { done, value } = await reader.read();
    if (done) break;
    // { stream: true } handles multi-byte UTF-8 characters split across TCP chunks
    // (e.g., emoji 🏠 or Japanese 「六本木」 split across two read() calls).
    // TextDecoder buffers the partial sequence and emits the complete char on next call.
    buffer += decoder.decode(value, { stream: true });
    const lines = buffer.split('\\n');
    buffer = lines.pop() ?? '';    // keep incomplete last line
    for (const line of lines) {
      if (line.startsWith('event: ')) currentEvent = line.slice(7).trim();
      else if (line.startsWith('data: ')) {
        try {
          yield { type: currentEvent, ...JSON.parse(line.slice(6)) };
        } catch (parseErr) {
          // Partial frame from server crash or proxy timeout — log and continue,
          // do NOT rethrow (would kill the entire stream for one bad frame)
          console.warn('SSE parse error, skipping frame:', line, parseErr);
        }
        currentEvent = '';
      }
    }
  }
}</code></pre>

<h2>17.3 Streaming Text Without Jank</h2>
<p>Appending each token chunk to React state triggers a re-render per token (50–100/second). On low-end devices this is visible jank.</p>
<pre><code class="language-javascript">// BAD: re-renders every token
const [text, setText] = useState('');
// setText(prev => prev + chunk) on each message_delta

// GOOD: buffer in ref, sync to DOM once per animation frame (≤60fps)
function StreamingText({ isStreaming }) {
  const [displayText, setDisplayText] = useState('');
  const bufferRef = useRef('');
  const rafRef = useRef(0);

  const appendChunk = useCallback((chunk) => {
    bufferRef.current += chunk;
    cancelAnimationFrame(rafRef.current);
    rafRef.current = requestAnimationFrame(() => {
      setDisplayText(bufferRef.current);   // one state update per frame
    });
  }, []);

  // Cleanup on unmount — cancel pending animation frame so setDisplayText
  // doesn't fire on an unmounted component and bufferRef doesn't grow forever
  useEffect(() => {
    return () => cancelAnimationFrame(rafRef.current);
  }, []);

  return (
    &lt;div&gt;
      &lt;span&gt;{displayText}&lt;/span&gt;
      {isStreaming &amp;&amp; &lt;span className="cursor" /&gt;}
    &lt;/div&gt;
  );
}</code></pre>

<h2>17.4 Connection State Machine</h2>
<p>Model stream state explicitly — boolean flags compose badly and produce impossible states like <code>(connecting=true, complete=true)</code>.</p>
<pre><code class="language-javascript">// Valid states only:
// idle → connecting → streaming → complete
//                   → error → idle

function useChatStream(conversationId, token) {
  const [state, setState] = useState('idle');
  const [carouselItems, setCarouselItems] = useState(null);
  const appendChunk = useStreamingText();

  async function send(message) {
    setState('connecting');
    setCarouselItems(null);
    // Sliding window: reset on EVERY event, not just the first.
    // If the server hangs mid-stream (pipeline stalls at node 5), this catches it.
    // Without sliding: clearTimeout fires on frame 1, then nothing protects against hang.
    let timeout = setTimeout(() => setState('error'), 30_000);  // 30s per-event timeout
    try {
      for await (const event of streamChat(message, conversationId, token)) {
        clearTimeout(timeout);
        timeout = setTimeout(() => setState('error'), 30_000);  // reset on each frame
        setState('streaming');
        if (event.type === 'chat_event') {
          if (event.chatResponse?.type === 'property_carousel')
            setCarouselItems(event.chatResponse.properties);
          if (event.chatResponse?.messageState === 'COMPLETED')
            setState('complete');
        }
        if (event.type === 'message_delta') appendChunk(event.content?.text ?? '');
        if (event.type === 'connection_close') { setState('complete'); break; }
      }
    } catch (err) {
      clearTimeout(timeout);
      setState(err.message === 'AUTH_EXPIRED' ? 'auth_error' : 'error');
    }
  }
  return { state, send, carouselItems };
}</code></pre>

<h2>18.2 LLM-as-Judge</h2>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── Faithfulness Check Flowchart ─────────────────────────────────────────────

                    Sample: (query, context, response)
                                      │
                                      ▼
                        Run LLM-as-Judge (Haiku, ~$0.00015)
                        Score faithfulness 1–5
                                      │
                     ┌────────────────┼────────────────┐
                     │                │                │
                  score ≥ 4        score 3          score ≤ 2
                     │                │                │
                     ▼                ▼                ▼
              Pass — log only   FLAG for human    ► AUTOMATIC ACTION:
              (low cost)        review queue       - lower temperature
                                                   - add "only use provided

                                                   - check if retrieval missed
                                                   - escalate to Sonnet

                                      │
                              (weekly review of flagged)
                                      │
                                      ▼

<p>Use a stronger model to evaluate your system's outputs. At $0.0015/sample, 100 samples costs $0.15 — affordable at every company size.</p>
<pre><code class="language-python">JUDGE_PROMPT = """You are evaluating an AI assistant response.

User query: {user_message}
Context injected into AI: {injected_data}
AI response: {agent_response}

Score each dimension 1–5:
1. FAITHFULNESS: Does the response contradict any fact in the injected context?
   5=perfectly grounded, 1=directly contradicts context
2. RELEVANCE: Does the response address what the user specifically asked?
   5=directly and completely answers, 1=completely unrelated
3. COHERENCE: Is the response well-structured and easy to understand?
   5=clear and concise, 1=incoherent

Return JSON only:
{{"faithfulness":N,"relevance":N,"coherence":N,
  "reasoning":"one sentence","flag_for_review":bool}}"""

async def judge_response(sample: dict) -> dict:
    # JUDGE_PROMPT uses str.format() — double braces {{ }} become single { }
    # in the rendered output, so the JSON example in the prompt is correct.
    # Verify: print(JUDGE_PROMPT.format(user_message="test", injected_data="[]", agent_response="hi"))
    filled = JUDGE_PROMPT.format(
        user_message=sample["user_message"],
        injected_data=sample["injected_data"],
        agent_response=sample["agent_response"],
    )
    # Use a DIFFERENT model family to judge — avoids self-serving bias
    resp = await client.messages.create(
        model="claude-haiku-4-5-20251001",  # ~$0.00015/sample at ~700 input tokens
        max_tokens=200, temperature=0,
        messages=[{"role": "user", "content": filled}],
    )
    return json.loads(resp.content[0].text)

async def eval_batch(prompt_version, samples):
    results = await asyncio.gather(*[judge_response(s) for s in samples])
    return {
        "avg_faithfulness": mean(r["faithfulness"] for r in results),
        "avg_relevance":    mean(r["relevance"]    for r in results),
        "flagged_pct":      sum(1 for r in results if r["flag_for_review"]) / len(results),
    }

# CI gate: block deploy if avg_faithfulness &lt; 4.0 or flagged_pct &gt; 0.05
# Cost: Haiku ~700 tokens input × $0.25/MTok = ~$0.000175/sample → $0.018 per 100 samples
# Sonnet as judge: ~$2.10 per 100 samples — use for highest-stakes eval only</code></pre>

<h3>Scoring rubric — what each number actually means</h3>
<table>
  <tr><th>Score</th><th>Faithfulness</th><th>Relevance</th><th>Coherence</th></tr>
  <tr><td><strong>5</strong></td><td>Perfectly grounded — zero additions</td><td>Directly + completely answers</td><td>Clear, no redundancy</td></tr>
  <tr><td><strong>4</strong></td><td>Minor acceptable inference</td><td>Fully answers with minor extras</td><td>Clear, minor wordiness</td></tr>
  <tr><td><strong>3</strong></td><td>One unverified claim</td><td>Answers but misses secondary part</td><td>Some unclear phrasing</td></tr>
  <tr><td><strong>2</strong></td><td>Multiple unverified claims</td><td>Tangentially related, doesn't answer</td><td>Hard to follow</td></tr>
  <tr><td><strong>1</strong></td><td>Contradicts the context</td><td>Completely unrelated</td><td>Incoherent</td></tr>
</table>

<div class="callout callout-warn">
  <strong>Inter-annotator calibration — do this before trusting your judge at scale</strong>
  Score 50 samples manually (two reviewers). Run your judge on the same 50. Compute Spearman correlation: target &gt; 0.7. If below, your rubric is ambiguous — add concrete scored examples directly into the judge prompt.<br><br>
  <strong>What Spearman correlation is:</strong> It measures whether your judge ranks samples in the same order as humans — not whether the exact scores match. Spearman = 1.0 means perfect agreement, 0.0 = random, -1.0 = opposite. Example: humans rate [5,3,4,2,1] and your judge rates [5,4,3,2,1] → correlation ≈ 0.9 (close enough). A score of 0.3 means your judge is nearly uncorrelated with human judgment — treat scores as noise, not signal.
  <pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:6px;border-radius:4px;margin-top:4px">from scipy.stats import spearmanr
corr, p_value = spearmanr(human_scores, judge_scores)
print(f"Spearman r={corr:.2f}, p={p_value:.3f}")  # p&lt;0.05 = statistically significant</pre>
  <br><br>
  The most common failure: "Is this relevant?" is too vague. Replace with: <em>"Does this response answer the specific question asked, not a related question?"</em> Specificity in the rubric is the single biggest driver of judge agreement.
</div>

<table>

  <tr><td>Same model family judging its own outputs</td><td>Self-serving bias — rates its own style as coherent</td><td>Different family (GPT judges Claude, Claude judges GPT)</td></tr>
  <tr><td>Safety/policy compliance</td><td>Judge misses subtle violations</td><td>Dedicated safety classifier + human review</td></tr>

<h2>18.3 RAGAS — Evaluating RAG Systems</h2>
<p>When your system retrieves documents (Module 12.5, 16.8), standard accuracy doesn't catch retrieval failures. RAGAS defines three metrics that each point to a different component in the pipeline.</p>
<div class="diagram-wrap">
  <pre style="margin:0;border:none;background:transparent;font-size:12px">User query → Retriever → Retrieved chunks → Generator → Response
               │                                 │
        CONTEXT RELEVANCE               FAITHFULNESS
        Are chunks relevant             Does answer stay
        to the query?                   within context?
                                                 │
                                        ANSWER RELEVANCE
                                        Does answer address
                                        the specific question?</pre>
</div>

<h3>Worked example — scoring a RAG response</h3>
<p><em>Query: "Does the apartment in Bandra have parking?"<br>
Context: "3BHK in Bandra West. 2 covered parking slots included. Price: ₹2.5Cr."<br>
Answer: "The Bandra apartment includes 2 covered parking slots."</em></p>
<table>
  <tr><th>Metric</th><th>Score</th><th>Why</th></tr>
  <tr><td>Faithfulness</td><td>5/5</td><td>Every claim ("Bandra", "2 covered", "parking") is in context</td></tr>
  <tr><td>Context Relevance</td><td>0.67</td><td>Parking + location relevant; price sentence not needed for this query</td></tr>
  <tr><td>Answer Relevance</td><td>0.92</td><td>Directly and completely answers "does it have parking?"</td></tr>
</table>

<pre><code class="language-python"># pip install ragas datasets  ← RAGAS requires HuggingFace datasets library
from datasets import Dataset
from ragas import evaluate
from ragas.metrics import faithfulness, answer_relevancy, context_precision
# Note: RAGAS renamed context_relevancy → context_precision in v0.1.x.
# If you see ImportError: run: pip install ragas --upgrade

# evaluate() requires a HuggingFace Dataset object, NOT a plain list
samples = [
    {
        "question":    "Does the Bandra apartment have parking?",
        "contexts":    ["3BHK in Bandra West. 2 covered parking slots. Price: ₹2.5Cr."],
        "answer":      "The Bandra apartment includes 2 covered parking slots.",
        "ground_truth": "Yes, it has 2 covered parking slots.",  # ← human-written correct answer
        # ground_truth is required for answer_relevancy and context_precision.
        # faithfulness does NOT need ground_truth — it only compares answer to contexts.
        # Build ground_truth by writing ideal answers for your golden dataset (50-100 examples).
    },
]
dataset = Dataset.from_list(samples)
results = evaluate(dataset, metrics=[faithfulness, answer_relevancy, context_precision])
print(results)  # {'faithfulness': 1.0, 'answer_relevancy': 0.95, 'context_precision': 0.67}
# Production threshold: all scores &gt; 0.7 to merge</code></pre>

<h3>Score interpretation and diagnostic actions</h3>
<table>
  <tr><th>Score drops</th><th>Root cause</th><th>Fix</th></tr>
  <tr><td>Faithfulness &lt; 0.7</td><td>LLM adding claims beyond context</td><td>Lower temperature; add "ONLY use provided context" to system prompt; validate_output rules</td></tr>
  <tr><td>Context Relevance &lt; 0.7</td><td>Retriever returning irrelevant chunks</td><td>Smaller chunks; hybrid BM25 + vector search; better embedding model</td></tr>
  <tr><td>Answer Relevance &lt; 0.7</td><td>LLM not answering the actual question</td><td>Add "answer the specific question asked" to prompt; check if turn_history dilutes intent</td></tr>
</table>

<table>
  <tr><th>Score range</th><th>Interpretation</th><th>Action</th></tr>
  <tr><td>0.9–1.0</td><td>Excellent</td><td>No action</td></tr>
  <tr><td>0.7–0.9</td><td>Good</td><td>Monitor only</td></tr>
  <tr><td>0.5–0.7</td><td>Degraded</td><td>Fix within sprint</td></tr>
  <tr><td>&lt; 0.5</td><td>Broken</td><td>Block deploy, immediate fix</td></tr>
</table>

<h2>18.4 Online Metrics — What Real Users Tell You</h2>
<table>
  <tr><th>Signal</th><th>How to Measure</th><th>Alert If</th></tr>
  <tr><td>Session completion</td><td><code>session_completed</code> in Kafka event</td><td>Rate drops &gt;5% week-over-week</td></tr>
  <tr><td>Intent coverage rate</td><td><code>out_of_scope</code> / total turns</td><td>&gt;8% and rising over 7 days</td></tr>
  <tr><td>Clarification rate</td><td><code>clarification_needed=true</code> / turns</td><td>&gt;20% sustained</td></tr>
  <tr><td>LLM refusal rate</td><td><code>validate_output</code> stripped content / LLM turns</td><td>&gt;2%</td></tr>
  <tr><td>Follow-up confusion</td><td>Next turn contains "what do you mean?" / "I meant"</td><td>&gt;5%</td></tr>
</table>

<h2>18.5 The Evaluation Flywheel</h2>
<div class="diagram-wrap">
  <div class="diagram-title">Continuous improvement loop</div>
  <div style="font-family:monospace;font-size:12px;line-height:2;color:#c9d1d9;">
    Production failures flagged by online metrics<br>
    &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
    LLM-as-judge pre-screens → human reviews borderline cases (saves 80% review time)<br>
    &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
    Approved samples added to golden dataset → model_eval CI gate re-runs<br>
    &nbsp;&nbsp;&nbsp;&nbsp;↓<br>
    Improved prompt deployed → better online metrics<br>
    &nbsp;&nbsp;&nbsp;&nbsp;↓ (loop)
  </div>
</div>
<p><strong>Active learning in code</strong> — log samples where the model is uncertain:</p>
<pre><code class="language-python">if classification.confidence &lt; 0.70:  # your P10 threshold
    await kafka_producer.send("annotation_queue", {
        "normalized_message": state["normalized_message"],
        "predicted_intent": classification.main_intent,
        "confidence": classification.confidence,
        "trigger": "low_confidence",
    })</code></pre>

<h2>18.6 The Cold Start Problem</h2>
<div class="callout callout-misconception">
  <strong>⚠️ Common Misconception</strong>
  "We can't deploy until we have enough data." — The best data comes from production traffic. Deploy to 1% with aggressive monitoring on day 1. Synthetic seed data gets you to a functional baseline; real users show you what you missed.
</div>
<p><strong>Week 0 strategy:</strong></p>
<ol style="margin-left:20px;line-height:2;font-size:14px;">
  <li><strong>Synthetic data</strong> — generate 10 examples per intent via LLM prompt. 20 intents × 10 examples = 200 seed samples in 1 hour, ~$0.20.</li>
  <li><strong>Shadow mode</strong> — 5% of traffic through both old and new system. Compare and flag divergence.</li>
  <li><strong>Internal users first</strong> — your own team as beta users. They give structured feedback and don't churn on errors.</li>
  <li><strong>Progressive rollout</strong> — 1% → 5% → 20% → 100% with online metric monitoring at each stage.</li>
</ol>

<h2>A.4 Features — What Goes In</h2>
<pre><code class="language-python"># Weak features for ETA prediction:

# Strong features:

    "distance_meters": 42000,
    "hour_of_day": 17,             # Rush hour matters more than exact timestamp
    "day_of_week": 4,              # Friday pm differs from Monday morning (same hour)

<p>If you don't include <code>hour_of_day</code>, the model cannot learn that rush hour adds 15 minutes. Feature engineering is where most ML value comes from in structured data problems.</p>
<div class="callout callout-info"><strong>What is a Feature Store and when do you need one?</strong>
<code>current_avg_speed_kmh</code> comes from somewhere — it's pre-computed from GPS data, aggregated over a sliding 5-minute window, and stored so both the training pipeline and the real-time inference service can read it. That shared storage layer is called a <strong>Feature Store</strong>.
<br><br>
Without it, you get <strong>training-serving skew</strong>: training computed "speed averaged over last 5 min" but at serving time someone accidentally computes "last 15 min" — the model behaves differently than trained.
<br><br>

<h2>A.5 Evaluation Metrics</h2>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0">── 2×2 Confusion Matrix ─────────────────────────────────────────────────────
                    PREDICTED POSITIVE    PREDICTED NEGATIVE
ACTUAL POSITIVE  │  TP (True Positive)  │  FN (False Negative)  │
                 │  Hit — model correct │  Miss — dangerous!    │
─────────────────┼──────────────────────┼───────────────────────┤
ACTUAL NEGATIVE  │  FP (False Positive) │  TN (True Negative)   │
                 │  False alarm          │  Correct rejection     │

Precision = TP / (TP + FP)   "Of all flagged, how many were real?"
Recall    = TP / (TP + FN)   "Of all real positives, how many did we catch?"
F1        = 2 × (P × R) / (P + R)  harmonic mean

Housing.com intent classifier:
  High precision → fewer wrong tool calls → cheaper (no wasted API calls)
  High recall    → fewer missed intents → better UX (user gets right response)
  Fraud detection: optimise recall (FN = missed fraud = expensive)
  Spam filter:    optimise precision (FP = blocked real email = user complaint)

Threshold effect: lower threshold → more TP + more FP (↑recall, ↓precision)

<h2>A.6 Batch vs Online Inference</h2>
<p><strong>Batch:</strong> Run model on many inputs offline, store results. Pre-compute "top 20 restaurants per user" nightly. Cheap and cacheable but stale.</p>
<p><strong>Online:</strong> Run per request in real-time. Required when input depends on current state. Must be fast enough to not block the UI.</p>
<table>
  <tr><th>System</th><th>Pattern</th><th>Why</th></tr>
  <tr><td>Housing.com SLM</td><td>Online only</td><td>Must respond to the actual message just sent</td></tr>
  <tr><td>Uber ETA</td><td>Hybrid — batch pre-compute 65%, online 35%</td><td>What's batch: <strong>route geometry</strong> (distance, road graph, turn-by-turn) between common zone pairs. This doesn't change with traffic. What's online: ML model takes pre-computed route + real-time traffic features (from Feature Store, refreshed every 5 min) → final ETA. The 65% cache hit is for route geometry, not for the final prediction — that's always fresh.</td></tr>
  <tr><td>Uber Eats recommendations</td><td>Hybrid — batch pre-rank top 200, online re-rank by ETA</td><td>Restaurant ranking is slow; availability check is fast and must be live</td></tr>
</table>

<h2>C.2 TypedDict vs Pydantic vs Dataclass</h2>
<pre><code class="language-python">from typing import TypedDict, Optional

# TypedDict: pipeline state (BotState) — dict-compatible, zero validation overhead
class BotState(TypedDict):
    session_id: str
    normalized_message: str
    classification: Optional[dict]   # Optional = might be None

# Pydantic: API request/response schemas — validation + auto-generated docs
from pydantic import BaseModel
class QuizRequest(BaseModel):
    module_id: int
    num_questions: int = 3           # Default value — like TypeScript default parameter

req = QuizRequest(module_id=1)      # Validates + fills defaults
req.model_dump()                    # → {"module_id": 1, "num_questions": 3}
# Pydantic v2 (pip install pydantic>=2.0): use .model_dump(), NOT .dict()
# .dict() still works in v2 but is deprecated — LangChain tutorials online use .dict()
# because they were written for v1. Check: import pydantic; pydantic.__version__

# Dataclass: internal data containers — typed, no framework overhead
from dataclasses import dataclass
@dataclass
class NodeResult:
    success: bool
    data: dict
    latency_ms: float</code></pre>
<div class="callout callout-tip">
  <strong>Rule:</strong> Pipeline state flowing through nodes → <code>TypedDict</code>. FastAPI request/response body → <code>Pydantic BaseModel</code>. Internal struct, no serialization → <code>@dataclass</code>.
</div>

<h2>C.3 async/await — The One Difference That Matters</h2>
<div class="callout callout-warn">
  <strong>Python hides this from JS engineers</strong>
  JavaScript's event loop is always running. Python's must be explicitly started: <code>asyncio.run(main())</code>. In FastAPI: the framework manages it.<br><br>
  The practical impact in this codebase:
  Inside LangGraph nodes (sync context) → use <code>queue.put_nowait(frame)</code> — non-blocking, no event loop required.
  Inside FastAPI endpoints (async context) → use <code>await queue.get()</code> — yields control to event loop.
  This is why the bridge pattern in Module 1.4 is designed that way.
  <br><br>
  <strong>Does put_nowait ever fail?</strong> Only if the queue has a <code>maxsize</code> limit — then it raises <code>QueueFull</code>. In this codebase, the queue is created as <code>asyncio.Queue()</code> with no maxsize argument (see <code>src/api/chat.py</code>). Default maxsize=0 means <strong>unbounded</strong> — <code>put_nowait</code> never raises. If you ever bound the queue (for memory protection), wrap <code>put_nowait</code> in try/except and log the dropped frame rather than crashing the pipeline.
</div>
<pre><code class="language-python"># WRONG: sequential (accidentally doubles latency)
properties = await fetch_properties(filters)    # Wait for finish
locality   = await fetch_locality_data(loc)     # THEN start
# Total time = sum of both

# RIGHT: concurrent (asyncio.gather = Promise.all)
properties, locality = await asyncio.gather(
    fetch_properties(filters),
    fetch_locality_data(loc)
)
# Total time = slowest one, not sum</code></pre>

<h2>23.1 What LangChain Actually Is</h2>
<p>LangChain is a <strong>composability layer</strong> over LLMs — not a framework. It provides LCEL (a standard interface for chaining components), 200+ integrations, and abstractions like <code>Runnable</code>, <code>Retriever</code>, <code>Memory</code>, and <code>OutputParser</code>.</p>
<div class="callout callout-info">
  <strong>What LangChain is NOT</strong>
  It doesn't host models, doesn't manage agent state (that's LangGraph), and isn't required — but it dramatically reduces boilerplate for common patterns.
</div>
<pre><code class="language-python"># Without LangChain
prompt_text = template.format(context=ctx, question=q)
raw = openai.chat.completions.create(messages=[{"role":"user","content":prompt_text}])
parsed = json.loads(raw.choices[0].message.content)

# With LCEL — same result, composable, swappable
chain = prompt | llm | JsonOutputParser()
parsed = chain.invoke({"context": ctx, "question": q})</code></pre>

<h2>23.2 LCEL — LangChain Expression Language</h2>
<p>LCEL uses <code>|</code> (pipe) to compose <code>Runnable</code> objects. Every component — prompt, model, parser, retriever — implements the same interface.</p>
<pre><code class="language-python">from langchain_core.prompts import ChatPromptTemplate
from langchain_anthropic import ChatAnthropic
from langchain_core.output_parsers import StrOutputParser
from langchain_core.runnables import RunnableParallel

prompt = ChatPromptTemplate.from_template("Classify: {text}")
llm   = ChatAnthropic(model="claude-haiku-4-5-20251001")
chain = prompt | llm | StrOutputParser()
result = chain.invoke({"text": "I want a 2BHK in Bandra"})

# Parallel: both chains run concurrently (like Promise.all)
parallel = RunnableParallel(intent=intent_chain, sentiment=sentiment_chain)
result = parallel.invoke({"text": user_input})
# {"intent": "property_search", "sentiment": "neutral"}</code></pre>
<p>Every <code>Runnable</code> supports <code>.invoke()</code>, <code>.ainvoke()</code>, <code>.batch()</code>, <code>.stream()</code>, and <code>.astream()</code>. Writing <code>LLMChain(...)</code> in an interview signals outdated LangChain knowledge — LCEL is the current API.</p>
<div class="callout callout-info"><strong>What LCEL actually does at runtime</strong>
The <code>|</code> operator builds a <code>RunnableSequence</code> object — it is <strong>lazy</strong> (no execution at pipe-time, like building an RxJS observable). Execution starts only when you call <code>.invoke()</code> or <code>.ainvoke()</code>.
<br><br>
<code>.invoke()</code> is <strong>sequential</strong>: calls each step in order, passing the output of step N as input to step N+1. No parallelism. If step 2 (LLM call) throws a <code>RateLimitError</code>, the exception propagates immediately — LangChain wraps it as an <code>openai.RateLimitError</code> (or Anthropic equivalent) so you see the provider's original exception type, not a LangChain wrapper. Add retry at the chain level with <code>chain.with_retry(stop_after_attempt=3, wait_exponential_jitter=True)</code>.
<br><br>
<strong>RunnableParallel concurrency model:</strong> when called with <code>.invoke()</code> (sync), it uses a thread pool executor. When called with <code>.ainvoke()</code> (async), it uses <code>asyncio.gather</code>. <strong>Fail-fast</strong>: if one branch raises, the exception propagates and other branches may still be running — use <code>.ainvoke()</code> inside FastAPI and wrap individual branches in try/except if you need partial results.
</div>

<h2>23.5 Text Splitters — The Decision That Determines RAG Quality</h2>
<table>
  <tr><th>Splitter</th><th>Best for</th><th>Key parameters</th></tr>
  <tr><td><code>RecursiveCharacterTextSplitter</code></td><td>General prose, unknown format</td><td><code>chunk_size=512, chunk_overlap=50</code></td></tr>
  <tr><td><code>MarkdownHeaderTextSplitter</code></td><td>Markdown docs, wikis — splits by heading</td><td><code>headers_to_split_on</code></td></tr>
  <tr><td><code>HTMLHeaderTextSplitter</code></td><td>Web pages, HTML documentation</td><td><code>headers_to_split_on</code></td></tr>
  <tr><td><code>RecursiveCharacterTextSplitter.from_language(Language.PYTHON)</code></td><td>Code — splits by class/function first</td><td><code>language=Language.PYTHON|JS|TS</code></td></tr>
  <tr><td><code>SemanticChunker</code></td><td>Dense prose where topic shifts mid-section</td><td><code>embeddings, breakpoint_threshold_type</code></td></tr>
  <tr><td><code>TokenTextSplitter</code></td><td>When you need exact token counts</td><td><code>chunk_size=256</code> (tokens)</td></tr>
</table>
<pre><code class="language-python">from langchain_text_splitters import RecursiveCharacterTextSplitter, Language
from langchain_experimental.text_splitter import SemanticChunker

# Default: works for most prose
splitter = RecursiveCharacterTextSplitter(chunk_size=512, chunk_overlap=50)

# Code: respects function/class boundaries
code_splitter = RecursiveCharacterTextSplitter.from_language(
    language=Language.PYTHON, chunk_size=1000, chunk_overlap=100
)

# Semantic: splits where topic actually changes (needs embedding model)
semantic = SemanticChunker(embeddings=embeddings, breakpoint_threshold_type="percentile")</code></pre>
<div class="callout callout-tip">
  <strong>Decision rule</strong>
  Default: <code>RecursiveCharacterTextSplitter</code>. Switch to <code>MarkdownHeaderTextSplitter</code> when document structure matters. Use <code>SemanticChunker</code> when RAGAS context relevance is low despite good embedding model. Use code splitter for repositories.
</div>
<div class="callout callout-warn"><strong>"Why not just send the whole document?"</strong>
With 200K token context window, a 100-page PDF (~50K tokens) fits in a single prompt. For one document, <strong>long-context inference is simpler and correct</strong> — skip RAG entirely.
<br><br>
RAG exists for <strong>corpora too large to fit in context</strong>: 10,000 property listings, a company knowledge base with 50,000 pages, a code repository with 1M lines. You cannot stuff all 10,000 listings into every prompt — you retrieve the 5 most relevant chunks for <em>this specific query</em>.
<br><br>
<strong>Before/after of chunking a property listing:</strong><br>
Input: "Sea View 3BHK in Bandra West. 1,450 sqft. 2 covered parking slots. Price ₹2.5Cr. Building amenities: gym, pool. Possession Q2 2026. RERA registered."<br>
After splitting at 512 chars with 50-char overlap:<br>
Chunk 1: "Sea View 3BHK in Bandra West. 1,450 sqft. 2 covered parking slots. Price ₹2.5Cr. Building amenities: gym, pool."<br>
Chunk 2: "Building amenities: gym, pool. Possession Q2 2026. RERA registered." ← 50-char overlap repeats the last sentence of chunk 1 so context bridges the boundary.
<br><br>
chunk_overlap prevents the answer from being split across chunks with no bridge.
</div>

<h2>23.6 Retrievers</h2>
<div class="callout callout-info"><strong>BM25 explained for non-search engineers</strong>
BM25 (Best Match 25) is keyword-based search — same family as Elasticsearch and Postgres full-text search (<code>tsvector</code>). It counts how often your query terms appear in each document, weighted by how rare those terms are across all documents.
<br><br>
Where it beats vector search: a user types "HOM-9873" (a specific property ID). Vector search finds "properties in Bandra" (semantic match) and misses the exact ID. BM25 finds it because it does exact keyword matching.
<br><br>
Where vector search beats BM25: user types "seaside apartment" but the listing says "sea-facing flat." BM25 scores zero (no keyword match). Vector search finds it because "seaside" and "sea-facing" are semantically close.
<br><br>
<strong>EnsembleRetriever weights explained:</strong> weights=[0.4, 0.6] means final_score = 0.4 × bm25_score + 0.6 × cosine_similarity. Both retrievers fetch k=5 results each; the ensemble deduplicates and re-ranks — you get k=5 total, not 10. Setting weights to [0.5, 0.5] gives equal weight; tune based on your domain (keyword-heavy domain = higher BM25 weight).
</div>
<pre><code class="language-python">from langchain.retrievers import ContextualCompressionRetriever, MultiQueryRetriever, EnsembleRetriever
from langchain_community.retrievers import BM25Retriever

# Hybrid: keyword + semantic (best default for production)
bm25 = BM25Retriever.from_documents(docs); bm25.k = 5
vector = vectorstore.as_retriever(search_kwargs={"k": 5})
hybrid = EnsembleRetriever(retrievers=[bm25, vector], weights=[0.4, 0.6])

# Multi-query: LLM generates 3 query variations, deduplicates results
# Use when user query vocabulary doesn't match document vocabulary
multi_query = MultiQueryRetriever.from_llm(retriever=vector, llm=llm)

# Contextual compression: strips irrelevant sentences from each chunk
# More expensive (extra LLM call) but dramatically improves context relevance
from langchain.retrievers.document_compressors import LLMChainExtractor
compressor = LLMChainExtractor.from_llm(llm)
compressed = ContextualCompressionRetriever(base_compressor=compressor, base_retriever=hybrid)</code></pre>

from pydantic import BaseModel

class PropertyIntent(BaseModel):

<pre><code class="language-python">from langchain.callbacks.base import BaseCallbackHandler

class CostTrackingCallback(BaseCallbackHandler):

<h2>24.1 Why LangGraph Exists</h2>
<p>LangChain chains are <strong>acyclic</strong> — data flows one direction. This breaks for agents that need loops, conditional branching, or human checkpoints.</p>
<div class="diagram-wrap">
  <div class="diagram-title">Chain vs Graph execution model</div>
  <pre style="margin:0;border:none;background:transparent;font-size:12px">LangChain chain:           LangGraph graph:
A → B → C → D             A → B → C
(fixed, acyclic)                ↓   ↑
                               D ←─┘  loop until condition met
                                ↓
                           conditional edge:
                           low_confidence  → E (clarify)
                           high_confidence → F (respond)</pre>
</div>
<p>LangGraph is the right tool when your pipeline has <strong>branching logic, loops, or human checkpoints</strong>. For a simple Q&amp;A call with no cycles, a plain LCEL chain is sufficient.</p>
<div class="callout callout-tip"><strong>LCEL vs LangGraph — the decision rule</strong>
<table style="font-size:12px;margin:4px 0">
  <tr><th>Use LCEL if...</th><th>Use LangGraph if...</th></tr>
  <tr><td>Single linear pass, no branching</td><td>Any conditional routing</td></tr>
  <tr><td>No multi-turn state</td><td>Multi-turn persistence needed</td></tr>
  <tr><td>No loops</td><td>Agent needs to loop/retry</td></tr>
  <tr><td>No human approval steps</td><td>Human-in-the-loop required</td></tr>
</table>
<strong>Practical recommendation:</strong> Start with LangGraph even for simple pipelines. The overhead is minimal and you avoid a full rewrite when requirements grow. In the same codebase, even the safety check node (2 lines) uses LangGraph because the graph machinery is already wired up.<br><br>
<strong>Packages:</strong> LangGraph is separate from LangChain — install both: <code>pip install langgraph langchain-core langchain-anthropic</code>. LangGraph depends on langchain-core but not on the full LangChain package.
</div>

<h2>24.2 State, Nodes, and Edges</h2>
<p>Every LangGraph graph revolves around a single typed state object — think of it as the <strong>Redux store</strong> for your agent. You define it once as a TypedDict, and every node in the graph reads from and writes to this shared store. Nodes return only the fields they changed; LangGraph merges the partial update into the full state — exactly like a Redux reducer returning <code>{ ...state, updatedField: newValue }</code>.</p>
<p><code>StateGraph(AgentState)</code> is the equivalent of <code>createStore(reducer, AgentState)</code>: you're binding the graph's execution to a specific state schema. Every node function that runs in this graph is guaranteed to receive a state object with exactly the fields defined in <code>AgentState</code>.</p>
<pre><code class="language-python">from typing import TypedDict, Annotated
from langgraph.graph import StateGraph, END
from langgraph.graph.message import add_messages

class AgentState(TypedDict):
    messages: Annotated[list, add_messages]  # reducer: appends, not replaces
    #         ^^^^^^^^  What is Annotated?
    #         Python's Annotated[T, metadata] attaches metadata to a type hint.
    #         Here: "messages is a list (T), and LangGraph should use the
    #         add_messages function as its reducer (metadata)."
    #         TypeScript equivalent: type Messages = Message[] & { __reducer: typeof addMessages };
    #         (TypeScript can't express this natively — Python's runtime metadata is more flexible)
    classification: dict | None
    needs_clarification: bool

def classify_node(state: AgentState) -> dict:
    result = classifier.classify(state["messages"][-1].content)
    return {"classification": result, "needs_clarification": result["confidence"] &lt; 0.6}

def route_after_classify(state: AgentState) -> str:
    return "clarify" if state["needs_clarification"] else "respond"

graph = StateGraph(AgentState)
graph.add_node("classify", classify_node)
graph.add_node("respond", respond_node)
graph.add_node("clarify", clarify_node)
graph.set_entry_point("classify")
graph.add_conditional_edges("classify", route_after_classify,
    {"clarify": "clarify", "respond": "respond"})
graph.add_edge("respond", END)
app = graph.compile()</code></pre>
<div class="callout callout-warn">
  <strong>The add_messages gotcha</strong>
  Without the <code>add_messages</code> reducer annotation, returning <code>{"messages": [new_msg]}</code> <em>replaces</em> the entire message list. With it, the new message is appended. This is the most common LangGraph mistake.<br><br>
  <strong>Concrete failure:</strong> if you write <code>messages: list</code> instead of <code>messages: Annotated[list, add_messages]</code>, then after turn 2 your state has only the latest message — all history is gone. Symptom: the LLM keeps responding as if it's turn 1, ignoring context. Debug by printing <code>len(state["messages"])</code> — it should grow every turn.<br><br>
  <strong>How LangGraph reads the annotation:</strong> at <code>graph.compile()</code> time, LangGraph calls Python's <code>get_type_hints(AgentState, include_extras=True)</code> and extracts the second argument of <code>Annotated</code> as the reducer function. This happens once at compile time — not at runtime per message.
</div>

<h2>24.3 Cycles and Loops — Infinite Loop Prevention</h2>
<pre><code class="language-python">def route(state: AgentState) -> str:
    if state["attempts"] &gt;= MAX_ATTEMPTS:
        return "fallback"           # always provide an exit
    if len(state["results"]) &lt; 3:
        return "search_again"       # loop back
    return "respond"

graph.add_conditional_edges("evaluate", route,
    {"search_again": "search", "respond": "respond", "fallback": "fallback"})</code></pre>
<p>Always add an <code>attempts</code> counter in state with a hard limit. Without it, a consistently poor retriever creates an infinite loop.</p>
<div class="callout callout-tip"><strong>LangGraph's built-in recursion limit</strong>
LangGraph has a compile-time <code>recursion_limit</code> parameter as an absolute safety net — even if your attempts counter has a bug, the graph cannot loop forever.
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:6px;border-radius:4px;margin-top:4px">from langgraph.errors import GraphRecursionError

# Compile with safety limit (default=25 — set lower during dev to fail fast)
app = graph.compile(recursion_limit=10)

# Catch in FastAPI handler
try:
    result = app.invoke(input, config=config)
except GraphRecursionError:
    return {"error": "Could not complete in the allowed steps — please rephrase"}
</pre>
During development: set <code>recursion_limit=5</code> to catch loops immediately. In production: 25 is typically safe; a 19-node pipeline with retries won't exceed it under normal operation.
</div>

<h2>24.4 Checkpointing — Multi-Turn Persistence</h2>
<pre><code class="language-python">from langgraph.checkpoint.memory import MemorySaver
from langgraph.checkpoint.sqlite import SqliteSaver

# Development: in-memory (lost on restart)
app = graph.compile(checkpointer=MemorySaver())

# Production: SQLite / PostgreSQL (persistent)
with SqliteSaver.from_conn_string("checkpoints.db") as cp:
    app = graph.compile(checkpointer=cp)

# thread_id isolates each conversation's state
config = {"configurable": {"thread_id": "user_123_session_456"}}
app.invoke({"messages": [HumanMessage("2BHK in Bandra")]}, config=config)
# Next turn — LangGraph loads full prior state automatically from checkpoint
app.invoke({"messages": [HumanMessage("Under 2Cr")]}, config=config)</code></pre>
<div class="callout callout-warn"><strong>What exactly gets checkpointed — and the stale state trap</strong>
The checkpoint saves the <strong>entire AgentState dict</strong> including all fields: messages, classification, needs_clarification, etc. When turn 2 starts, <strong>all fields from turn 1 persist</strong> — including classification from the previous intent.
<br><br>
<strong>The most common multi-turn bug:</strong> Node A classifies turn 1 as "search_properties" and returns <code>{"classification": result}</code>. Turn 2 starts — classification still has the old value. If node A fails or is skipped on turn 2, the stale classification from turn 1 routes the request incorrectly.
<br><br>
<strong>Fix:</strong> Nodes that own a field must always reset it:
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:6px;border-radius:4px;margin-top:4px">def classify_node(state: AgentState) -> dict:
    result = classifier.classify(state["messages"][-1].content)
    return {
        "classification": result,   # set fresh
        "needs_clarification": ..., # set fresh
        # DON'T carry forward the old classification silently
    }
</pre>
Memory size: yes, the full state is saved including the messages list. 50 turns × 200 tokens each = ~10KB per checkpoint write. For production, use PostgreSQL-backed checkpointing and set a max_messages sliding window to prevent unbounded growth.
</div>
<div class="callout callout-tip">
  <strong>This codebase vs LangGraph checkpointing</strong>
  <code>session_store.py</code> + Redis is a hand-rolled equivalent. The custom implementation gives more control (per-field expiry, Lua CAS) but requires more maintenance. For new projects, <code>langgraph-checkpoint-postgres</code> is the cleaner path.
</div>

<h2>24.5 Human-in-the-Loop (HITL)</h2>
<pre><code class="language-python"># Pause BEFORE executing "execute_action" — action has NOT run yet
app = graph.compile(checkpointer=memory, interrupt_before=["execute_action"])

result = app.invoke(input, config=config)   # runs until interrupt

# Human reviews proposed action from state
pending = app.get_state(config)
proposed = pending.values["proposed_action"]

# LangGraph 0.2+: use Command for explicit, stable resume semantics
from langgraph.types import Command

if human_approves(proposed):
    # Command(resume=None) = resume with no new input (preferred over invoke(None))
    app.invoke(Command(resume=None), config=config)
else:
    # Inject a rejection message and resume — state gets new message appended
    app.invoke(
        Command(update={"messages": [HumanMessage("Action rejected.")]}),
        config=config,
    )</code></pre>
<div class="callout callout-warn">
  <strong>invoke(None) vs Command(resume=None)</strong>
  Both resume a checkpoint, but <code>invoke(None)</code> behaviour is technically version-dependent. <code>Command(resume=...)</code> was introduced in LangGraph 0.2 as the explicit, stable API. Use <code>Command</code> in production code; <code>invoke(None)</code> is fine for quick prototypes.
</div>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── HITL Sequence: 4 Actors, 2 HTTP Requests ─────────────────────────────────

   User Browser      FastAPI Server     LangGraph App    Checkpoint Store
        │                  │                  │                  │
        │──POST /chat──────►│                  │                  │
        │                  │──app.invoke()────►│                  │
        │                  │                  │──save state──────►│
        │                  │                  │──[INTERRUPT: execute_action]
        │                  │◄─{state, interrupt}                  │
        │◄──"Proposed: X"──│                  │                  │
        │                  │                  │                  │
  [human reads, decides]   │                  │                  │
        │                  │                  │                  │
        │──POST /approve───►│                  │                  │
        │                  │──app.invoke(Command(resume=None))───►│
        │                  │                  │◄─load state───────│
        │                  │                  │ [resumes at execute_action]
        │                  │                  │──save final state►│
        │                  │◄─{completed}─────│                  │
        │◄──final result───│                  │                  │

Key facts:
• Interrupt = serialise state to checkpoint → return from invoke() → server responds HTTP
• Resume   = second HTTP request → load checkpoint → continue from interrupt point
• State survives server restart iff using SqliteSaver/PostgresSaver (not MemorySaver)
• thread_id in config ties the two requests together</pre>
<p><strong>When to use HITL:</strong> before deleting/modifying records, before sending external communications, before financial transactions, before any irreversible action.</p>

<h2>24.6 Subgraphs — Composing Pipelines</h2>
<pre><code class="language-python"># Each specialist is a compiled subgraph with its own state
search_app = build_search_graph().compile()

def search_subgraph_node(state: AgentState) -> dict:
    result = search_app.invoke({
        "query": state["messages"][-1].content,
        "filters": state["classification"],
    })
    return {"search_results": result["results"]}

# Subgraph appears as a single node in the parent graph
parent_graph.add_node("search", search_subgraph_node)</code></pre>
<p>Subgraphs enable independent development and testing of each specialist agent. Module 34 uses this pattern for multi-agent systems.</p>

<h2>24.7 Streaming</h2>
<pre><code class="language-python"># Stream node events — see which node ran and its output
async for event in app.astream(input, config=config):
    node_name = list(event.keys())[0]
    print(f"Node '{node_name}' completed")

# Stream LLM tokens as they generate
async for event in app.astream(input, config=config, stream_mode="messages"):
    if hasattr(event[0], "content"):
        print(event[0].content, end="", flush=True)</code></pre>

<h2>26.1 How Vector Search Works</h2>
<div class="callout callout-info"><strong>What an embedding actually is</strong>
The numbers themselves are meaningless — <code>-0.87</code> in position 2 doesn't "mean" anything in isolation. <strong>It is the spatial relationship between vectors that encodes meaning.</strong>
<br><br>
Imagine plotting 5 texts in 2D space (simplified from 1536D):
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:6px;border-radius:4px;margin-top:4px">           Y
           ↑
  "2BHK Bandra" •  • "flat Mumbai"   ← property cluster
  "apartment" •
                            • "Hello" • "Hi there"  ← greeting cluster
                -------→ X
</pre>
"2BHK" and "flat" land near each other because the embedding model was trained on billions of texts where these words appear in similar contexts. The model adjusts its weights (billions of numbers) until similar meanings produce similar vector directions.
<br><br>
<strong>Cosine similarity vs Euclidean distance:</strong> cosine measures the <em>angle</em> between two vectors, ignoring magnitude. A short document and a long document about the same topic will have similar cosine similarity (same direction) but very different Euclidean distance (different magnitudes). Use cosine for text — document length shouldn't affect relevance.
<br><br>
<em>Numeric example:</em> A=[0.6, 0.8], B=[0.3, 0.4] (B is half the magnitude of A). Euclidean: 0.5 (seems distant). Cosine: 1.0 (same direction = same meaning). For text where word count varies, cosine is correct.

<p>Text is converted to a dense vector by a neural embedding model. Semantically similar text lands close together in this high-dimensional space. Vector search finds the nearest neighbours to the query embedding.</p>
<div class="diagram-wrap">
  <pre style="margin:0;border:none;background:transparent;font-size:12px">"2BHK in Bandra"               → [0.12, -0.87, 0.44, ..., 0.31]  (1536 dims)
"2 bedroom flat, Bandra West"  → [0.11, -0.85, 0.46, ..., 0.29]

Cosine similarity = 0.97  ← semantically near, returned first

"3BHK in Juhu"                 → [0.08, -0.42, 0.61, ..., 0.17]
Cosine similarity = 0.71  ← further away, lower rank</pre>
</div>
<div class="callout callout-info">
  <strong>Why not exact nearest-neighbour search?</strong> Finding the truly exact closest vector requires comparing your query against every vector in the database — O(n) dot products. At 10 million vectors of 1536 dimensions each, that's 10 million × 1536 multiplications per query, taking seconds. <strong>ANN (Approximate Nearest Neighbour)</strong> algorithms trade a small amount of recall accuracy (typically 95–99% of exact results) for orders-of-magnitude speed. In practice 5% recall loss is invisible to users — they can't tell if result #7 vs #8 was swapped.
  <br><br>
  <strong>HNSW</strong> (Hierarchical Navigable Small World) builds a multi-layer graph. Think of it like a highway system: the top layer has few nodes with long-range connections (motorways), lower layers have more nodes with local connections (streets). At query time, you enter at the top layer, greedily navigate to the nearest node, descend to the next layer, repeat. Each layer narrows the search. Result: O(log n) comparisons instead of O(n). Trade-off: the graph itself must be stored in RAM — ~100 bytes per vector beyond the raw vectors.
  <br><br>
  <strong>IVF</strong> (Inverted File Index) runs k-means clustering on all vectors first (the "training step" — done once at index creation). At query time, it finds the nearest cluster centres, then only searches vectors within those clusters. Uses less RAM than HNSW (no graph stored), but recall drops if the query doesn't cluster well with the answers.
</div>
<table>
  <tr><th>Algorithm</th><th>How it works</th><th>Used in</th></tr>
  <tr><td><strong>HNSW</strong></td><td>Navigable small-world graph; greedy search per layer. Better recall, more memory.</td><td>pgvector, Weaviate, Qdrant</td></tr>
  <tr><td><strong>IVF</strong></td><td>k-means cluster index; search nearest clusters only. Less memory, needs training step.</td><td>pgvector (ivfflat), Pinecone</td></tr>
  <tr><td><strong>ScaNN</strong></td><td>Product quantisation + tree. Google-scale throughput.</td><td>Vertex AI Vector Search</td></tr>
</table>
<p><strong>Default:</strong> HNSW unless you're at 100M+ vectors and RAM is constrained.</p>

<h2>26.4 pgvector — Vector Search in Your Existing PostgreSQL</h2>
<pre><code class="language-sql">CREATE EXTENSION IF NOT EXISTS vector;

CREATE TABLE property_embeddings (
    id        TEXT PRIMARY KEY,
    content   TEXT,
    metadata  JSONB,
    embedding vector(1536)
);

-- HNSW index: better recall, more memory
-- Use CONCURRENTLY so Postgres builds the index without locking the table.
-- Without it, the table is locked for the entire build (minutes on large tables).
--
-- m = 16: number of bidirectional links per node in the HNSW graph.
--   Higher m → better recall + faster search, but more RAM and slower index build.
--   Default 16 is right for most workloads. Use m=32 if recall is below target.
--
-- ef_construction = 64: candidate list size during graph construction.
--   Higher ef_construction → better graph quality (higher recall), slower index build.
--   64 is the standard starting value. Use 128 if you can afford a longer build time.
--   Does NOT affect query speed — only affects index build time and recall ceiling.
CREATE INDEX CONCURRENTLY ON property_embeddings
    USING hnsw (embedding vector_cosine_ops)
    WITH (m = 16, ef_construction = 64);

-- Similarity search with SQL filter
SELECT content, 1 - (embedding &lt;=&gt; $1) AS similarity
FROM property_embeddings
WHERE metadata->>'city' = 'Mumbai'
ORDER BY embedding &lt;=&gt; $1
LIMIT 5;</code></pre>

    <li>A/B test: route 10% of queries to the new index, compare RAGAS scores.</li>
    <li>Promote new index when confirmed better. Decommission old index.</li>

<div class="callout callout-info"><strong>Why does the LLM need a search engine — doesn't it already know everything?</strong>
The LLM was trained on the internet (up to its cutoff date) and knows general facts. But it does NOT know your company's specific data: your property listings, current prices, unit availability, internal policies, or anything that isn't public.
<br><br>
Without RAG: "What is the price of Oberoi Exquisite, Tower 3, flat 24B?" → LLM has no idea. It will confidently generate a plausible-sounding but invented price. This is hallucination.
<br><br>
With RAG: you search your database, retrieve the actual listing, inject it into the prompt → LLM reads real data, synthesizes a natural-language answer from facts. The LLM's job is reasoning and synthesis — not memorization.
<br><br>
This is the entire reason <code>fetch_data_node → build_prompt_node → llm_node</code> is the pipeline's core path. Fetch real data → inject it → let the LLM reason from it. Without that chain, every AI answer is guesswork.
</div>
<h2>27.1 Naive RAG — Baseline and Failure Modes</h2>
<div class="diagram-wrap">
  <div class="diagram-title">Naive RAG pipeline</div>
  <pre style="margin:0;border:none;background:transparent;font-size:12px">Corpus → fixed-size chunk → embed → Vector DB
                                         ↑
                              query_embedding = embed(user_query)
                              top-k cosine similarity
                                         ↓
                     stuff retrieved chunks into system prompt → LLM</pre>
</div>
<table>
  <tr><th>Failure</th><th>Symptom</th><th>Root cause</th></tr>
  <tr><td>Vocabulary mismatch</td><td>Correct doc not retrieved</td><td>"API throttling" in query vs "rate limiting" in doc</td></tr>
  <tr><td>Lost-in-the-middle</td><td>Doc retrieved, answer missed</td><td>Answer at chunk position 4 of 8; LLM ignores middle</td></tr>
  <tr><td>Multi-hop failure</td><td>Partial answer</td><td>Two separate docs needed; top-k returns both or neither</td></tr>
  <tr><td>Context overflow</td><td>LLM truncates</td><td>10 × 500-token chunks exceeds useful context</td></tr>
  <tr><td>Stale index</td><td>Outdated confident answer</td><td>Doc updated; embedding not refreshed</td></tr>
</table>

<h2>27.2 Advanced RAG — Three Enhancement Layers</h2>
<h3>Pre-retrieval: improve the query</h3>
<pre><code class="language-python"># 1. Query expansion — multiple phrasings catch vocabulary mismatch
from langchain.retrievers import MultiQueryRetriever
retriever = MultiQueryRetriever.from_llm(retriever=vectorstore.as_retriever(), llm=llm)
# LLM generates 3 variants → union of results from all three

# 2. HyDE — embed a hypothetical answer, not the question
# Answers share vocabulary with documents; questions often don't
hyde_prompt = "Write a property listing that answers: {query}"
hypothetical = llm.invoke(hyde_prompt.format(query=user_query))
query_embedding = embed(hypothetical)   # embed the answer, search with it</code></pre>

<h3>During retrieval: hybrid search + reranking</h3>
<pre><code class="language-python">from langchain.retrievers import EnsembleRetriever, ContextualCompressionRetriever
from langchain_community.retrievers import BM25Retriever
from langchain.retrievers.document_compressors import CohereRerank

# Hybrid: keyword (BM25) + semantic (vector)
hybrid = EnsembleRetriever(
    retrievers=[BM25Retriever.from_documents(docs), vectorstore.as_retriever()],
    weights=[0.4, 0.6],
)

# Cross-encoder rerank: reads query + doc together — more accurate than cosine
reranker = CohereRerank(model="rerank-english-v3.0", top_n=3)
reranked = ContextualCompressionRetriever(base_compressor=reranker, base_retriever=hybrid)
# Pattern: retrieve 10 cheaply → rerank to top 3 accurately. Cost: $0.001/1K searches</code></pre>

<h3>Post-retrieval: contextual compression</h3>
<pre><code class="language-python">from langchain.retrievers.document_compressors import LLMChainExtractor
compressor = LLMChainExtractor.from_llm(llm)
# Before: 500-token chunk — parking, amenities, price, society rules, ...
# After:  "Price: ₹2.5Cr. 2 covered parking slots included."
# Only relevant sentences enter the prompt → higher faithfulness, lower token cost</code></pre>

<h2>27.3 Modular RAG — Route Between Strategies</h2>
<div class="callout callout-info"><strong>How query_type is determined</strong>
The routing function receives <code>query_type</code> — but where does it come from? Two approaches:
<ol style="margin:4px 0">
  <li><strong>LLM classifier (1 extra call):</strong> <code>classify_prompt = "Classify this query as factual_lookup, semantic, or multi_hop. Return one word only.\nQuery: {q}"</code> → call Haiku → get query_type. Cost: ~50ms, ~$0.00005/request. Worth it at high volume with diverse queries.</li>
  <li><strong>Heuristics (free):</strong> queries with entity names (HOM-9873, "Oberoi Exquisite") → factual_lookup. Queries with "similar to", "like" → semantic. Queries with "and also", "same [person/builder]" or multiple entities → multi_hop. Covers 80% of cases with zero cost.</li>
</ol>
Production recommendation: start with heuristics, fall back to LLM classifier when heuristics miss.
</div>
<pre><code class="language-python">def route(query: str, query_type: str):
    if query_type == "factual_lookup":  return bm25_retriever.invoke(query)
    elif query_type == "semantic":      return vector_retriever.invoke(query)
    elif query_type == "multi_hop":     return iterative_retriever.invoke(query)
    else:                               return hybrid_retriever.invoke(query)</code></pre>
<p><strong>Iterative retrieval for multi-hop:</strong> retrieve → read → formulate sub-query → retrieve again. Handles: "properties near the school mentioned in the project brochure under 2Cr" — requires two sequential retrieval steps.</p>
