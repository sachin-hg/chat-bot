// ──────────────────────────────────────────────
//  QUIZ ENGINE
// ──────────────────────────────────────────────
function quizSection(moduleId, title, contentHint) {
  return `<div class="quiz-section" id="quiz-${moduleId}">
    <div class="quiz-header">
      <h3>Test Your Understanding</h3>
      <button class="btn btn-primary btn-sm" onclick="loadQuiz(${moduleId}, '${title.replace(/'/g,"\\'")}', '${contentHint.replace(/'/g,"\\'")}')">Generate Quiz</button>
    </div>
    <div id="quiz-content-${moduleId}"><p style="color:var(--muted);font-size:13px">Click "Generate Quiz" to get AI-generated questions based on this module.</p></div>
  </div>`;
}

async function loadQuiz(moduleId, title, contentHint) {
  const el = document.getElementById(`quiz-content-${moduleId}`);
  el.innerHTML = '<div class="quiz-loading">Generating questions…</div>';
  try {
    const res = await fetch('/learn/api/quiz', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ module_id: moduleId, module_title: title, content_snippet: contentHint, num_questions: 3 })
    });
    const data = await res.json();
    if (!data.questions) throw new Error('No questions');
    if (data._fallback) {
      el.innerHTML = '<p style="color:var(--muted);font-size:11px;margin-bottom:12px">⚡ Using pre-seeded questions (AI quiz generation offline)</p>';
      const wrap = document.createElement('div');
      el.appendChild(wrap);
      renderQuiz(moduleId, data.questions, wrap);
      return;
    }
    renderQuiz(moduleId, data.questions);
  } catch (e) {
    el.innerHTML = `<p style="color:var(--accent3);font-size:13px">Failed to load quiz: ${e.message}</p>`;
  }
}

function renderQuiz(moduleId, questions, targetEl) {
  const el = targetEl || document.getElementById(`quiz-content-${moduleId}`);
  const state = { questions, answers: {}, scores: {}, total: 0, answered: 0 };
  window[`quiz_state_${moduleId}`] = state;

  el.innerHTML = questions.map((q, qi) => renderQuestion(moduleId, q, qi)).join('') +
    `<div id="quiz-submit-${moduleId}" style="margin-top:16px;display:none">
       <button class="btn btn-primary" onclick="submitQuiz(${moduleId})">Check answers</button>
     </div>`;
  setTimeout(() => checkAllAnswered(moduleId), 100);
}

function renderQuestion(moduleId, q, qi) {
  if (q.type === 'mcq') {
    return `<div class="quiz-question" id="qq-${moduleId}-${qi}">
      <div class="quiz-q-text">${qi+1}. ${q.question}</div>
      <div class="quiz-options">
        ${q.options.map((opt, oi) =>
          `<div class="quiz-opt" onclick="selectMCQ(${moduleId},${qi},${oi},'${encodeURIComponent(q.answer)}','${encodeURIComponent(q.explanation||'')}',this)">${opt}</div>`
        ).join('')}
      </div>
      <div id="qfb-${moduleId}-${qi}"></div>
      <div class="quiz-hint" onclick="revealHint(${moduleId},${qi},'${encodeURIComponent(q.hint||'')}')">💡 Show hint</div>
    </div>`;
  }
  return `<div class="quiz-question" id="qq-${moduleId}-${qi}">
    <div class="quiz-q-text">${qi+1}. ${q.question} <span style="font-size:11px;color:var(--accent4)">(${q.type})</span></div>
    <textarea class="quiz-short-input" id="qa-${moduleId}-${qi}" placeholder="Type your answer…" oninput="checkAllAnswered(${moduleId})"></textarea>
    <button class="btn btn-ghost btn-sm" onclick="submitShort(${moduleId},${qi},'${encodeURIComponent(q.question)}','${encodeURIComponent(q.answer)}','${q.type}')">Check this answer</button>
    <div id="qfb-${moduleId}-${qi}"></div>
    <div class="quiz-hint" onclick="revealHint(${moduleId},${qi},'${encodeURIComponent(q.hint||'')}')">💡 Show hint</div>
  </div>`;
}

function selectMCQ(modId, qi, oi, encodedAnswer, encodedExplain, el) {
  const parent = el.closest('.quiz-options');
  parent.querySelectorAll('.quiz-opt').forEach(o => o.classList.remove('selected'));
  el.classList.add('selected');
  const state = window[`quiz_state_${modId}`];
  state.answers[qi] = oi;
  checkAllAnswered(modId);
  const answer = decodeURIComponent(encodedAnswer);
  const explain = decodeURIComponent(encodedExplain);
  const correct = (String(oi) === String(answer) || String(oi) === String(parseInt(answer)));
  const fbEl = document.getElementById(`qfb-${modId}-${qi}`);
  // show immediate feedback for MCQ
  el.classList.add(correct ? 'correct' : 'wrong');
  if (!correct) {
    const opts = parent.querySelectorAll('.quiz-opt');
    const correctIdx = parseInt(answer);
    if (!isNaN(correctIdx) && opts[correctIdx]) opts[correctIdx].classList.add('correct');
  }
  fbEl.innerHTML = `<div class="quiz-feedback ${correct?'fb-correct':'fb-wrong'}">${correct?'✓ Correct! ':'✗ Incorrect. '}${explain}</div>`;
  state.scores[qi] = correct ? 100 : 0;
  state.answered = Object.keys(state.scores).length;
  updateQuizScore(modId);
}

async function submitShort(modId, qi, encodedQ, encodedA, qType) {
  const input = document.getElementById(`qa-${modId}-${qi}`);
  const userAnswer = input.value.trim();
  if (!userAnswer) return;
  const fbEl = document.getElementById(`qfb-${modId}-${qi}`);
  fbEl.innerHTML = '<div class="quiz-loading">Evaluating…</div>';
  try {
    const res = await fetch('/learn/api/evaluate', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        question: decodeURIComponent(encodedQ),
        user_answer: userAnswer,
        correct_answer: decodeURIComponent(encodedA),
        question_type: qType
      })
    });
    const data = await res.json();
    const state = window[`quiz_state_${modId}`];
    state.scores[qi] = data.score;
    state.answered = Object.keys(state.scores).length;
    fbEl.innerHTML = `<div class="quiz-feedback ${data.score>=60?'fb-correct':'fb-wrong'}">
      <strong>Score: ${data.score}/100</strong> — ${data.feedback}
      ${data.what_to_review ? `<br><em>Review: ${data.what_to_review}</em>` : ''}
    </div>`;
    updateQuizScore(modId);
  } catch (e) {
    fbEl.innerHTML = `<div class="quiz-feedback fb-wrong">Evaluation failed: ${e.message}</div>`;
  }
}

function revealHint(modId, qi, encodedHint) {
  const hint = decodeURIComponent(encodedHint);
  const fbEl = document.getElementById(`qfb-${modId}-${qi}`);
  if (!fbEl.innerHTML.includes('Hint:')) {
    fbEl.innerHTML += `<div style="font-size:12px;color:var(--muted);margin-top:6px;font-style:italic">Hint: ${hint}</div>`;
  }
}

function checkAllAnswered(modId) {
  const submitEl = document.getElementById(`quiz-submit-${modId}`);
  if (submitEl) submitEl.style.display = 'block';
}

async function submitQuiz(modId) {
  const state = window[`quiz_state_${modId}`];
  if (!state) return;
  const unanswered = state.questions.filter((q, qi) => q.type !== 'mcq' && !state.scores[qi]);
  for (let qi = 0; qi < state.questions.length; qi++) {
    const q = state.questions[qi];
    if (q.type !== 'mcq' && !state.scores[qi]) {
      const input = document.getElementById(`qa-${modId}-${qi}`);
      if (input && input.value.trim()) {
        await submitShort(modId, qi, encodeURIComponent(q.question), encodeURIComponent(q.answer), q.type);
      }
    }
  }
  updateQuizScore(modId);
}

function updateQuizScore(modId) {
  const state = window[`quiz_state_${modId}`];
  if (!state || Object.keys(state.scores).length === 0) return;
  const avg = Object.values(state.scores).reduce((a,b)=>a+b,0) / Object.keys(state.scores).length;
  const color = avg >= 80 ? 'var(--accent2)' : avg >= 50 ? 'var(--accent5)' : 'var(--accent3)';
  const scoreEl = document.getElementById(`quiz-content-${modId}`);
  let existingScore = document.getElementById(`quiz-score-${modId}`);
  if (!existingScore) {
    existingScore = document.createElement('div');
    existingScore.id = `quiz-score-${modId}`;
    existingScore.className = 'quiz-score';
    existingScore.style.marginTop = '16px';
    scoreEl.appendChild(existingScore);
  }
  existingScore.innerHTML = `
    <div class="score-circle" style="color:${color};border-color:${color}">${Math.round(avg)}%</div>
    <div>
      <strong style="color:${color}">${avg>=80?'Excellent!':avg>=50?'Good progress':'Keep reviewing'}</strong>
      <div style="font-size:12px;color:var(--muted)">${Object.keys(state.scores).length} of ${state.questions.length} answered</div>
    </div>`;
}

// ──────────────────────────────────────────────
//  AI TUTOR
// ──────────────────────────────────────────────
function openTutor() {
  document.getElementById('tutor-fab').style.display = 'none';
  document.getElementById('tutor-panel').classList.add('open');
}
function closeTutor() {
  document.getElementById('tutor-panel').classList.remove('open');
  document.getElementById('tutor-fab').style.display = 'flex';
}
function tutorKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendTutor(); }
}

async function sendTutor() {
  const input = document.getElementById('tutor-input');
  const question = input.value.trim();
  if (!question) return;
  input.value = '';

  const msgs = document.getElementById('tutor-messages');
  msgs.innerHTML += `<div class="tutor-msg user">${escHtml(question)}</div>`;
  msgs.innerHTML += `<div class="tutor-msg typing" id="tutor-typing">Thinking…</div>`;
  msgs.scrollTop = msgs.scrollHeight;

  try {
    const res = await fetch('/learn/api/ask', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({
        question,
        context: `${MODULES[currentModule].badge}: ${MODULES[currentModule].title}`,
        course_section: MODULES[currentModule].title
      })
    });
    const data = await res.json();
    document.getElementById('tutor-typing').remove();
    msgs.innerHTML += `<div class="tutor-msg bot">${escHtml(data.answer || 'Sorry, I had trouble answering that.').replace(/\n/g,'<br>')}</div>`;
  } catch (e) {
    document.getElementById('tutor-typing').remove();
    msgs.innerHTML += `<div class="tutor-msg bot" style="color:var(--accent3)">Error: ${e.message}</div>`;
  }
  msgs.scrollTop = msgs.scrollHeight;
}

// ──────────────────────────────────────────────
//  NAVIGATION
// ──────────────────────────────────────────────
function goToModule(idx) {
  // idx is array index in MODULES; renderModule takes module id
  currentModule = idx;
  const moduleId = MODULES[idx].id;
  document.getElementById('main').innerHTML = renderModule(moduleId);
  buildSidebar();
  window.scrollTo(0, 0);
  hljs.highlightAll();
  animateSSEDemo();
  return false;
}

function markComplete(id) {
  completed.add(id);
  localStorage.setItem('course_completed', JSON.stringify([...completed]));
  buildSidebar();
  document.querySelectorAll('.complete-btn').forEach(b => {
    b.classList.add('done');
    b.textContent = '✓ Completed';
  });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ──────────────────────────────────────────────
//  SSE ANIMATION
// ──────────────────────────────────────────────
function animateSSEDemo() {
  const frames = document.querySelectorAll('#sse-demo .sse-frame');
  if (!frames.length) return;
  frames.forEach((f,i) => {
    setTimeout(() => f.classList.add('visible'), i * 300);
  });
}

// ──────────────────────────────────────────────
//  BOOT
// ──────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  buildSidebar();
  // Default to Module 0 (Philosophy) — index 2 in the new MODULES array
  // (Track A is index 0, Track B is index 1)
  const startIdx = MODULES.findIndex(m => m.id === 0);
  goToModule(startIdx >= 0 ? startIdx : 0);
});
