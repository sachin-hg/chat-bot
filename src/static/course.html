<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Building Production AI Agents — Zero to Hero</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/python.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/lua.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/languages/json.min.js"></script>
<style>
:root {
  --bg: #0d1117;
  --bg2: #161b22;
  --bg3: #21262d;
  --border: #30363d;
  --text: #e6edf3;
  --muted: #8b949e;
  --accent: #58a6ff;
  --accent2: #3fb950;
  --accent3: #f78166;
  --accent4: #d2a8ff;
  --accent5: #ffa657;
  --sidebar-w: 280px;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; font-size: 15px; line-height: 1.7; display: flex; min-height: 100vh; }

/* ── Sidebar ── */
#sidebar {
  width: var(--sidebar-w); background: var(--bg2); border-right: 1px solid var(--border);
  position: fixed; top: 0; left: 0; height: 100vh; overflow-y: auto; z-index: 100;
  display: flex; flex-direction: column;
}
#sidebar-header { padding: 20px 16px 12px; border-bottom: 1px solid var(--border); }
#sidebar-header h2 { font-size: 12px; font-weight: 600; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
#sidebar-header p { font-size: 13px; color: var(--accent); font-weight: 600; margin-top: 4px; }
#progress-bar-wrap { padding: 10px 16px; border-bottom: 1px solid var(--border); }
#progress-label { font-size: 11px; color: var(--muted); margin-bottom: 6px; }
#progress-bar { background: var(--bg3); border-radius: 6px; height: 6px; overflow: hidden; }
#progress-fill { height: 100%; background: linear-gradient(90deg, var(--accent), var(--accent2)); width: 0%; transition: width .4s ease; border-radius: 6px; }
#module-list { flex: 1; padding: 8px 0; }
.mod-item {
  display: flex; align-items: center; gap: 10px; padding: 9px 16px; cursor: pointer;
  font-size: 13px; color: var(--muted); border-left: 3px solid transparent; transition: all .15s;
  text-decoration: none;
}
.mod-item:hover { background: var(--bg3); color: var(--text); }
.mod-item.active { background: rgba(88,166,255,.08); color: var(--accent); border-left-color: var(--accent); }
.mod-item.completed .mod-check { background: var(--accent2); color: #000; }
.mod-check {
  width: 20px; height: 20px; border-radius: 50%; background: var(--bg3); border: 1px solid var(--border);
  font-size: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
  font-weight: 700; color: var(--muted);
}
.mod-label { flex: 1; line-height: 1.3; }
.mod-label small { display: block; font-size: 11px; opacity: .6; }
.track-tag { display: inline-block; font-size: 9px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 1px 5px; border-radius: 3px; margin-left: 4px; vertical-align: middle; }
.track-ai  { background: rgba(210,168,255,.2); color: var(--accent4); }
.track-fe  { background: rgba(255,166,87,.15); color: var(--accent5); }
.track-ent { background: rgba(63,185,80,.15);  color: var(--accent2); }
.track-core { background: rgba(88,166,255,.15); color: var(--accent); }

/* Learning paths panel */
.paths-panel { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; margin: 8px; padding: 10px 12px; }
.paths-panel summary { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; user-select: none; }
.paths-panel summary:hover { color: var(--text); }
.path-item { margin-top: 8px; font-size: 11px; color: var(--muted); line-height: 1.5; border-left: 2px solid var(--border); padding-left: 8px; }
.path-item strong { color: var(--text); display: block; margin-bottom: 2px; }

/* Exercise callout */
.callout-exercise { background: rgba(255,166,87,.06); border-color: var(--accent5); }

/* Two-col grid */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
.col-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
#sidebar-footer { padding: 12px 16px; border-top: 1px solid var(--border); }
.ask-ai-btn {
  width: 100%; padding: 8px 12px; background: var(--accent); color: #000; border: none; border-radius: 6px;
  font-weight: 600; font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px;
}
.ask-ai-btn:hover { background: #79b8ff; }

/* ── Main content ── */
#main { margin-left: var(--sidebar-w); flex: 1; max-width: 900px; padding: 48px 48px 120px; }
h1 { font-size: 28px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
h2 { font-size: 22px; font-weight: 700; color: var(--text); margin: 40px 0 16px; padding-top: 40px; border-top: 1px solid var(--border); }
h2:first-of-type { margin-top: 0; border-top: none; }
h3 { font-size: 17px; font-weight: 600; color: var(--accent4); margin: 28px 0 12px; }
h4 { font-size: 14px; font-weight: 600; color: var(--accent5); margin: 20px 0 8px; }
p { margin-bottom: 16px; color: #c9d1d9; }
ul, ol { margin: 12px 0 16px 20px; color: #c9d1d9; }
li { margin-bottom: 6px; }
strong { color: var(--text); font-weight: 600; }
em { color: var(--accent4); font-style: italic; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

/* Module header */
.module-header { margin-bottom: 32px; }
.module-badge { display: inline-block; background: var(--accent); color: #000; font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 4px; letter-spacing: .05em; text-transform: uppercase; margin-bottom: 12px; }
.module-title { font-size: 30px; font-weight: 800; line-height: 1.2; margin-bottom: 12px; }
.module-subtitle { color: var(--muted); font-size: 15px; }
.module-meta { display: flex; gap: 16px; margin-top: 16px; }
.meta-pill { background: var(--bg3); border: 1px solid var(--border); border-radius: 20px; padding: 4px 12px; font-size: 12px; color: var(--muted); }

/* Code blocks */
pre { background: #161b22 !important; border: 1px solid var(--border); border-radius: 8px; padding: 20px; overflow-x: auto; margin: 16px 0; font-size: 13px; line-height: 1.6; position: relative; }
.copy-btn { position: absolute; top: 8px; right: 8px; background: var(--bg3); border: 1px solid var(--border); color: var(--muted); padding: 4px 10px; border-radius: 4px; font-size: 11px; cursor: pointer; opacity: 0; transition: opacity .2s; }
pre:hover .copy-btn { opacity: 1; }
.copy-btn:hover { color: var(--text); }
code:not(pre code) { background: var(--bg3); border: 1px solid var(--border); border-radius: 4px; padding: 1px 6px; font-size: 12.5px; color: var(--accent3); font-family: "JetBrains Mono","Fira Code","Cascadia Code",monospace; }

/* Tables */
table { width: 100%; border-collapse: collapse; margin: 16px 0; font-size: 13px; }
th { background: var(--bg3); color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; padding: 10px 14px; text-align: left; border-bottom: 2px solid var(--border); }
td { padding: 10px 14px; border-bottom: 1px solid var(--border); color: #c9d1d9; }
tr:hover td { background: rgba(255,255,255,.02); }

/* Callout boxes */
.callout { border-radius: 8px; padding: 16px 20px; margin: 20px 0; border-left: 4px solid; }
.callout-info { background: rgba(88,166,255,.08); border-color: var(--accent); }
.callout-warn { background: rgba(247,129,102,.08); border-color: var(--accent3); }
.callout-tip { background: rgba(63,185,80,.08); border-color: var(--accent2); }
.callout-gotcha { background: rgba(210,168,255,.08); border-color: var(--accent4); }
.callout strong { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .06em; margin-bottom: 8px; }

/* Diagram containers */
.diagram-wrap { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin: 24px 0; }
.diagram-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 16px; }
.diagram-scroll { overflow-x: auto; }

/* Pipeline diagram */
.pipeline-nodes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.pipe-node {
  background: var(--bg3); border: 1px solid var(--border); border-radius: 6px;
  padding: 8px 14px; font-size: 12px; font-weight: 600; color: var(--muted); cursor: pointer;
  transition: all .2s; position: static; white-space: nowrap;
}
.pipe-node:hover, .pipe-node.active { background: var(--accent); color: #000; border-color: var(--accent); transform: translateY(-1px); }
.pipe-node.phase-classify { border-color: rgba(88,166,255,.5); }
.pipe-node.phase-process  { border-color: rgba(63,185,80,.5); }
.pipe-node.phase-response { border-color: rgba(210,168,255,.5); }
.pipe-arrow { color: var(--border); font-size: 18px; line-height: 1; user-select: none; }

/* Tooltip: fixed so it's never clipped by any container */
.node-tooltip {
  position: fixed;
  background: var(--bg); border: 1px solid var(--accent); border-radius: 8px;
  padding: 12px 16px; font-size: 12px; width: 220px; color: var(--text); z-index: 9999;
  line-height: 1.6; font-weight: 400; box-shadow: 0 8px 32px rgba(0,0,0,.6);
  pointer-events: none; display: none;
}
.node-tooltip .tt-name { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--accent); margin-bottom: 6px; }
.node-tooltip .tt-job  { color: var(--text); margin-bottom: 4px; }
.node-tooltip .tt-tip  { color: var(--muted); font-size: 11px; font-style: italic; }
.pipe-phase-label { font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; padding: 2px 8px; border-radius: 4px; }
.lbl-classify { background: rgba(88,166,255,.15); color: var(--accent); }
.lbl-process  { background: rgba(63,185,80,.15);  color: var(--accent2); }
.lbl-response { background: rgba(210,168,255,.15); color: var(--accent4); }

/* Spectrum diagram */
.spectrum { display: flex; gap: 1px; border-radius: 8px; overflow: hidden; margin: 16px 0; }
.spec-col { flex: 1; padding: 16px; background: var(--bg3); }
.spec-col:first-child { background: rgba(63,185,80,.08); }
.spec-col:last-child  { background: rgba(247,129,102,.08); }
.spec-title { font-size: 12px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
.spec-desc  { font-size: 11px; color: var(--muted); line-height: 1.6; }

/* Quiz section */
.quiz-section { background: var(--bg2); border: 1px solid var(--border); border-radius: 10px; padding: 24px; margin: 32px 0; }
.quiz-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
.quiz-header h3 { color: var(--text); margin: 0; font-size: 16px; }
.btn { padding: 8px 16px; border-radius: 6px; font-size: 13px; font-weight: 600; cursor: pointer; border: 1px solid; transition: all .15s; }
.btn-primary { background: var(--accent); color: #000; border-color: var(--accent); }
.btn-primary:hover { background: #79b8ff; }
.btn-ghost { background: transparent; color: var(--muted); border-color: var(--border); }
.btn-ghost:hover { color: var(--text); border-color: var(--muted); }
.btn-success { background: var(--accent2); color: #000; border-color: var(--accent2); }
.btn-sm { padding: 5px 10px; font-size: 12px; }
.quiz-question { margin-bottom: 20px; animation: fadeIn .3s ease; }
.quiz-q-text { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 12px; }
.quiz-options { display: flex; flex-direction: column; gap: 8px; }
.quiz-opt {
  padding: 10px 14px; border: 1px solid var(--border); border-radius: 6px; cursor: pointer;
  font-size: 13px; color: var(--muted); transition: all .15s; background: var(--bg3);
}
.quiz-opt:hover { border-color: var(--accent); color: var(--text); }
.quiz-opt.selected { border-color: var(--accent); color: var(--text); background: rgba(88,166,255,.1); }
.quiz-opt.correct { border-color: var(--accent2); background: rgba(63,185,80,.1); color: var(--accent2); }
.quiz-opt.wrong   { border-color: var(--accent3); background: rgba(247,129,102,.08); color: var(--accent3); }
.quiz-short-input { width: 100%; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 10px 14px; color: var(--text); font-size: 13px; resize: vertical; min-height: 80px; margin-bottom: 8px; }
.quiz-short-input:focus { outline: none; border-color: var(--accent); }
.quiz-feedback { margin-top: 12px; padding: 12px 16px; border-radius: 6px; font-size: 13px; line-height: 1.6; animation: fadeIn .3s ease; }
.fb-correct { background: rgba(63,185,80,.1); border: 1px solid var(--accent2); color: var(--accent2); }
.fb-wrong   { background: rgba(247,129,102,.08); border: 1px solid var(--accent3); color: #c9d1d9; }
.quiz-score { display: flex; align-items: center; gap: 12px; padding: 16px; background: var(--bg3); border-radius: 8px; }
.score-circle { width: 56px; height: 56px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 800; border: 3px solid; flex-shrink: 0; }
.quiz-loading { color: var(--muted); font-size: 13px; padding: 20px; text-align: center; animation: pulse 1.5s infinite; }
.quiz-hint { font-size: 11px; color: var(--muted); margin-top: 6px; font-style: italic; cursor: pointer; }
.quiz-hint:hover { color: var(--accent); }

/* AI tutor panel */
#tutor-panel {
  position: fixed; bottom: 24px; right: 24px; width: 380px; background: var(--bg2);
  border: 1px solid var(--border); border-radius: 12px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
  z-index: 1000; display: none; flex-direction: column; max-height: 520px;
}
#tutor-panel.open { display: flex; animation: slideUp .25s ease; }
.tutor-header {
  padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px; cursor: pointer;
}
.tutor-avatar { width: 32px; height: 32px; border-radius: 50%; background: linear-gradient(135deg, var(--accent), var(--accent4)); display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700; color: #000; flex-shrink: 0; }
.tutor-name { font-size: 13px; font-weight: 600; flex: 1; }
.tutor-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 18px; padding: 0 4px; }
.tutor-close:hover { color: var(--text); }
#tutor-messages { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-height: 200px; }
.tutor-msg { padding: 10px 14px; border-radius: 8px; font-size: 13px; line-height: 1.6; max-width: 90%; }
.tutor-msg.user { background: var(--accent); color: #000; align-self: flex-end; border-radius: 8px 8px 2px 8px; }
.tutor-msg.bot { background: var(--bg3); color: var(--text); align-self: flex-start; border-radius: 8px 8px 8px 2px; }
.tutor-msg.typing { color: var(--muted); animation: pulse 1.5s infinite; }
.tutor-input-wrap { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
#tutor-input { flex: 1; background: var(--bg3); border: 1px solid var(--border); border-radius: 6px; padding: 8px 12px; color: var(--text); font-size: 13px; resize: none; max-height: 80px; }
#tutor-input:focus { outline: none; border-color: var(--accent); }
#tutor-send { background: var(--accent); color: #000; border: none; border-radius: 6px; padding: 8px 14px; font-weight: 700; cursor: pointer; font-size: 13px; }
#tutor-send:hover { background: #79b8ff; }

/* Floating tutor button */
#tutor-fab {
  position: fixed; bottom: 24px; right: 24px; width: 52px; height: 52px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), var(--accent4)); color: #000;
  border: none; font-size: 22px; cursor: pointer; box-shadow: 0 4px 20px rgba(88,166,255,.4);
  z-index: 999; transition: transform .2s, box-shadow .2s; display: flex; align-items: center; justify-content: center;
}
#tutor-fab:hover { transform: scale(1.1); box-shadow: 0 6px 28px rgba(88,166,255,.5); }

/* Module navigation */
.mod-nav { display: flex; justify-content: space-between; margin-top: 48px; padding-top: 24px; border-top: 1px solid var(--border); }
.nav-btn { display: flex; align-items: center; gap: 8px; padding: 10px 16px; background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 13px; color: var(--muted); text-decoration: none; transition: all .15s; }
.nav-btn:hover { border-color: var(--accent); color: var(--accent); }
.nav-btn-label { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; display: block; }

/* Section nav */
.section-nav { position: sticky; top: 16px; float: right; margin: 0 -240px 0 32px; width: 200px; }
.section-nav-title { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 10px; }
.section-nav a { display: block; font-size: 12px; color: var(--muted); padding: 3px 0; text-decoration: none; border-left: 2px solid var(--border); padding-left: 10px; margin-bottom: 3px; transition: all .15s; }
.section-nav a:hover, .section-nav a.active { border-color: var(--accent); color: var(--accent); }

/* Tier diagram */
.tier-grid { display: grid; grid-template-columns: auto 1fr 1fr 1fr; gap: 1px; background: var(--border); border-radius: 8px; overflow: hidden; font-size: 12px; margin: 16px 0; }
.tier-cell { background: var(--bg3); padding: 10px 12px; }
.tier-cell.header { background: var(--bg2); font-weight: 700; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
.tier-badge { display: inline-block; padding: 2px 8px; border-radius: 4px; font-weight: 700; font-size: 11px; }
.t0 { background: rgba(247,129,102,.15); color: var(--accent3); }
.t1 { background: rgba(255,166,87,.15); color: var(--accent5); }
.t2 { background: rgba(88,166,255,.15); color: var(--accent); }
.t3a { background: rgba(63,185,80,.15);  color: var(--accent2); }
.t3b { background: rgba(210,168,255,.15); color: var(--accent4); }

/* Learning objectives block */
.learning-obj { background: rgba(88,166,255,.06); border: 1px solid rgba(88,166,255,.25); border-radius: 8px; padding: 16px 20px; margin-bottom: 28px; }
.learning-obj-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--accent); margin-bottom: 10px; }
.learning-obj ol { margin: 0; padding-left: 20px; }
.learning-obj li { font-size: 13px; color: #c9d1d9; line-height: 1.7; margin-bottom: 2px; }
.obj-meta { display: flex; gap: 16px; margin-top: 12px; padding-top: 10px; border-top: 1px solid rgba(88,166,255,.15); }
.obj-time { font-size: 11px; color: var(--muted); }
.obj-diff { font-size: 11px; color: var(--muted); }

/* Misconception callout */
.callout-misconception { background: rgba(255,166,87,.06); border-color: var(--accent5); }
.callout-misconception strong { color: var(--accent5); }

/* MAANG interview callout */
.callout-maang { background: rgba(63,185,80,.06); border-color: var(--accent2); }
.callout-maang strong { color: var(--accent2); }

/* Decision tree */
.decision-tree { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 20px; margin: 20px 0; font-family: "JetBrains Mono","Fira Code",monospace; font-size: 12px; line-height: 1.9; overflow-x: auto; color: #c9d1d9; }
.decision-tree .dt-q { color: var(--accent); font-weight: 700; }
.decision-tree .dt-yes { color: var(--accent2); }
.decision-tree .dt-no  { color: var(--accent3); }
.decision-tree .dt-note { color: var(--muted); font-style: italic; }

/* Mini-check */
.mini-check { background: rgba(210,168,255,.06); border: 1px solid rgba(210,168,255,.25); border-radius: 8px; padding: 14px 18px; margin: 24px 0; }
.mini-check-title { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--accent4); margin-bottom: 8px; }
.mini-check ul { margin: 0; padding-left: 18px; }
.mini-check li { font-size: 13px; color: var(--muted); line-height: 1.7; }

/* Animations */
@keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
@keyframes slideUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: translateY(0); } }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }
@keyframes flowPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(88,166,255,0); } 50% { box-shadow: 0 0 0 4px rgba(88,166,255,.3); } }

/* SSE animation */
.sse-demo { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: 16px; font-family: monospace; font-size: 12px; line-height: 2; overflow: hidden; }
.sse-frame { opacity: 0; transform: translateX(-8px); transition: opacity .3s, transform .3s; color: var(--muted); }
.sse-frame.event { color: var(--accent4); }
.sse-frame.data  { color: var(--accent2); padding-left: 16px; }
.sse-frame.visible { opacity: 1; transform: translateX(0); }

/* Checklist */
.checklist { list-style: none; margin-left: 0; }
.checklist li { display: flex; align-items: flex-start; gap: 10px; padding: 6px 0; color: #c9d1d9; }
.checklist li::before { content: "☐"; color: var(--border); font-size: 14px; flex-shrink: 0; margin-top: 2px; }

/* Phase timeline */
.phase-timeline { border-left: 2px solid var(--border); margin: 16px 0 16px 12px; }
.phase-item { position: relative; padding: 16px 0 16px 28px; }
.phase-item::before {
  content: ''; position: absolute; left: -9px; top: 22px;
  width: 16px; height: 16px; border-radius: 50%; background: var(--bg3); border: 2px solid var(--border);
}
.phase-item:hover::before { border-color: var(--accent); }
.phase-week { font-size: 11px; font-weight: 700; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; margin-bottom: 4px; }
.phase-name { font-size: 14px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.phase-steps { font-size: 12px; color: var(--muted); line-height: 1.8; }

/* Gotcha card */
.gotcha-card { background: var(--bg2); border: 1px solid var(--border); border-radius: 8px; padding: 16px; margin: 12px 0; cursor: pointer; transition: border-color .2s; }
.gotcha-card:hover { border-color: var(--accent4); }
.gotcha-header { display: flex; align-items: center; gap: 10px; }
.gotcha-num { width: 28px; height: 28px; border-radius: 6px; background: rgba(210,168,255,.1); color: var(--accent4); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; flex-shrink: 0; }
.gotcha-title { font-size: 14px; font-weight: 600; flex: 1; }
.gotcha-chevron { color: var(--muted); transition: transform .2s; }
.gotcha-body { max-height: 0; overflow: hidden; transition: max-height .3s ease; font-size: 13px; color: var(--muted); line-height: 1.7; }
.gotcha-card.open .gotcha-chevron { transform: rotate(90deg); }
.gotcha-card.open .gotcha-body { max-height: 400px; padding-top: 12px; }

/* Mental model cards */
.mental-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin: 16px 0; }
.mental-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; transition: border-color .2s; }
.mental-card:hover { border-color: var(--accent); }
.mental-num { font-size: 24px; font-weight: 800; color: var(--accent); opacity: .4; margin-bottom: 8px; }
.mental-title { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; }
.mental-desc { font-size: 12px; color: var(--muted); line-height: 1.6; }

/* Module pages */
.module-page { display: none; animation: fadeIn .3s ease; }
.module-page.active { display: block; }

/* Complete button */
.complete-section { text-align: center; padding: 32px 0; }
.complete-btn { display: inline-flex; align-items: center; gap: 8px; padding: 12px 28px; background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; cursor: pointer; font-size: 14px; font-weight: 600; color: var(--muted); transition: all .2s; }
.complete-btn:hover { border-color: var(--accent2); color: var(--accent2); }
.complete-btn.done { background: rgba(63,185,80,.1); border-color: var(--accent2); color: var(--accent2); }

/* Two-column */
.two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin: 16px 0; }
.col-card { background: var(--bg3); border: 1px solid var(--border); border-radius: 8px; padding: 16px; }
.col-card h4 { margin: 0 0 10px; }

const GOTCHAS = [
  { num:"14.1", title:"The connection_close Trap", body:`<code>connection_close</code> must be yielded <em>inside</em> the generator's while loop on sentinel, not after the try/finally block. If the finally block throws (e.g. Redis decr fails), code after try/finally never runs. The user gets a blank screen. We learned this in production.` },
  { num:"14.2", title:"The Cascade Tax", body:`5 nodes × 200ms each = 1 second before the LLM even starts. Every sequential external call adds latency.<br><br><strong>Which calls to parallelize in fetch_data_node:</strong><br><pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:8px;border-radius:4px;overflow-x:auto"># BAD: sequential — 200+200+150 = 550ms total
listings = await search_properties(filters)
locality  = await get_locality_detail(locality_id)
emi_info  = await fetch_emi_rates()

# GOOD: parallel group 1 then sync calc — 200ms total
listings, locality, emi_rates = await asyncio.gather(
    search_properties(filters),         # 200ms
    get_locality_detail(locality_id),   # 200ms  (runs in parallel)
    fetch_emi_rates(),                  # 150ms  (runs in parallel)
)
# calculate_emi is pure math — no I/O, runs sync after gather</pre>Rules: group calls that have no data dependency on each other. Session load is always serial (must happen before any node). Redis state write is always serial (must happen after response is sent, as a background task).` },
  { num:"14.3", title:"The SLM Context Window", body:`The classifier SLM has a small context window. If last_3_turns contains full bot responses, the SLM truncates the beginning. <strong>Always truncate bot responses to 400 chars</strong> in last_3_turns. The full response lives in turn_history for the LLM.` },
  { num:"14.4", title:"The First-Turn Problem", body:`Turn 1 has no session. No active_filters, no last_intent. Design your taxonomy so every prompt works with empty context.<br><br><strong>How it flows through the pipeline:</strong><br><pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:8px;border-radius:4px;overflow-x:auto">User: "show me properties"
  ↓
validate_slm_node detects city=None, locality=None
  → sets clarification_needed=True, missing_slot="city"
  ↓
route_node sees clarification_needed=True
  → short-circuits to clarify_node  (Tier 1, skips LLM entirely)
  ↓
clarify_node generates: "Which city are you looking in?"
  → sets bot_response, emits SSE text frame
  ↓
pipeline exits — LLM never called, cost = $0.0001</pre>Key design: validate_slm_node enforces the "minimum required context" contract. The taxonomy's filter schema marks city as <code>required: true</code>, so the SLM itself sets clarification_needed when it's absent. No special-case code in route_node.` },
  { num:"14.5", title:"The Version Conflict Spiral", body:`Two simultaneous requests both read version=3, both try to write version=4. One conflicts (Lua returns 0). For 99.9% of users (sequential browsing) this never happens. For the rest, two strategies:<br><br><strong>Sprint 3 — log and continue:</strong> The second write is silently discarded. State reflects the first response. User sees a coherent conversation but their parallel tap may be ignored. Acceptable for MVP — the race is so rare users don't notice.<br><br><strong>Sprint 4 — retry with exponential backoff:</strong><br><pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:8px;border-radius:4px;overflow-x:auto">for attempt in range(3):
    result = await lua_write(session_id, state, expected_version)
    if result == 1:
        break
    await asyncio.sleep(0.05 * (2 ** attempt))  # 50ms, 100ms, 200ms
    state = await redis.hgetall(session_id)      # re-read latest
    expected_version = int(state["version"])</pre>After 3 failures: log warning + serve response without persisting (degraded mode). Don't raise — the user already got their answer.` },
  { num:"14.6", title:"The clear_keys Graveyard", body:`Dead config is worse than no config — it creates false confidence. clear_keys was defined in every IntentRecord for months before anyone noticed no code ever read it. If you design a schema field, immediately write the code that consumes it.` },
  { num:"14.7", title:'The "No Text Response" Mystery', body:`When validated_text is empty, the user sees "No text response received." Here's how to debug it in the playground:<br><br><strong>Step 1 — Pipeline tab:</strong> Look at the <em>validate_output</em> node. If <code>validated_text = ""</code> and <code>chunks_streamed = 0</code>, the LLM returned no text at all — it made a tool call only. Check the LLM prompt: did it say "only return carousel data, no prose"?<br><br><strong>Step 2 — State Inspector tab:</strong> Check <code>pre_fetched_data</code>. If it's <code>{}</code> or <code>null</code>, fetch_data_node returned nothing — the LLM has no data to describe, so it stays silent. Check your API mock or filter logic.<br><br><strong>Step 3 — LLM Input/Output tab:</strong> Read the raw LLM response. If it shows a tool_use block with no text sibling, your system prompt is suppressing prose. Add: "Always begin your response with 1-2 sentences before any tool call."<br><br><strong>Step 4 — validate_output node:</strong> If chunks_streamed &gt; 0 but validated_text is empty, the output validator stripped all text (e.g. hallucination filter too aggressive). Lower the threshold or inspect the filter regex.` },
  { num:"14.8", title:"The Background Task Leak", body:`asyncio.create_task in a short-lived HTTP request context means the task might outlive the connection. For Redis/Kafka (&lt;50ms) this is fine. For slow external APIs in background tasks, unhandled tasks are silently killed when the process exits — mid-write data loss.<br><br><strong>Graceful shutdown handler:</strong><br><pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:8px;border-radius:4px;overflow-x:auto">_background_tasks: set[asyncio.Task] = set()

def create_tracked_task(coro):
    task = asyncio.create_task(coro)
    _background_tasks.add(task)
    task.add_done_callback(_background_tasks.discard)
    return task

# In FastAPI lifespan shutdown:
async def shutdown():
    if _background_tasks:
        await asyncio.wait(_background_tasks, timeout=5.0)
        # Tasks still running after 5s are abandoned — log them
        for t in _background_tasks:
            log.warning("background_task_abandoned", task=t.get_name())</pre>Rule of thumb: Redis/Kafka writes (&lt;50ms) → bare create_task is fine. External HTTP calls or analytics writes (&gt;100ms) → use create_tracked_task so they flush on shutdown.` },
];

const MENTAL_MODELS = [
  { num:"1", title:"Nodes are compiler passes, not ChatGPT wrappers", desc:"Each node does exactly one job. If you find a node doing two things, split it.<br><small style='color:#a6adc8'>📂 <code>src/pipeline/nodes/fetch.py → fetch_data_node</code> — only calls tools and puts results in <code>state.pre_fetched_data</code>. <code>nodes/response.py → build_prompt_node</code> — only reads that data and formats the prompt. Separated so you can unit-test formatting with fake data without triggering live HTTP calls.<br><em>Violation consequence:</em> tests require mocks of both the API and the formatter; a schema change in the API silently breaks your formatting logic.</small>" },
  { num:"2", title:"Emit SSE for UX, not for logic", desc:"No node should make a decision based on what was emitted. SSE is fire-and-forget.<br><small style='color:#a6adc8'>📂 <code>src/pipeline/nodes/processing.py → emit_sse()</code> — every call is put_nowait into the queue, never awaited or checked. No node reads from the queue.<br><em>Violation consequence:</em> if a node checks 'was that frame received?' you've coupled your pipeline logic to your delivery layer — now you can't swap SSE for WebSockets or polling without rewriting nodes.</small>" },

<h2>0.1 What is an AI Agent? (Not what you think)</h2>
<p>Most people think an AI agent is "ChatGPT with extra steps." It isn't.</p>
<p>An <strong>LLM</strong> takes text in, produces text out. It has no memory, no tools, no concept of your user's session, no business rules. Left alone it will confidently make things up.</p>
<p>An <strong>AI Agent</strong> is a <em>system</em> that wraps an LLM with:</p>

<div class="callout callout-tip"><strong>Mental Model</strong>An AI agent is a <strong>compiler</strong>. The user's natural language message is source code. Your pipeline is the compiler passes. The rendered response is the output. Each pass has a specific job. No pass does another pass's job.</div>

<h2>0.2 The Spectrum: Wrapper → Agent → Autonomous Agent</h2>

<h2>0.3 The Housing.com Problem</h2>
<p>Housing.com has millions of property listings. Users describe what they want in natural language: <em>"show me 3BHK in Bandra under 2Cr with parking, near the sea."</em></p>
<table>
  <tr><th>Without AI</th><th>With AI Agent</th></tr>
  <tr><td>User fills in 8 dropdowns</td><td>One sentence → right properties</td></tr>
  <tr><td>Rigid, slow, frustrating</td><td>Natural, fast, delightful</td></tr>

</table>
<p>The hard part isn't the happy path. The hard part is:</p>

  <li>Users refer to things they already saw (<em>"tell me more about the third one"</em>)</li>
  <li>Some messages are malicious (<em>"ignore previous instructions"</em>)</li>
  <li>The system must work in 500ms, not 30 seconds</li>
  <li>It must cost less than ₹1 per session</li>
</ul>
<p><strong>Every design decision in this codebase is a response to one of these pressures.</strong></p>

<h2>0.4 When Autonomous Agents ARE Appropriate</h2>
<p>The previous section showed the failure modes. But dismissing autonomous agents entirely misses legitimate enterprise use cases. The question isn't "are they risky?" (yes, they are) — it's "can the risks be bounded?"</p>
<p><strong>The three-question test before choosing autonomous:</strong></p>
<table>
  <tr><th>Question</th><th>If NO → don't use autonomous</th></tr>
  <tr><td>Is completion machine-verifiable?</td><td>If a human must judge success, the agent will spin indefinitely or hallucinate completion</td></tr>
  <tr><td>Are all tool calls sandboxed?</td><td>If a tool has real-world side effects (send email, charge card), one loop bug costs real money or sends real messages</td></tr>

</table>
<div class="callout callout-tip"><strong>Enterprise patterns where autonomous agents work well</strong>
<ul style="margin:8px 0 0 16px">
  <li><strong>Code review agent</strong> — reads diff, writes comments; completion = comment posted; no irreversible production action</li>
  <li><strong>Document processing pipeline</strong> — extracts structured data from PDFs; completion = JSON schema validates; retries are cheap</li>
  <li><strong>Compliance checking</strong> — reads configuration, flags violations; human approves remediation before any change is applied</li>
  <li><strong>Internal tooling</strong> — low volume, internal users, staging environment, human reviews output before it reaches customers</li>
</ul></div>
<div class="callout callout-warn"><strong>Housing.com specifically</strong>This pipeline chose the structured agent approach because: (1) Housing search has a <em>defined completion criterion</em> but it's not machine-verifiable — "good results" requires user feedback. (2) Tool calls hit live APIs with real data. (3) The system must handle millions of users without human review. All three questions answered "no" — so we built a structured pipeline instead.</div>

<h2>1.3 Why LangGraph?</h2>
<p>You could write your 19-node pipeline as a series of if/else statements. Many teams do. It becomes unmaintainable in month 3.</p>
<p>LangGraph gives you:</p>
<ul>
  <li><strong>Typed state</strong> — the BotState TypedDict flows through every node</li>
  <li><strong>Conditional edges</strong> — short-circuit to END if bot_response is set</li>
  <li><strong>Composability</strong> — swap nodes without touching adjacent ones</li>
  <li><strong>Traceability</strong> — LangSmith sees every node's input/output</li>
</ul>
<pre><code class="language-python"># safety_node signature — it knows nothing about the other 18 nodes
async def safety_node(state: BotState, emit_sse=None) -> dict:
    # receives: state['raw_message'], state['session']
    # returns: {'safety_result': {...}}  or {'bot_response': canned_response}

# Every non-terminal edge is conditional
def _should_continue(state: BotState) -> str:
    return END if state.get('bot_response') else 'continue'

graph.add_conditional_edges('safety', _should_continue,
    {'continue': 'normalize', END: END})</code></pre>

<h2>1.4 The Queue Pattern — Decoupling Pipeline from Streaming</h2>
<div class="callout callout-tip">
  <strong>JS/TS developer? Here's the translation.</strong>
  <table style="margin-top:8px;font-size:12px">
    <tr><th>Python (this codebase)</th><th>JavaScript equivalent</th></tr>
    <tr><td><code>asyncio.Queue()</code></td><td>A simple async message channel — similar to a <code>ReadableStream</code> controller or a BroadcastChannel you push frames into</td></tr>
    <tr><td><code>queue.put_nowait(frame)</code></td><td><code>emitter.emit('frame', data)</code> — synchronous, non-blocking. The function returns immediately and doesn't yield to the event loop. This is why we use it inside pipeline nodes: calling <code>await queue.put()</code> could deadlock if the consumer isn't reading fast enough.</td></tr>
    <tr><td><code>await queue.get()</code></td><td><code>await new Promise(resolve => emitter.once('frame', resolve))</code> — suspends until a frame arrives, then resumes. Yields to the event loop while waiting.</td></tr>
    <tr><td><code>asyncio.create_task(fn())</code></td><td><code>Promise.resolve().then(() => fn())</code> or <code>setImmediate(() => fn())</code> — starts the function as a background coroutine without blocking the current execution path.</td></tr>
    <tr><td><code>None</code> as sentinel</td><td><code>null</code> pushed to signal "stream is done" — equivalent to calling <code>controller.close()</code> on a ReadableStream.</td></tr>
  </table>
  Python's event loop is single-threaded just like Node's. <code>await</code> is the yield point — it's the only place Python switches to another coroutine. Code between <code>await</code> calls runs atomically.
</div>
<div class="callout callout-info"><strong>The Core Problem</strong>LangGraph is synchronous from its own perspective — it calls node A, waits, calls node B. But we want to stream SSE frames to the client as nodes emit them, without LangGraph knowing anything about HTTP.</div>
<pre><code class="language-plaintext">LangGraph runs as background task ──► node calls emit_sse(event, data)
                                               │
                                               ▼
                                       queue.put_nowait(frame)

FastAPI event_generator ─────────────► frame = await queue.get()
                                               │
                                               ▼
                                       yield frame  ──► browser</code></pre>
<pre><code class="language-python">queue: asyncio.Queue[str | None] = asyncio.Queue()

def emit_sse(event: str, data: dict) -> None:
    queue.put_nowait(sse_frame(event, data))  # synchronous, no await

# Pipeline runs in background task
asyncio.create_task(_run_pipeline())

# Generator drains the queue
while True:
    frame = await asyncio.wait_for(queue.get(), timeout=90.0)
    if frame is None:   # sentinel — pipeline done
        break
    yield frame</code></pre>
<div class="callout callout-gotcha"><strong>Gotcha: connection_close placement</strong><code>connection_close</code> must be yielded inside the while loop (on sentinel), not after try/finally. If finally raises, code after it never executes. This burned us in production.</div>

<p>The pipeline never imports <code>anthropic</code> or <code>openai</code> directly inside any node. Nodes depend on <em>protocol interfaces</em> (called <em>Ports</em>). The concrete implementations (<em>Adapters</em>) are injected once at startup.</p>

│  Layer 1: Pipeline Nodes (depend ONLY on ports — never on providers) │
│  safety_node · normalize_node · route_domain_node · classify_node   │
│  fetch_data_node · llm_node · build_prompt_node · emit_response_node│
└────────────────┬───────────────────────────────┬────────────────────┘

┌───────────────────────────┐   ┌───────────────────────────────────┐
│  DomainRouterPort         │   │  ClassifierPort   LLMPort         │
│  async route(dict)->dict  │   │  async classify() async generate()│
│  (Python Protocol/ABC)    │   │  CachedExecutorPort               │
└──────┬────────────────────┘   └──────────┬────────────────────────┘
       │ implemented by                    │ implemented by
       ▼                                   ▼
┌──────────────────────┐   ┌───────────────────────────────────────┐
│  Layer 3: Adapters   │   │  AnthropicClassifier                  │
│  (concrete impls)    │   │  OpenRouterClassifier                 │
│                      │   │  AnthropicLLM                         │
│  Injected by         │   │  AzureOpenAILLM                       │
│  build_graph()       │   │  MockClassifier (tests)               │

<h2>2.1 Node Design Contract</h2>
<p>Every node in this pipeline follows the same contract:</p>
<pre><code class="language-python">async def node_name(state: BotState, dep1=None, dep2=None, emit_sse=None) -> dict:
    # 1. Read what you need from state
    # 2. Do exactly one job
    # 3. Return a partial state update (only the keys you own)
    # 4. emit_sse for real-time UI feedback (never for logic)
</code></pre>
<div class="callout callout-tip">
  <strong>What is TypedDict? (TypeScript developer translation)</strong>
  <pre><code class="language-python"># Python TypedDict — think of it as TypeScript's interface, but for dicts
class BotState(TypedDict):
    raw_message: str
    session: dict
    classification: dict | None
    bot_response: str | None</code></pre>
  <pre><code class="language-typescript">// TypeScript equivalent
interface BotState {
  raw_message: string;
  session: Record&lt;string, unknown&gt;;
  classification: Record&lt;string, unknown&gt; | null;
  bot_response: string | null;
}</code></pre>
  Key differences from TypeScript interfaces:
  <ul>
    <li><strong>Runtime vs compile-time:</strong> TypeScript checks at compile time and strips types. Python's TypedDict is a type hint — mypy/pyright check it, but Python itself does NOT enforce it at runtime. You CAN add extra keys at runtime without an error.</li>
    <li><strong>Merging:</strong> When a node returns <code>{'bot_response': 'hello'}</code>, LangGraph calls <code>state.update({'bot_response': 'hello'})</code> — a shallow merge. Only the keys you return are updated. Nested dicts (like <code>session</code>) are replaced wholesale, not deep-merged, unless you use a custom reducer.
    <pre style="margin:6px 0;font-size:11px"><code># state before node runs:
# { raw_message: "hi", session: {city: "Mumbai", budget: 5000000}, bot_response: None }

# node returns only one key:
return {"bot_response": "Hello!"}

# state after merge:
# { raw_message: "hi", session: {city: "Mumbai", budget: 5000000}, bot_response: "Hello!" }
# ↑ session is UNCHANGED — only bot_response was overwritten

# TRAP: if your node returns {"session": {"city": "Delhi"}} it REPLACES the whole
# session dict — budget is gone. Always read session, modify it, return the full dict.</code></pre>
    </li>
    <li><strong>Special reducers:</strong> Some keys use reducers instead of replace: <code>messages: Annotated[list, add_messages]</code> means "append to the list" instead of replace. More on this in Module 24.</li>
  </ul>
</div>
<div class="callout callout-info"><strong>Single Responsibility in Nodes</strong>Never read from state keys you don't own. Never write keys another node owns. This is the Single Responsibility Principle applied to pipeline nodes.</div>
<div class="callout callout-tip">
  <strong>Returning None vs {} — the <code>_no_op_safe</code> wrapper explained</strong>
  In LangGraph 0.2.55+, returning an empty dict <code>{}</code> from a node raises <code>InvalidUpdateError</code>. The fix is simple but the wrapper deserves explanation:
  <pre><code class="language-python"># The wrapper — 3 lines
def _no_op_safe(fn):
    async def wrapped(*args, **kwargs):
        result = await fn(*args, **kwargs)
        return result or None   # {} is falsy → becomes None; LangGraph skips the update
    return wrapped

# Usage — every node that can legitimately return "nothing"
@_no_op_safe
async def experiment_node(state: BotState) -> dict:
    if not state.get("experiment_id"):
        return {}   # no experiment active — would raise without the wrapper
    return {"experiment_variant": "treatment"}</code></pre>

  <strong>When does a node return nothing?</strong> Nodes like <code>experiment_node</code>, <code>safety_node</code> (when safe), and <code>session_load_node</code> (when session already exists) have valid "nothing to update" code paths. Without the wrapper, a guard like <code>if not active: return {}</code> crashes LangGraph.
  <br><br>
  <strong>Rule:</strong> return <code>None</code> (or rely on <code>_no_op_safe</code>) when you have nothing to write. Never return <code>{}</code> directly.
</div>

<h2>2.4 The <code>handoff_context</code> Pattern — Seeding Turn 1</h2>
<p>When a user opens the chat widget from a property listing page, the bot already knows which property they're looking at. If we don't capture that, Turn 1 becomes "which property are you asking about?" — a terrible UX.</p>
<pre><code class="language-python"># The listing page embeds context in the chat init request:
POST /chat/init
{
  "session_id": "sess_xyz",
  "handoff_context": {
    "active_property_id": "prop_abc123",
    "city": "Mumbai",
    "locality": "Bandra",
    "listing_url": "https://housing.com/listing/prop_abc123"
  }
}

# session_load_node seeds session.active_filters and session.active_property_id
async def session_load_node(state: BotState, redis=None) -> dict:
    session = await _load_or_create(state["session_id"], redis)
    if not session.get("active_property_id"):
        ctx = state.get("handoff_context", {})
        if ctx.get("active_property_id"):
            session["active_property_id"] = ctx["active_property_id"]
            session["active_filters"]["city"] = ctx.get("city")
            session["active_filters"]["localities"] = [ctx.get("locality")]
    return {"session": session}</code></pre>
<div class="callout callout-info">
  <strong>Why not let the LLM infer context from the URL?</strong>
  Three reasons:
  <ol style="margin:4px 0 0 16px">
    <li><strong>Reliability:</strong> The LLM might not see the URL (it's in page metadata, not the user's message). Even if it does, URL parsing is brittle — the property ID format can change.</li>
    <li><strong>Cost:</strong> Inferring structured data from an unstructured URL costs tokens and latency every single turn. Pre-seeding costs zero.</li>
    <li><strong>Correctness:</strong> The gateway page already has the property ID as a typed, validated value. Extract it once at the boundary and trust it. Don't re-parse what you already have.</li>
  </ol>
  <strong>Turn 1 now reads:</strong> "What's the EMI on this property?" — and the bot already knows the price, city, and property ID.
</div>

function showPipeTip(e, name) {
  const info = NODE_INFO[name];
  if (!info) return;
  const tip = document.getElementById('pipe-tooltip');
  tip.querySelector('.tt-name').textContent = name;
  tip.querySelector('.tt-job').textContent  = info.job;
  tip.querySelector('.tt-tip').textContent  = info.tip;
  tip.style.display = 'block';
  movePipeTip(e);
}
function movePipeTip(e) {
  const tip = document.getElementById('pipe-tooltip');
  if (!tip || tip.style.display === 'none') return;
  const x = e.clientX + 14;
  const y = e.clientY + 14;
  // Flip left if too close to right edge
  const w = tip.offsetWidth || 220;
  const left = (x + w > window.innerWidth - 16) ? e.clientX - w - 10 : x;
  // Flip up if too close to bottom edge
  const h = tip.offsetHeight || 80;
  const top = (y + h > window.innerHeight - 16) ? e.clientY - h - 10 : y;
  tip.style.left = left + 'px';
  tip.style.top  = top  + 'px';
}
function hidePipeTip() {
  const tip = document.getElementById('pipe-tooltip');
  if (tip) tip.style.display = 'none';
}

<h2>3.3 Redis — Optimistic Locking with Lua</h2>

<pre><code class="language-lua">-- Runs ATOMICALLY on Redis server — no race condition possible
local ver_key = KEYS[2]
local stored  = tonumber(redis.call('GET', ver_key) or '0')
if stored ~= tonumber(ARGV[1]) then
    return 0  -- conflict: caller should retry
end
redis.call('SETEX', KEYS[1], ttl, ARGV[2])           -- save session JSON
redis.call('SETEX', ver_key, ttl, tostring(stored+1)) -- increment version
return 1</code></pre>
<div class="callout callout-tip"><strong>Why a separate version key?</strong>The original script read the full session JSON and decoded it in Lua just to extract the version field. At turn 20 with full message history, session JSON is 10+ KB. Now the version is a separate 1-3 byte key — the Lua script reads a tiny key instead of parsing 10KB on every write.</div>

<pre><code class="language-python">ToolRecord(

    llm_visible=True,        # can the LLM call this as a residual tool?

<div class="callout callout-tip"><strong>wire_param pattern</strong>The LLM sees <code>locality_uuids</code> (descriptive) but the internal API expects <code>localities</code>. <code>translate_to_wire_format()</code> handles the translation before any API call. The LLM never sees internal parameter names.</div>

<h2>4.2 Pre-fetch vs Residual Tools</h2>
<div class="two-col">
  <div class="col-card">
    <h4>Pre-fetch (orchestrator-controlled)</h4>
    <ul style="font-size:12px">
      <li>Defined in <code>IntentRecord.data_requirements</code></li>
      <li>Runs in <code>fetch_data_node</code> before the LLM</li>
      <li>Deterministic — orchestrator knows what's needed</li>
      <li>Cached in Redis with TTL</li>
      <li>Zero LLM cost for the fetch decision</li>
    </ul>
  </div>
  <div class="col-card">
    <h4>Residual (LLM-controlled)</h4>
    <ul style="font-size:12px">
      <li>Defined in <code>IntentRecord.residual_tools</code></li>
      <li>Available to LLM as tool definitions</li>
      <li>Called for edge cases pre-fetch didn't cover</li>
      <li>Tier B tools (calculateEMI, convertUnit) always available</li>
      <li>LLM decides if/when to call them</li>
    </ul>
  </div>
</div>

<h2>4.3 Caching Strategy</h2>
<div class="callout callout-tip">
  <strong>Redis 101 — what it is and why we use it</strong>
  Redis is an in-memory key-value store. Think of it as a shared server-side dictionary that every instance of your service can read and write, with sub-millisecond latency.
  <table style="margin-top:8px;font-size:12px">
    <tr><th>Operation</th><th>What it does</th><th>JS analogy</th></tr>
    <tr><td><code>redis.get(key)</code></td><td>Read a value by key</td><td><code>localStorage.getItem(key)</code> — but shared across all servers</td></tr>
    <tr><td><code>redis.set(key, value)</code></td><td>Write a value</td><td><code>localStorage.setItem(key, value)</code></td></tr>
    <tr><td><code>redis.setex(key, ttl, value)</code></td><td>Write with auto-expiry after <code>ttl</code> seconds</td><td><code>localStorage.setItem</code> + <code>setTimeout(() => remove(key), ttl * 1000)</code></td></tr>
    <tr><td><code>redis.incr(key)</code></td><td>Atomic increment — thread-safe counter</td><td>No direct equivalent — you'd need a database transaction</td></tr>
  </table>
  <strong>Why not Postgres?</strong> Redis reads in ~0.1ms; Postgres reads in ~5-50ms. For session data that's read on every request, that difference compounds. Redis is also natively atomic (INCR, DECR, Lua scripts) which makes it ideal for concurrency primitives.
  <strong>Why not in-process memory?</strong> Multiple server instances can't share process memory. Redis is the shared state layer between all replicas.
</div>
<pre><code class="language-python">class CachedExecutor:
    async def execute(self, tool: str, params: dict, ttl: int) -> dict:
        cache_key = hash(tool + json.dumps(sorted_params))
        cached = await redis.get(cache_key)
        if cached:
            return json.loads(cached)
        result = await self._call_api(tool, params)
        await redis.setex(cache_key, ttl, json.dumps(result))
        return result</code></pre>
<table>
  <tr><th>Tool</th><th>TTL</th><th>Reason</th></tr>
  <tr><td>searchProperties</td><td>60s</td><td>Results change frequently</td></tr>
  <tr><td>getLocalityDetail</td><td>3600s</td><td>Locality info rarely changes</td></tr>
  <tr><td>calculateEMI</td><td>0s</td><td>Pure computation — always fresh</td></tr>
</table>

<h2>4.4 The Adapter / Port Pattern</h2>
<p>The pipeline stays provider-agnostic through the Port/Adapter pattern. Nodes depend only on <em>protocols</em>, not implementations.</p>
<pre><code class="language-python"># ClassifierPort — 3 lines, zero implementation
class ClassifierPort(Protocol):
    async def classify(self, message: str, domain: str, session: dict) -> dict: ...

# AnthropicClassifier and OpenRouterClassifier both satisfy this protocol
# build_graph() injects the concrete instance via functools.partial
graph = build_graph(
    router=build_domain_router(settings),
    classifier=build_classifier(settings),  # selected by MODEL_REGISTRY
    llm=build_llm(settings),
)</code></pre>
<div class="callout callout-tip"><strong>Why this matters for testing</strong>Nodes are tested against mock ports, not real LLMs. The test suite runs without any API keys. For A/B experiments between providers: flip MODEL_REGISTRY and restart — zero code change.</div>
<div class="callout callout-info">
  <strong>Module 4 — Reference Answer: Design Exercise</strong>
  <em>Q: You need to add a "get recent news for a locality" tool. Walk through the full integration.</em>
  <br><br>
  <strong>A:</strong> (1) Register in the tool registry: <code>tool_name="getLocalityNews"</code>, wire params from session (<code>locality_id</code>), set TTL=300s — news is fresh enough for 5 min. (2) Tag the intents that need it: <code>general_housing_query</code> with <code>parallel_group=2</code> (runs after property search). (3) Implement a <code>LocalityNewsPort</code> with one method <code>get_news(locality_id, limit)</code>. (4) Add a concrete adapter that calls the news API. Register it in <code>MODEL_REGISTRY</code>. (5) No changes to any node — <code>fetch_data_node</code> reads the registry and calls whatever tools are listed. (6) Test: unit test the port with a mock. Model eval test: verify the node returns news in <code>pre_fetched_data</code> for the right intents.
</div>

<h2>4.5 Designing an SLM Taxonomy Prompt — the Iteration Cycle</h2>
<p>The taxonomy prompt for the Stage 2 classifier has four components. Each one requires deliberate design, not guesswork.</p>
<table>
  <tr><th>Component</th><th>What it contains</th><th>Common mistake</th></tr>
  <tr><td><strong>Intent Schema</strong></td><td>JSON output structure the model must produce: fields, types, constraints</td><td>Vague field names → model guesses at semantics</td></tr>
  <tr><td><strong>Intent Taxonomy</strong></td><td>All valid intents with descriptions that disambiguate them from each other</td><td>Descriptions overlap → model picks arbitrarily between similar intents</td></tr>
  <tr><td><strong>Filter Schema</strong></td><td>Valid filter keys + value types + enum values. E.g. <code>bhk: int[]</code>, <code>furnishing: "furnished"|"unfurnished"</code></td><td>Too permissive → model returns <code>bhk: "3-bedroom"</code> instead of <code>bhk: [3]</code></td></tr>
  <tr><td><strong>Few-shot Examples</strong></td><td>Input/output pairs showing difficult cases: ordinal refs, pivots, disambiguation, ambiguous phrasing</td><td>Only "easy" examples → model fails on the 10% of messages that break the pattern</td></tr>
</table>
<div class="callout callout-tip">
  <strong>The iteration cycle: run_eval → find failures → add few-shot → re-run</strong>
  <ol style="margin:4px 0 0 16px;font-size:13px">
    <li><strong>Run model_eval:</strong> <code>pytest tests/model_eval</code> against your golden dataset. Check accuracy per intent bucket, not just overall.</li>
    <li><strong>Find failing cases:</strong> Sort failures by intent. If "pivot + ordinal reference" fails 6/10 times, that's a pattern to fix, not a fluke.</li>
    <li><strong>Root-cause the failure:</strong> Look at the actual model output. Is it picking the wrong intent? Missing a filter key? Getting the value type wrong? Each has a different fix.</li>
    <li><strong>Add a few-shot example:</strong> Write one input/output pair that covers the failing pattern. Keep it minimal — one example per failure class. More isn't always better; redundant examples confuse small models.</li>
    <li><strong>Re-run model_eval:</strong> Verify the new accuracy. If accuracy on the fixed class goes up but another class goes down, your new example is interfering — rewrite it.</li>
  </ol>
</div>
<pre><code class="language-yaml"># prompts/slm/domains/property_search.md — snippet
## Few-shot examples

### ordinal pivot (second → active_property_id)
Input: "tell me about the second one" (after carousel of 3 properties)
Output:
  main_intent: "view_property_detail"
  pivot: true
  entity_refs: [{by: "cardinality", value: 2}]
  filter_delta: {}

### amenity + bhk — both in one message
Input: "show 3BHK with gym"
Output:
  main_intent: "search_properties"
  filter_delta: {bhk: [3], amenities: ["gym"]}

### What NOT to do — description overlap
# BAD: both descriptions say "looking for a property"
search_properties: "User is looking for a property"
browse_listings: "User is looking for a property listing"  ← too similar
# GOOD: disambiguate by user action + context
search_properties: "User specifies filter criteria (location, price, type). Produces a new SERP."
browse_listings: "User navigates/explores existing results without changing filters."</code></pre>
<div class="callout callout-info"><strong>When accuracy plateaus:</strong> If you've added 5+ few-shot examples for a class and accuracy stays low, the problem isn't the examples — it's the taxonomy description. Rewrite the intent description to be more specific. "The user wants to filter properties" is weak. "The user names one or more numeric, geographic, or feature criteria to narrow the search result set" is testable.</div>
${quizSection(4, 'Module 4', 'Tool registry, wire_param pattern, pre-fetch vs residual tools, caching TTLs, adapter/port pattern, SLM taxonomy iteration cycle')}`);

<h2>6.1 Why Experiment?</h2>
<p>You can't intuit whether Sonnet generates better responses than Haiku for housing queries. You need data. The experiment framework lets you run controlled tests on live traffic without a code deploy.</p>

<h2>6.2 Deterministic Assignment</h2>
<pre><code class="language-python"># Deterministic: same session always gets the same variant
def assign_variant(session_id: str, experiment_id: str, traffic_pct: float) -> str:
    h = int(hashlib.md5(f"{experiment_id}:{session_id}".encode()).hexdigest(), 16)
    bucket = (h % 1000) / 1000.0     # 0.000 → 0.999
    if bucket >= traffic_pct:
        return "control"
    return "treatment" if bucket < traffic_pct / 2 else "control"</code></pre>
<div class="callout callout-info"><strong>Why deterministic?</strong>If assignment were random per request, the same user would get different variants mid-conversation — incoherent and unusable. Hash of session_id + experiment_id ensures a user always sees the same variant for the duration of the experiment.</div>

<h2>6.3 The Experiment Node</h2>
<pre><code class="language-python">async def experiment_node(state: BotState) -> dict:
    config = load_experiment_config()  # hot-loaded every 60s from config/experiments.yaml
    for exp in config.active_experiments:
        variant = assign_variant(state['session']['session_id'], exp.id, exp.traffic_pct)
        if variant == "treatment" and exp.override_model:
            return {
                "experiment_id": exp.id,
                "experiment_variant": variant,
                "routing": {"model_override_task": exp.override_model}
            }
    return {"experiment_id": None, "experiment_variant": "control"}</code></pre>

<h2>6.4 Statistical Validity</h2>
<div class="callout callout-warn">
  <strong>Common mistake: peeking too early</strong>
  20% traffic, 50/50 split, 3 days, 500 sessions. The difference between Haiku and Sonnet may be real but the sample is too small to reach p&lt;0.05.<br><br>
  Every session logs <code>experiment_id</code> and <code>experiment_variant</code> to Kafka for analysis.
</div>

<h2>6.5 Sample Size Calculation — Do This Before You Launch</h2>
<p>Launching without a target sample size means you'll either stop too early (false positive) or waste traffic (stopped too late). Run the math upfront.</p>
<div class="callout callout-info">
  <strong>The formula (simplified for proportions, e.g. intent accuracy or click-through rate):</strong>
  <pre><code class="language-python">import math

def min_sample_size_per_arm(baseline_rate, mde, alpha=0.05, power=0.80):
    """
    baseline_rate: current metric (e.g. 0.87 = 87% accuracy)
    mde: minimum detectable effect — smallest change worth caring about (e.g. 0.03 = 3pp)
    alpha: false positive rate (0.05 = 5%)
    power: probability of detecting a real effect (0.80 = 80%)
    """
    z_alpha = 1.96   # for alpha=0.05 (two-tailed)
    z_beta  = 0.842  # for power=0.80
    p1 = baseline_rate
    p2 = baseline_rate + mde
    p_bar = (p1 + p2) / 2
    n = ((z_alpha + z_beta)**2 * 2 * p_bar * (1 - p_bar)) / (mde**2)
    return math.ceil(n)

# Example: current accuracy 87%, want to detect 3pp improvement
n = min_sample_size_per_arm(0.87, 0.03)
# → 1,082 sessions per arm = 2,164 total
# At 1,000 sessions/day with 20% traffic split → 400/day total → 5.4 days minimum</code></pre>

  <strong>Key insight: the smaller the effect you want to detect, the more sessions you need.</strong> A 3pp improvement needs 4x more sessions than a 6pp improvement.

  <table style="margin-top:8px;font-size:12px">
    <tr><th>MDE you want to detect</th><th>Sessions per arm</th><th>Days at 400 sessions/day</th></tr>
    <tr><td>6pp (0.87 → 0.93)</td><td>~270</td><td>~1.4 days</td></tr>
    <tr><td>3pp (0.87 → 0.90)</td><td>~1,082</td><td>~5.4 days</td></tr>
    <tr><td>1pp (0.87 → 0.88)</td><td>~9,726</td><td>~48 days</td></tr>
  </table>
  A 1pp improvement is almost never worth running — the experiment would take 7 weeks.
</div>
<div class="callout callout-gotcha">
  <strong>Sequential testing (the "peeking" trap)</strong>
  Checking significance every day increases your false positive rate. If you check daily for 14 days at α=0.05, your actual false positive rate is ~40%. Fix: commit to a fixed sample size before looking, or use a sequential testing method (e.g. always-valid p-values, Bayesian bandits). In practice: set a calendar reminder for day N and don't open the dashboard before then.
</div>

<h2>7.1 The LLM Concurrency Gate</h2>
<pre><code class="language-python">class LLMConcurrencyGate:
    """Limit simultaneous LLM calls with a queue for overflow."""
    async def acquire(self) -> bool:
        count = await self.redis.incr(self.key)
        if count == 1:
            # Safety TTL: if this process crashes between incr and decr, the
            # counter auto-resets after 5 min rather than leaking forever.
            # Only set on first acquisition so normal traffic never hits the TTL.
            await self.redis.expire(self.key, 300)
        if count <= self.max_concurrent:
            return True   # slot available
        # Queue overflow: wait up to queue_wait_ms
        await self.redis.decr(self.key)
        return await self._wait_in_queue()

    async def release(self) -> None:
        await self.redis.decr(self.key)  # MUST happen even on exception</code></pre>
<div class="callout callout-warn"><strong>Fail-open for Redis errors</strong>If Redis is down, gate.acquire() must treat Redis errors as "slot available" (fail open), not "slot unavailable" (fail closed). Current behavior: raises on Redis error. Fix: wrap Redis calls and default to permitting the request.</div>
<div class="callout callout-tip">
  <strong>Why Redis and not asyncio.Semaphore?</strong>
  Great question. <code>asyncio.Semaphore</code> is simpler and would work perfectly — for a single server instance. The problem: at scale you run 20, 50, or 200 FastAPI instances behind a load balancer. Each has its own process memory; a semaphore in instance 1 has no idea about the load on instances 2-200.
  <br><br>
  Redis gives you a <em>cross-process, cross-server</em> counter. <code>INCR</code> is atomic at the Redis level — even 200 servers calling INCR simultaneously will each get a unique, sequential integer back. That's the property that makes it a safe distributed concurrency primitive.
  <br><br>
  Rule of thumb: use in-process primitives (Semaphore, Lock) for concurrency within a single process. Use Redis for concurrency across processes or servers.
</div>

<h2>7.2 Parallel Tool Fetching</h2>
<pre><code class="language-python">async def fetch_data_node(state: BotState, executor=None) -> dict:
    requirements = intent_registry.get_requirements(state['classification'])

    # Group by parallel_group — group 1 runs simultaneously, group 2 waits
    groups = group_by_parallel_group(requirements)
    results = {}
    for group_id in sorted(groups.keys()):
        tasks = [executor.execute(r.tool, build_params(r, state)) for r in groups[group_id]]
        group_results = await asyncio.gather(*tasks, return_exceptions=True)
        results.update(dict(zip([r.tool for r in groups[group_id]], group_results)))

    return {"pre_fetched_data": results}</code></pre>

        if global_count > self.global_max:

<pre><code class="language-python"># Check your actual session size

<div class="callout callout-warn">
  <strong>Redis Cluster — what "cross-slot transactions" means and why to avoid them</strong>
  Redis Cluster shards data across N nodes by hashing the key. Different keys hash to different slots (0–16383), which may live on different physical nodes.
  <br><br>
  Problem: if a session uses keys <code>session:abc</code>, <code>session:abc:ver</code>, and <code>gate:abc:count</code> — those might hash to three different nodes. Redis does not support multi-key commands (MSET, pipelines, Lua scripts) across nodes. The Lua script we use for optimistic locking (<code>session + version + update atomically</code>) would silently fail.

  <pre><code class="language-python"># Without hash tags: session:abc and session:abc:ver may be on different nodes
redis.set("session:abc", data)
redis.set("session:abc:ver", 3)

# With hash tags: both keys hash by {abc} → guaranteed same node
redis.set("session:{abc}", data)
redis.set("session:{abc}:ver", 3)
# Now: MULTI / Lua scripts / pipelines work across these two keys</code></pre>

<h2>11.3 Horizontal Scaling — The SSE Stickiness Problem</h2>
<p>FastAPI instances are stateless for REST routes. SSE is different: the <code>asyncio.Queue</code> lives in the server process's memory. If a client's SSE connection hops to a different instance, the queue doesn't follow — the client sees silence.</p>
<pre><code class="language-yaml"># AWS ALB sticky session config
TargetGroup:
  StickinessEnabled: true
  StickinessType: lb_cookie
  StickinessDurationSeconds: 300   # longer than any LLM response (typically &lt;30s)</code></pre>

  AWS ALB rebalances targets when instances are added/removed (deploys, autoscaling). During rebalancing, sticky cookie sessions may be temporarily violated — the cookie points to the old instance, but the load balancer routes to a new one.
  <br><br>

</div>
<div class="callout callout-info"><strong>Alternative: Redis Pub/Sub</strong>Replace <code>asyncio.Queue</code> with a Redis Stream keyed on <code>session_id</code>. Any instance emits; any instance consumes. Eliminates stickiness at the cost of one Redis round-trip per SSE frame (~0.5ms on same AZ).</div>

  <br><br>
  <strong>Why not Postgres INSERT?</strong>
  <table style="font-size:12px;margin-top:8px">
    <tr><th>Concern</th><th>Postgres INSERT</th><th>Kafka produce</th></tr>
    <tr><td>Speed (on hot path)</td><td>5-50ms (network + disk + ACID)</td><td>~1ms fire-and-forget (async batch)</td></tr>
    <tr><td>Multiple consumers</td><td>Each consumer polls the table, competes for rows</td><td>Each consumer has its own independent offset pointer — no competition</td></tr>
    <tr><td>Replay / recovery</td><td>You'd need audit tables or CDC</td><td>Built-in: replay from any point in time</td></tr>
    <tr><td>Decoupling</td><td>Producer must know the schema consumers need</td><td>Producer emits a raw event; each consumer transforms it for their own use</td></tr>
  </table>
  In this codebase, Kafka is <em>not</em> on the hot path — the user never waits for it. We fire-and-forget after sending the SSE response. Consumers (analytics, billing, monitoring) process events asynchronously.
</div>
<p>Partition key determines ordering guarantee. For conversation events, order matters within a conversation — use <code>session_id</code> as the partition key.</p>

<h2>12.2 The Template: Building an Agent for Any Domain</h2>
<div class="callout callout-info"><strong>How to write a taxonomy — the critical step</strong>A taxonomy prompt has four components: (1) <strong>Intent schema</strong> — JSON output structure. Ambiguity causes validate_slm failures. (2) <strong>Intent taxonomy</strong> — list of intents with one-sentence descriptions. Vague descriptions cause hallucination. (3) <strong>Filter schema</strong> — which keys may appear in filter_delta, with types. Missing a key means user input is silently dropped. (4) <strong>Few-shot examples</strong> — 3-5 per intent covering edge cases: ordinal refs, pivot detection, disambiguation responses.
<br><br>
<strong>What is a "few-shot example"?</strong> Showing the model worked examples inside the prompt, so it learns the pattern from demonstration rather than instruction alone. Like code documentation: instead of saying "classify queries correctly," you show three examples of (query → correct output) pairs. The model then pattern-matches your new query against those examples. More examples = higher accuracy but more tokens per call.
</div>
<pre><code class="language-plaintext">Step 1: Domain Taxonomy Design
  List all things a user can ask about your product.
  Group into 3–5 domains.
  For each domain, list 5–15 sub-intents.
  Write few-shot examples. BAD: "User wants help with their account."
  GOOD: "User wants to reset their password, unlock their account, or change
  their email — they provide their email and expect a reset link."

Step 2: Intent Registry — tier + data_requirements + filter carry-over

Step 3: Tool Registry — name, description, params with wire_param translations
  # wire_param = the LLM sees one name, the API expects another
  # Example: LLM outputs locality_uuids → translate_to_wire_format() → API receives 'localities'
  ToolParam(key='locality_uuids', type='array', wire_param='localities')

Step 4: Session Schema — what persists across turns for your domain?

Step 5: LLM Prompts — one per intent group, inject right data context

Step 6: Templates — structured data that appears without LLM text</code></pre>

<h2>12.4 Non-Python Teams: The Same Patterns, Different Languages</h2>
<p>The patterns (port/adapter, pre-fetch, tier system, two-stage SLM) are language-agnostic. The technology choices (LangGraph, asyncio) are not. Here's how to apply them elsewhere.</p>
<div class="two-col">
  <div class="col-card">
    <h4 style="color:var(--accent2)">Node.js + Express + LangChain.js</h4>
    <pre style="font-size:11px"><code class="language-javascript">// asyncio.Queue → PassThrough stream (with backpressure)
const { PassThrough } = require('stream');
const stream = new PassThrough();

// SSE stream with backpressure — stream.write() respects client read speed
app.get('/chat/stream', (req, res) => {
  res.setHeader('Content-Type', 'text/event-stream');
  stream.pipe(res);  // pipe handles backpressure automatically
});

// Pipeline emits into stream (sync-safe)
stream.write(\`data: \${JSON.stringify({ token: 'Hello' })}\\n\\n\`);</code></pre>
    <small style="color:var(--muted);font-size:10px">⚠️ EventEmitter has no backpressure — if the pipeline emits faster than the client reads, frames drop silently. Use PassThrough (stream with internal buffer + drain signal) instead.</small>
  </div>
  <div class="col-card">
    <h4 style="color:var(--accent5)">.NET + ASP.NET Core</h4>
    <pre style="font-size:11px"><code class="language-csharp">// asyncio.Queue → Channel&lt;T&gt;
var channel = Channel.CreateUnbounded&lt;string&gt;();

// Background pipeline writes
await channel.Writer.WriteAsync(token);

// SSE controller reads
await foreach (var token in channel.Reader.ReadAllAsync())
{
    await response.WriteAsync($"data: {token}\n\n");
    await response.Body.FlushAsync();
}

// ASP.NET Core middleware IS the pipeline analogy
// BotState → HttpContext.Items["BotState"]</code></pre>
  </div>
</div>
<div class="callout callout-info"><strong>The key insight</strong>ASP.NET Core middleware pipeline IS the analogy from Module 1 — it's not a metaphor, it's the same pattern implemented natively. <code>Channel&lt;T&gt;</code> is the direct equivalent of <code>asyncio.Queue</code>. The port/adapter interfaces translate 1:1 to C# interfaces or TypeScript interfaces.</div>
${quizSection(12, 'Module 12', 'Reusable framework vs domain-specific parts, taxonomy design, few-shot examples, case studies, Node.js and .NET equivalents')}`);

<h2>Testing Strategy: Three Layers</h2>
<div class="callout callout-tip"><strong>Layer 1 — Unit tests (every PR, &lt;30s, zero API cost)</strong>Each node takes (state: BotState, dep=None) and returns a dict. Unit testing is trivial: build a BotState with pytest fixtures, call the node function directly, assert on the returned dict. No need to run the full LangGraph graph.<pre style="margin-top:8px"><code class="language-python"># Test filter_apply_node directly
state = make_bot_state(classification={'filter_delta': {'price_max': '2cr'}})
result = await filter_apply_node(state)
assert result['session']['active_filters']['price_max'] == 20_000_000</code></pre></div>
<div class="callout callout-tip">
  <strong>Layer 2 — Model eval tests (nightly, ~$0.50/run)</strong>
  Run the SLM classifiers against a golden dataset of 50–100 labeled examples per domain. Catches prompt regressions when taxonomy prompts are edited.
  <br><br>
  <strong>Golden dataset format:</strong>
  <pre><code class="language-python"># tests/model_eval/golden_dataset.json
[
  {
    "input": "show me 3BHK in Bandra under 2Cr",
    "expected_domain": "property_search",
    "expected_intent": "search_properties",
    "expected_filter_keys": ["bhk", "localities", "price_max"],
    "expected_pivot": false
  },
  {
    "input": "tell me about the second one",
    "expected_domain": "property_search",
    "expected_intent": "view_property_detail",
    "expected_entity_ref": {"by": "cardinality", "value": 2},
    "expected_pivot": true
  }
]

# Test runner
async def test_classification_accuracy():
    results = [await classify(c["input"]) for c in GOLDEN_CASES]
    accuracy = sum(
        1 for r, c in zip(results, GOLDEN_CASES)
        if r["main_intent"] == c["expected_intent"]
    ) / len(GOLDEN_CASES)
    if accuracy &lt; 0.90:
        send_slack_alert(f"Accuracy dropped to {accuracy:.1%}!")
    assert accuracy &gt;= 0.90</code></pre>

  <strong>How to bootstrap from zero (Week 2):</strong> Send 20 test messages through the playground. Look at what the SLM returned. Label each one as correct/wrong. Correct ones go into the golden dataset. Wrong ones become few-shot examples. 20 labeled examples is enough to start — expand by 10 every week.
  <br><br>
  <strong>The golden dataset is the most valuable asset in this system — more valuable than any code.</strong> Version-control it, review it on every taxonomy change, expand it when a new bug is found in production.
</div>
<div class="callout callout-tip"><strong>Layer 3 — E2E tests (pre-release, manual)</strong>Run against dev environment with real adapters. Verify SSE stream produces valid events. Verify carousel renders correctly. Verify full pipeline produces valid output.</div>
