<h2>28.1 The Three Chunking Failure Zones</h2>
<div class="diagram-wrap">
  <pre style="margin:0;border:none;background:transparent;font-size:12px">Zone 1 — Chunk too small (50-100 tokens):
  "The 3BHK at Bandra"  ← chunk 1
  "West costs ₹2.5Cr"   ← chunk 2
  Query: "price of 3BHK Bandra" → chunk 2 alone → incomplete

Zone 2 — Chunk too large (1500-2000 tokens):
  [Overview][Pricing][Amenities][Parking][Rules][History]  ← one chunk
  LLM: "lost in the middle" → misses parking buried at position 5

Zone 3 — Boundary mismatch:
  "The price includes maintenance..."  ← chunk 1 ends mid-sentence
  "...charges of ₹5,000/month."        ← chunk 2
  Query: "what does price include?" → coherence broken

Optimal: 256-512 tokens, aligned to natural boundaries
Tuning signal: RAGAS context relevance &lt; 0.7 → chunking problem</pre>
</div>

<h2>28.2 Fixed-Size Chunking</h2>
<pre><code class="language-python">from langchain_text_splitters import RecursiveCharacterTextSplitter, TokenTextSplitter

# Default — works for most use cases
splitter = RecursiveCharacterTextSplitter(
    chunk_size=512,       # characters (≈128 tokens)
    chunk_overlap=50,     # 10% overlap preserves sentence continuity
    separators=["\n\n", "\n", ". ", " ", ""],
)

# Token-accurate (use when context window is the constraint)
token_splitter = TokenTextSplitter(chunk_size=256, chunk_overlap=20)</code></pre>
<div class="callout callout-warn">
  <strong>The overlap gotcha</strong>
  Without overlap, a sentence split across a chunk boundary appears only in one chunk. A query matching the second half misses the first half. 10% is the standard starting point; increase to 20% for dense technical content.
</div>

<h2>28.3 Semantic Chunking</h2>
<pre><code class="language-python">from langchain_experimental.text_splitter import SemanticChunker
from langchain_openai import OpenAIEmbeddings

splitter = SemanticChunker(
    embeddings=OpenAIEmbeddings(),
    breakpoint_threshold_type="percentile",  # split at the top 5% of similarity drops
)
chunks = splitter.split_documents(docs)
# Cost: ~1 embedding call per sentence. 10K sentences ≈ $0.02</code></pre>
<div class="callout callout-info"><strong>How SemanticChunker actually works</strong>
SemanticChunker embeds <em>every sentence</em>, then computes the cosine similarity between adjacent
sentence pairs. It finds the pairs where similarity drops most sharply — those are the topic
boundaries. <code>percentile</code> means: split at the top 5% of similarity drops (the largest topic
shifts). This is why chunks vary in size — a section on pricing might be 2 sentences; a section
on legal terms might be 20.
<br><br>
<strong>Performance warning:</strong> 10K sentences at <code>batch_size=512</code> takes ~30 seconds and
~20K embedding API calls (~$0.02 at text-embedding-3-small rates). For a large corpus, pre-compute
and cache sentence embeddings. Only use SemanticChunker for documents where you expect abrupt
topic changes — marketing copy, long-form articles, mixed-topic wiki pages. For structured
documents (pricing tables, technical specs), <code>MarkdownHeaderTextSplitter</code> is faster and more
predictable.
</div>
<p><strong>When to use:</strong> Dense prose covering 3+ topics per section; when RAGAS context relevance is low despite right-sized fixed chunks. <strong>Not needed</strong> for structured documents with clear headers.</p>

<h2>28.4 Document-Aware Chunking</h2>
<pre><code class="language-python">from langchain_text_splitters import MarkdownHeaderTextSplitter

md_splitter = MarkdownHeaderTextSplitter(
    headers_to_split_on=[("##", "section"), ("###", "subsection")],
)
# Each chunk = one markdown section
# metadata: {"section": "Pricing", "subsection": "EMI Options"}
# Metadata becomes filterable in vector DB: filter={"section": "Pricing"}</code></pre>
<p>Also: <code>HTMLHeaderTextSplitter</code> for web content, <code>PyMuPDFLoader</code> for PDFs (preserves page number in metadata). Use for legal docs (split by clause), technical docs (split by section), web content (split by header tag).</p>

<h2>28.5 Code Chunking</h2>
<pre><code class="language-python">from langchain_text_splitters import Language, RecursiveCharacterTextSplitter

code_splitter = RecursiveCharacterTextSplitter.from_language(
    language=Language.PYTHON,   # also: JS, TS, JAVA, GO, RUST, SWIFT, ...
    chunk_size=1500,
    chunk_overlap=100,
)
# Tries: class → function → block → line boundaries (in that order)
# Never splits mid-function — function + docstring + signature = one semantic unit</code></pre>

<h2>28.6 Hierarchical / Parent-Document Retrieval</h2>
<p>There's a fundamental tension in chunking that no single chunk size resolves:</p>
<ul>
  <li><strong>Small chunks (256 tokens)</strong> give high retrieval precision — each chunk covers one specific topic, so similarity search returns exactly the right passage. But when injected into the LLM prompt, a 256-token snippet often lacks surrounding context: a property description without the project brochure header, a price without the floor plan details.</li>
  <li><strong>Large chunks (2,000 tokens)</strong> give the LLM full context — the complete section, table, and surrounding paragraphs. But retrieval precision drops: a 2,000-token chunk covers too many topics, so cosine similarity gets diluted by irrelevant content within the chunk.</li>
</ul>
<p>Parent-document retrieval resolves this by <strong>decoupling retrieval from generation</strong>: index small chunks for retrieval (precision), but when a match is found, fetch the large parent chunk for the LLM (context). Think of it like finding a paragraph in a book by searching an index of every sentence, then handing the reader the full page. The small chunk says "this is the right section"; the parent chunk gives the LLM everything it needs to answer well.</p>
<pre><code class="language-python">from langchain.retrievers import ParentDocumentRetriever
from langchain.storage import InMemoryStore

retriever = ParentDocumentRetriever(
    vectorstore=vectorstore,
    docstore=InMemoryStore(),            # DEVELOPMENT ONLY — wiped on restart
    child_splitter=RecursiveCharacterTextSplitter(chunk_size=256),
    parent_splitter=RecursiveCharacterTextSplitter(chunk_size=2000),
)
retriever.add_documents(docs)
# Query: finds best 256-token child chunk → returns full 2000-token parent
# Fixes: high context relevance but low faithfulness (LLM lacks full context)</code></pre>
<div class="callout warning">
<strong>InMemoryStore is not production-ready</strong><br>
The data model: child chunk vectors store the <em>parent doc ID</em> in their metadata. At query time,
the retriever looks up that ID in the docstore to fetch the full parent. If the docstore is wiped
(process restart), the vector store still has chunks but the ID lookup fails silently — retrieval
returns empty results with no error.
<pre><code class="language-python"># Production: use RedisStore so docstore survives restarts
from langchain_community.storage import RedisStore

docstore = RedisStore(
    redis_url="redis://localhost:6379",
    key_prefix="parent_docs:",          # namespace to avoid key collisions
)

retriever = ParentDocumentRetriever(
    vectorstore=vectorstore,
    docstore=docstore,                  # survives restarts
    child_splitter=RecursiveCharacterTextSplitter(chunk_size=256),
    parent_splitter=RecursiveCharacterTextSplitter(chunk_size=2000),
)

# Initialization order: populate BOTH stores together
retriever.add_documents(docs)           # writes vectors + parent docs atomically

# Pre-flight check before serving traffic
def verify_stores_populated(retriever, sample_query: str) -&gt; bool:
    results = retriever.invoke(sample_query)
    return len(results) &gt; 0             # empty = one store out of sync</code></pre>
</div>

<h2>28.7 MMR and Cross-Encoder Reranking</h2>
<pre><code class="language-python"># MMR: avoid 5 near-identical chunks — balance relevance + diversity
results = vectorstore.max_marginal_relevance_search(
    query, k=5, fetch_k=20,
    lambda_mult=0.5,   # 0=max diversity, 1=max relevance
)

# Cross-encoder reranking: read query + doc together for accurate scoring
from langchain.retrievers.document_compressors import CohereRerank
reranker = CohereRerank(model="rerank-english-v3.0", top_n=3)
# Retrieve 10 cheaply → rerank to top 3 accurately
# Self-hosted alternative: BAAI/bge-reranker-large — free, ~40ms on GPU</code></pre>
<div class="callout callout-info"><strong>Why MMR matters for Housing.com property search</strong>
A property has 10 similar listings. With standard top-5 retrieval, you might get 5 variations of
the same building (different floors, similar prices). The LLM sees the same facts repeated and
cannot answer "what other options exist in Bandra?" MMR ensures the 5 results span different
buildings, price ranges, or localities.
<br><br>
<strong>lambda_mult tuning guide:</strong> <code>lambda_mult=0.7</code> (more relevance) → better for
question-answering where precision matters. <code>lambda_mult=0.3</code> (more diversity) → better for
exploratory browsing ("show me options in Andheri"). Start at 0.5.
<br><br>
<strong>Performance:</strong> <code>fetch_k=20</code> is <em>1</em> ANN search returning 20 candidates. MMR
scoring is then done in-memory across those 20 vectors — it is NOT 20 separate ANN queries.
The overhead vs standard retrieval is negligible (microseconds of numpy math).
</div>

<h2>28.8 The RAGAS-Driven Optimisation Loop</h2>
<div class="decision-tree">
  <span class="dt-q">Run RAGAS eval (200 samples, ~$1.00, ~3 min)</span>
  <br>│
  <br>├─ <span class="dt-q">Context Relevance &lt; 0.7?</span> <span class="dt-note">→ retriever returning wrong chunks</span>
  <br>│   ├─ Try smaller chunk size: 512 → 256 characters (RecursiveCharacterTextSplitter)
  <br>│   ├─ Try hybrid search (BM25 + vector)
  <br>│   ├─ Try MultiQueryRetriever or HyDE

<div class="callout callout-tip"><strong>MoE (Mixture of Experts) — how it actually works</strong>
Each transformer layer has 8 separate feed-forward networks (the "experts"). A small router network
(the gating function) looks at the input token representation and outputs weights for all 8 experts
— the top 2 by weight are activated. Yes, different tokens in the same sentence activate
different expert combinations.
<br><br>
<strong>Common misconception:</strong> the experts do NOT specialize by topic (e.g., "the legal expert" or
"the maths expert"). They learn complementary patterns during training, similar to how attention
heads in a standard transformer learn different patterns — the specialization emerges organically.
<br><br>
<strong>Why it matters:</strong> you pay inference cost for 2 experts (≈13B params) but the model has the
capacity of all 8 (47B params) because all experts were trained together. This is why Mixtral 8×7B
achieves GPT-3.5-class quality at roughly Llama-7B inference speed.
</div>

<div class="callout callout-tip"><strong>RAG vs long context — and the Lost-in-the-Middle problem</strong>
Liu et al. (2023) "Lost in the Middle" empirically showed LLM performance degrades when relevant
content is not at the beginning or end of context. At 32K tokens, models answer correctly 70% of
the time when the answer is in position 1, dropping to ~50% when buried in the middle.
<br><br>
<strong>Practical rule:</strong> Chunked RAG + reranking consistently outperforms "stuff everything into
context" for queries where the relevant passage is unknown in advance (most RAG scenarios). Use
long context when you need the full document structure (legal contract review, code audit) —
chunking destroys structural context that spans sections.
<br><br>
<strong>Gemini 1M context caveat:</strong> Benchmark performance at 1M tokens is significantly degraded vs
32K. Gemini's reliability above 128K tokens is not well-established for production use as of 2025.
</div>

<h2>30.2 llama.cpp and GGUF Quantisation</h2>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── Quality / Speed / Memory Triangle ────────────────────────────────────────

              │

              │
    ★ Q4_K_M ●───────────────── 4GB  ← RECOMMENDED SWEET SPOT

Implication: start with Q4_K_M. If quality drops on your eval set, try Q6_K.
If memory is the constraint (4GB GPU), try Q3_K_M and measure perplexity.</pre>

<div class="callout callout-tip"><strong>Q4_K_M is the sweet spot — but what does K_M mean?</strong>
3× memory reduction vs fp16, &lt;1% quality loss on most benchmarks. Ollama uses llama.cpp under the hood — <code>ollama pull</code> downloads GGUF files automatically.
<br><br>
<strong>K-quant nomenclature explained:</strong> K-quants use k-means clustering to assign quantisation
groups — instead of quantising every weight uniformly, they identify clusters of weights with
similar magnitudes and quantise each cluster with a shared scale factor. M/S/L denote the
importance weighting applied to different layer types: <code>_M</code> (medium) uses higher precision for
the most important layers (attention Q/K/V) and lower for less critical ones. This is why Q4_K_M
outperforms naive Q4_0 (uniform 4-bit) at the same memory footprint. <code>_S</code> is smaller/faster;
<code>_L</code> is larger/more accurate.
</div>

<h2>30.3 vLLM — Production GPU Serving</h2>
<p>vLLM is the production standard for serving open-source LLMs. Its key innovation: <strong>PagedAttention</strong> — KV cache in fixed-size pages allocated on demand, letting the same GPU serve 2–4× more concurrent requests.</p>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── GPU VRAM Usage: Traditional KV Cache vs PagedAttention ───────────────────

TRADITIONAL (pre-allocates max context per request):
GPU VRAM (80GB A100)
├── Model weights ████████████████████████████░ 16 GB
├── Request 1 KV  ████████████████░░░░░░░░░░░░  8 GB (max context, 200 actual tokens)
├── Request 2 KV  ████████████████░░░░░░░░░░░░  8 GB (pre-allocated, mostly empty)
├── Request 3 KV  ████████████████░░░░░░░░░░░░  8 GB (pre-allocated, mostly empty)
├── Request 4 KV  ████████████████░░░░░░░░░░░░  8 GB (pre-allocated, mostly empty)
└── [OUT OF VRAM at 5 concurrent requests — OOM error]

PAGEDATTENTION (allocates 16-token pages on demand):
GPU VRAM (80GB A100)
├── Model weights ████████████████████████████░ 16 GB
├── Req 1 KV      ██░░░░░░░░░░░░░░░░░░░░░░░░░░  2 GB (actual 200 tokens = 13 pages)
├── Req 2 KV      ██░░░░░░░░░░░░░░░░░░░░░░░░░░  2 GB
├── Req 3 KV      ██░░░░░░░░░░░░░░░░░░░░░░░░░░  2 GB
├── Req 4 KV      ██░░░░░░░░░░░░░░░░░░░░░░░░░░  2 GB
├── Req 5 KV      ██                             2 GB
├── ...up to ~30 concurrent requests ✓
└── Pages grow as context grows (like OS virtual memory pages)

Result: same GPU → 3–8× more concurrent requests → same cost, 3–8× more throughput</pre>
<div class="callout callout-info"><strong>PagedAttention — why it matters</strong>
Traditional KV cache pre-allocates the maximum context length for every request upfront, even for
a 10-token query using a 8K context model — this wastes GPU VRAM proportional to the context
window × batch size. PagedAttention borrows the OS virtual memory concept: KV cache is split into
fixed-size pages (e.g., 16 tokens each) and allocated on demand. A 10-token request only holds
its actual 10 tokens in cache. The freed VRAM lets vLLM serve 2–4× more concurrent requests on
the same hardware, directly increasing throughput without changing latency.
</div>
<div class="callout callout-tip"><strong>Getting started without an A100</strong>
You don't need $10K/month in GPUs to learn vLLM:

</div>

<div class="callout callout-info"><strong>Why Groq is 10× faster than an A100</strong>
Groq's LPU (Language Processing Unit) is a SIMD streaming processor with on-chip SRAM — no DRAM
bandwidth bottleneck. LLM inference is memory-bandwidth-bound: the GPU spends most of its time
reading weights from HBM (High Bandwidth Memory) into compute units. Groq eliminates this by
fitting the entire weight matrix in on-chip SRAM (~230 MB/s/GFlop vs ~1 MB/s/GFlop for A100 HBM).
This is why Groq achieves 800–1,200 tokens/sec on Llama 8B vs 100–200 on A100: the compute
isn't faster, the memory access is.
</div>

<h2>30.7 Inference Optimisation — Key Concepts</h2>
<table>
  <tr><th>Technique</th><th>What it does</th><th>Benefit</th></tr>
  <tr><td>KV Cache</td><td>Stores computed attention keys/values; reuses on next token</td><td>~5× decode speedup vs recomputing</td></tr>
  <tr><td>Prompt caching</td><td>Re-uses KV cache for identical prompt prefix across requests</td><td>~90% cost reduction (Module 16.6)</td></tr>
  <tr><td>Continuous batching</td><td>Inserts new requests mid-generation</td><td>2–4× throughput improvement</td></tr>
  <tr><td>Speculative decoding</td><td>Small draft model generates N tokens; large model verifies in one pass. See callout below.</td><td>2–3× speedup when draft is often correct</td></tr>
  <tr><td>Tensor parallelism</td><td>Splits weight matrices across multiple GPUs</td><td>Enables 70B+ on 4–8 GPUs</td></tr>
  <tr><td>Quantisation</td><td>Reduces weight precision (fp16 → int4)</td><td>3–4× memory reduction, small quality loss</td></tr>
</table>
<div class="callout callout-info">
  <strong>Speculative decoding — how the 2–3× speedup works</strong>
  The fundamental bottleneck in autoregressive generation: the large model generates <em>one token at a time</em>, sequentially. You cannot parallelise this — each token depends on all previous tokens. Speculative decoding breaks this constraint by introducing a small, fast "draft" model.
  <br><br>
  <strong>The algorithm:</strong>
  <ol style="margin:6px 0 0 16px">
    <li>The small draft model (e.g. 7B) generates 5–10 candidate tokens very quickly — it's fast because it's small.</li>
    <li>The large target model (e.g. 70B) verifies all N draft tokens in a <em>single forward pass</em> — this is parallelisable because the target model sees all N tokens simultaneously (unlike generation, verification can process them in parallel).</li>
    <li>If the target model agrees with the draft token at position k, all tokens 0..k-1 are accepted for free. If it disagrees at position k, tokens 0..k-1 are kept, token k is replaced with the target model's choice, and drafting restarts.</li>
  </ol>
  <strong>Why it's faster:</strong> When the draft model is right (which it often is for common words, code patterns, obvious continuations), you effectively got N tokens from one forward pass of the large model — N× throughput. The cost of running the small draft model is negligible compared to the large model. Net speedup: 2–3× on typical text, up to 4× on structured output where the draft is very predictable.
</div>
<div class="callout callout-info"><strong>Continuous batching vs static batching — the throughput gap</strong>
<pre>Static batching (old): GPU waits for the SLOWEST request to finish before starting new ones
  t=0  [Req A: 10 tokens] [Req B: 10 tokens] [Req C: 10 tokens]  ← batch starts
  t=5  [Req A: done      ] [Req B: 10 tokens] [Req C: 10 tokens]  ← A done, GPU idles
  t=10 [              NEW BATCH STARTS here                     ]  ← B,C done

Continuous batching (vLLM): new requests slot in as soon as a slot frees
  t=0  [Req A: 10 tokens] [Req B: 10 tokens] [Req C: 10 tokens]
  t=5  [Req D: NEW!     ] [Req B: 10 tokens] [Req C: 10 tokens]  ← A done, D inserted
  t=7  [Req D: 5 tokens ] [Req E: NEW!     ] [Req C: 10 tokens]  ← B done, E inserted
</pre>
Result: GPU utilisation goes from ~50% to ~90% under real-world request patterns.
The 2–4× throughput improvement is from filling GPU idle slots, not from faster computation.
</div>

<h2>31.1 The Adaptation Hierarchy</h2>
<div class="callout callout-info"><strong>What are model weights?</strong>
A model's weights are a large binary file of floating-point numbers — for Llama 3.1 8B, ~16GB of
fp16 floats stored in a file called <code>model.safetensors</code>. Each number is a learned parameter:
a coefficient in a matrix multiplication that transforms the input text into the output prediction.
Fine-tuning means running gradient descent to nudge those numbers slightly in a direction that
makes the model better at your specific task. You are not rewriting the model's "knowledge" —
you are adjusting the mapping from inputs to outputs. This is why fine-tuning on a narrow corpus
can cause catastrophic forgetting: the nudges that improve narrow task performance subtly degrade
the general patterns learned during pre-training.
<br><br><strong>Detecting catastrophic forgetting — 3 concrete signals:</strong>
<ol>
<li><strong>MMLU regression &gt;2%:</strong> run <code>python -m lm_eval --model hf --model_args pretrained=./fine-tuned --tasks mmlu --num_fewshot 5</code> on both base and fine-tuned. A drop &gt;2 points signals forgetting of general reasoning.</li>
<li><strong>Model refuses off-topic queries:</strong> test with 20 unrelated prompts ("What is 2+2?", "Summarise this news article") — if fine-tuned model refuses or gives degraded responses, it has over-specialised.</li>
<li><strong>Output diversity collapse:</strong> send the same prompt 10× with temperature=1. If 8 of 10 responses are near-identical, the model has converged to a degenerate mode. Fix: add more diverse training data and reduce epochs.</li>
</ol>
Rule: include 20% general-domain data (e.g., Alpaca, FLAN) with 80% domain-specific data to preserve general capability.
</div>
<pre><code class="language-text">Level 1 — Prompt Engineering (minutes, free)
  Structured prompts, few-shot examples, CoT instructions
  Use when: model already has the capability, just needs guidance

Level 2 — RAG / Context Injection (hours, cheap)
  Inject domain knowledge at inference time
  Use when: knowledge is frequently updated or too large for prompts

Level 3 — Fine-Tuning (days, moderate cost)
  Bake style/behaviour/domain patterns into weights
  Use when: consistent output format, proprietary tone, domain vocab
  NOT for: adding new facts (facts hallucinate; RAG > fine-tuning for knowledge)

Level 4 — Train from Scratch (months, very expensive)
  Use when: you are a lab, not a product team</code></pre>

<h2>31.3 LoRA — Low-Rank Adaptation</h2>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── LoRA inside a Transformer Attention Block ────────────────────────────────

Input x ──────────────────────────────────────────────────────────────────►
         │                                                                  │
         ▼                                                                  │
 ┌──────────────────────────────────────────────────────────────────────┐   │
 │  W_q (frozen, 4096×4096 = 16.7M params) ──► Q                      │   │
 │  W_k (frozen)                            ──► K    attention output ─┤   │
 │  W_v (frozen)                            ──► V                      │   │
 └──────────────────────────────────────────────────────────────────────┘   │
         │                                                                   │
 ┌──────────────────────────────────────────────────────────────────────┐   │
 │  LoRA adapter (TRAINED, only these update):                          │   │
 │    A  (4096×16 = 65K params)  ──► B  (16×4096 = 65K params)         │   │
 │    ΔW = A × B  (same shape as W_q, but via low-rank bottleneck)     │   │
 └──────────────────────────────────────────────────────────────────────┘   │
         │                                                                   │
  W' = W_q + (α/r) × ΔW   ← combined at inference (or merged via          │
                               merge_and_unload() to remove overhead)        │
         └────────────────────────────────────────────────────────────────►  │
                                                                         +   │
                                                                   residual ─┘

Trainable params: 2 × (4096 × 16) = 131K  vs  full W: 16.7M  →  0.8% of W</pre>
<p>LoRA freezes original weights and adds small trainable rank-decomposition matrices. This is the practical default for fine-tuning.</p>
<pre><code class="language-text">Original weight: W ∈ ℝ^(d×k)  — frozen
LoRA delta:      ΔW = A × B   — trained
  A ∈ ℝ^(d×r), B ∈ ℝ^(r×k), where r &lt;&lt; d
At inference: W' = W + α/r × ΔW</code></pre>
<pre><code class="language-python">from peft import LoraConfig, get_peft_model, TaskType

config = LoraConfig(
    task_type=TaskType.CAUSAL_LM,
    r=16,              # rank — higher = more capacity, more VRAM
    lora_alpha=32,     # scaling factor (typically 2×r)
    lora_dropout=0.05,
    target_modules=["q_proj", "v_proj"],  # which weight matrices get adapters
    bias="none",
)
model = get_peft_model(base_model, config)
# trainable params: ~4M of 6.7B total = 0.06%</code></pre>
<div class="callout callout-info"><strong>What are <code>target_modules</code> and which should you choose?</strong>
Every transformer attention block contains four projection matrices: <code>q_proj</code> (Query), <code>k_proj</code> (Key), <code>v_proj</code> (Value), and <code>o_proj</code> (Output). <code>["q_proj", "v_proj"]</code> is the minimal effective set from the original LoRA paper — it covers most style and format adaptation with the fewest extra parameters.
<br><br>
<strong>When to add more modules:</strong>
<ul style="margin:6px 0 0 16px">
  <li><strong>Add <code>k_proj</code>, <code>o_proj</code></strong> for stronger attention adaptation (complex reasoning tasks, code generation).</li>
  <li><strong>Add FFN modules (<code>gate_proj</code>, <code>up_proj</code>, <code>down_proj</code>)</strong> when the task requires new factual knowledge, not just style change. The FFN stores facts; the attention heads store patterns.</li>
  <li><strong>Common strong config for code:</strong> <code>["q_proj", "k_proj", "v_proj", "o_proj", "gate_proj", "up_proj", "down_proj"]</code> — covers all linear layers. More parameters, more VRAM, stronger adaptation.</li>
</ul>
Rule of thumb: start with Q+V only. If eval loss plateaus too high, add K+O. If still not enough, add FFN modules.
</div>
<div class="callout callout-info"><strong>Why does low-rank adaptation work? (Hu et al. 2021)</strong>
The empirical finding from the LoRA paper: the weight changes needed to adapt a pre-trained model
to a new task have low intrinsic rank. In practice, the useful adaptation signal lives in a small
subspace of the full weight matrix. A d×k weight matrix (e.g., 4096×4096 = 16.7M params) can be
approximated by A×B where r=16: 4096×16 + 16×4096 = 131K params — a 99.2% reduction. LoRA
trains only A and B, adds their product ΔW to the frozen W at inference.
<br><br>
<strong>Choosing rank r:</strong> r=4 works for simple style/format tasks. r=16 is the standard starting point.
r=64+ for complex tasks like code generation. Higher rank = more capacity = more VRAM = more
risk of overfitting on small datasets. Start at r=16, tune based on eval loss plateau.
</div>

<h2>31.4 QLoRA — 4-Bit + LoRA</h2>
<p>QLoRA quantises base model weights to 4-bit NF4 format, then applies LoRA on top. This is the practical path for large models on consumer hardware.</p>
<div class="callout callout-info"><strong>What is NF4 and why is it better than int4?</strong>
NF4 (Normal Float 4) uses a quantisation grid whose bins are spaced according to a normal
distribution — the most common distribution of pretrained weight values. This means NF4 is
information-theoretically optimal for normally distributed weights: the dense region around zero
gets more quantisation bins, the sparse tails get fewer. Standard int4 uses equally-spaced bins,
which wastes resolution in the tails and loses precision near zero. In practice, NF4 matches int4
VRAM usage but recovers ~0.2–0.5% of quality loss on language modeling tasks.
</div>
<pre><code class="language-python">from transformers import BitsAndBytesConfig
import torch

bnb_config = BitsAndBytesConfig(
    load_in_4bit=True,
    bnb_4bit_quant_type="nf4",       # NF4 outperforms int4 for LLMs
    bnb_4bit_compute_dtype=torch.bfloat16,
    bnb_4bit_use_double_quant=True,
)
model = AutoModelForCausalLM.from_pretrained(
    "meta-llama/Meta-Llama-3.1-8B",
    quantization_config=bnb_config,
    device_map="auto",
)</code></pre>

<h2>31.5 Fine-Tuning Pipeline</h2>
<pre><code class="language-python"># Step 1 — Dataset format (ChatML)
dataset = [{
    "messages": [
        {"role": "system",    "content": "You are a property classifier. Output JSON only."},
        {"role": "user",      "content": "3BHK flat in Powai, 1.8Cr, semi-furnished"},
        {"role": "assistant", "content": '{"intent":"property_search","bedroom":3,"location":"Powai","budget_max":18000000}'}
    ]
}]  # 500 diverse examples &gt; 5000 repetitive ones. Hold out 10-20%.</code></pre>
<div class="callout callout-warn"><strong>What "diverse" actually means for fine-tuning data</strong>
Diversity means covering: (1) varied phrasings of the same intent — "2BHK in Bandra", "two
bedroom flat Bandra", "Bandra 2 bedroom apartment under 2Cr" should all be in training, not
just one; (2) edge cases and ambiguous inputs — partial queries, typos, mixed Hindi/English, price
ranges expressed differently; (3) negative examples where the model should <em>not</em> return a
property_search intent — "what is the EMI formula?" or "who is your CEO?".
<br><br>
A common failure mode: fine-tuned on 2,000 examples that are all variations of the same 10
templates. The model overfits to those templates and fails on paraphrases it never saw. Measure
diversity by running your training set through a sentence embedding model and checking for
clusters — if 80% of examples cluster tightly, you have a diversity problem.
</div>
<pre><code class="language-python">from transformers import TrainingArguments
from trl import SFTTrainer

args = TrainingArguments(
    output_dir="./housing-classifier",
    num_train_epochs=3,
    per_device_train_batch_size=4,
    gradient_accumulation_steps=4,   # effective batch = 16
    learning_rate=2e-4, bf16=True,
    eval_strategy="steps", eval_steps=200,
    warmup_ratio=0.03,
)
trainer = SFTTrainer(model=model, args=args, train_dataset=train_ds,
                     eval_dataset=eval_ds, peft_config=lora_config, max_seq_length=2048)
trainer.train()

# Step 3 — Merge adapters back into base weights
from peft import PeftModel
merged = PeftModel.from_pretrained(base_model, "./housing-classifier").merge_and_unload()
merged.save_pretrained("./housing-classifier-merged")</code></pre>

<h2>31.6 RLHF & DPO</h2>
<p><strong>RLHF pipeline:</strong> (1) SFT on demonstrations → (2) Reward Model on human preference pairs (A vs B) → (3) PPO to maximise reward model score.</p>
<p><strong>DPO (Direct Preference Optimisation):</strong> Simpler — skip the reward model, train directly on preference pairs (chosen vs rejected). Fewer moving parts, works well for most alignment goals.</p>
<p>Two things in the code below need explanation before you read it:</p>
<ul>
  <li><strong><code>ref_model</code></strong> — a frozen copy of your SFT-trained model. DPO trains by comparing how much more likely the policy model rates <code>chosen</code> vs <code>rejected</code>, relative to how the reference model rated them. Without the reference, the model could "game" the objective by assigning extreme probabilities. The reference acts as a regulariser: "don't drift too far from what the SFT model would say." In practice, you load the same base checkpoint twice — one unfrozen (trains), one frozen (reference).</li>
  <li><strong><code>beta=0.1</code></strong> — controls how strictly the model must stay near the reference distribution. Lower beta (0.05) lets the model change more freely — learns preferences faster but risks losing general capability ("reward hacking"). Higher beta (0.5) keeps it closer to the SFT baseline — safer but learns more slowly. The paper recommends starting at 0.1.</li>
</ul>
<pre><code class="language-python">from trl import DPOTrainer, DPOConfig
dpo_config = DPOConfig(beta=0.1)  # KL regularisation weight vs SFT reference
trainer = DPOTrainer(
    model=model, ref_model=ref_model,  # frozen SFT copy
    args=dpo_config,
    train_dataset=pref_dataset,  # {"prompt", "chosen", "rejected"}
)</code></pre>
<div class="callout callout-tip"><strong>DPO beta — what it controls</strong>
<code>beta=0.1</code> is the KL regularisation weight between the trained policy and the frozen SFT reference.
Low beta (0.05–0.1) = model can change more freely from the SFT baseline; risk of over-optimising
the preference signal and losing general capability. High beta (0.3–0.5) = model stays close to
SFT; safer but slower to learn preferences. Standard starting point: 0.1. If you see the model
"reward hacking" (gaming the preference metric without improving real quality), increase beta.
<br><br>
<strong>When you need RLHF/DPO:</strong> Safety alignment, toxicity reduction, optimising for a measurable human preference signal. For most product fine-tuning, SFT on good examples is sufficient.
</div>

<h2>31.7 Fine-Tuning Evaluation</h2>
<pre><code class="language-python">def evaluate_classifier(model, test_examples):
    correct = 0
    for ex in test_examples:
        pred = model.generate(ex["input"])
        try:
            parsed = json.loads(pred)
            if parsed["intent"] == ex["expected_intent"]:
                correct += 1
        except json.JSONDecodeError:
            pass  # invalid JSON = failure
    return correct / len(test_examples)

# Benchmark regression: expect ≤2% MMLU drop vs base model
# Production A/B: shadow mode 24h → compare vs incumbent → promote</code></pre>

<div class="callout callout-info"><strong>OpenRouter routing modes</strong>
<ul>
  <li><code>"route": "fallback"</code> — tries providers in order; triggers on 5xx errors, timeouts, or rate limit responses. Latency penalty only when primary fails.</li>
  <li><code>"route": "cheapest"</code> — routes to the cheapest provider for that model right now (price fluctuates). Best for batch workloads with no latency SLA.</li>
  <li><code>"route": "latency"</code> — routes to the lowest-latency provider based on OpenRouter's live measurements. Best for user-facing streaming.</li>
</ul>
Fallback does NOT help if all providers are down for the same model. For true HA, put different
models as fallbacks: Claude Sonnet → GPT-4o → Gemini 1.5 Pro so a provider outage doesn't

<h2>33.1 What Makes Something an "Agent"</h2>
<p>An agent is a system that <strong>perceives</strong> its environment, <strong>reasons</strong> about what action to take, <strong>acts</strong> by calling a tool or routing, and <strong>observes</strong> the result — then loops. The key property distinguishing agents from chains: <strong>cycles</strong>.</p>
<pre><code class="language-text">Chain:  Input → Step 1 → Step 2 → Output   (no loops, deterministic)
Agent:  Input → Think → Act → Observe → Think → Act → ... → Output</code></pre>
<div class="callout callout-tip">
  <strong>The agent cost equation:</strong> Every loop adds +1 LLM call (~200ms, ~$0.001), +1 parsing step, +1 failure mode. A 5-step agent = 5× cost and 5× failure surface vs a direct call. Always ask: does this problem need a loop?
</div>

<h2>33.2 ReAct — Reason + Act</h2>
<p>ReAct interleaves reasoning (Thought) and action (Action/Observation) in the LLM context. The model narrates its reasoning before calling tools.</p>
<pre><code class="language-text">Thought: I need to find current property prices in Bandra before I can answer.
Action: search_listings(location="Bandra", bedroom=2)
Observation: [{"price": 15000000, ...}, ...]
Thought: Average price ~1.5Cr. Now I can calculate affordability.
Action: calculate_emi(principal=15000000, rate=8.5, years=20)
Observation: {"emi": 130000}
Answer: A 2BHK in Bandra costs ~1.5Cr. EMI = ₹1.3L/month at 8.5% over 20 years.</code></pre>
<pre><code class="language-python">from langchain.agents import create_react_agent, AgentExecutor
from langchain import hub

prompt = hub.pull("hwchase17/react")
tools = [search_listings_tool, calculate_emi_tool, get_property_details_tool]
agent = create_react_agent(llm, tools, prompt)
executor = AgentExecutor(
    agent=agent, tools=tools, verbose=True,
    max_iterations=10,       # hard cap — prevents infinite loops
    handle_parsing_errors=True,
)</code></pre>
<div class="callout callout-info"><strong>How ReAct works mechanically</strong>
The <code>hub.pull("hwchase17/react")</code> prompt template includes three parts: (1) the tools list with
descriptions, (2) format instructions telling the model to output <em>exactly</em>
"Thought: ... \nAction: tool_name\nAction Input: {json}" — the agent parser splits on these
markers; (3) an <code>{agent_scratchpad}</code> variable that grows with each Thought/Action/Observation
cycle.
<br><br>
<strong>Common failure trace</strong> (tool parsing error):
<pre>Thought: I need to search for properties.
Action: Search listings in Bandra          ← wrong: not a valid tool name
Action Input: ...
PARSING ERROR: No tool found named 'Search listings in Bandra'</pre>
<strong>Root cause:</strong> Tool description said "search listings" but tool name is <code>search_listings</code>.
The LLM copied natural language instead of the programmatic name. Fix: make tool names
unambiguous and distinct; add <code>name</code> explicitly: <code>Tool(name="search_listings", ...)</code>.
</div>
<table>
  <tr><th>Failure mode</th><th>What happens</th><th>Mitigation</th></tr>
  <tr><td>Reasoning drift</td><td>Model hallucinates tool result instead of calling tool</td><td>Structured output for tool calls</td></tr>
  <tr><td>Tool selection error</td><td>Wrong tool → irrelevant result → spiral</td><td>Clear, distinct tool descriptions</td></tr>
  <tr><td>Infinite loop</td><td>Same tool, same args, forever</td><td><code>max_iterations</code> — always set this</td></tr>
  <tr><td>Verbose overhead</td><td>Every intermediate step in context → expensive</td><td>Trim intermediate observations</td></tr>
</table>
<p><strong>When ReAct works well:</strong> 2–5 tool calls with branching, tasks where explaining reasoning is valuable, well-documented distinct tools.</p>

<h2>33.3 Plan-and-Execute</h2>
<p>A planner LLM creates an upfront ordered task list; executor agents run each step. Separating planning from execution reduces hallucination — the model commits to a correct plan before acting.</p>
<pre><code class="language-text">Planner (GPT-4o): "To find the best 2BHK in Bandra under 2Cr:
  1. Search listings (Bandra, 2BHK, budget ≤ 2Cr)
  2. For top 3 results: fetch full property details
  3. Rank by price/sqft ratio
  4. Format recommendation"

Executor: Runs each step with appropriate tools
Replanner: If step fails → revise remaining plan</code></pre>
<pre><code class="language-python">from langchain_experimental.plan_and_execute import PlanAndExecute, load_agent_executor, load_chat_planner

planner  = load_chat_planner(llm)
executor = load_agent_executor(llm, tools, verbose=True)
agent    = PlanAndExecute(planner=planner, executor=executor, verbose=True)</code></pre>
<p><strong>vs ReAct:</strong> Better for 5–15 sequential steps, tasks needing an audit trail, tasks where plan transparency matters to users. Weaker when the plan must adapt mid-execution — add a replanning step for that.</p>
<div class="callout callout-info"><strong>Adding a replanner to handle mid-execution failures</strong>
<pre><code class="language-python">def execute_with_replan(state: PlanState) -&gt; PlanState:
    for i, step in enumerate(state["plan"]):
        try:
            result = executor.invoke({"input": step})
            state["results"].append(result["output"])
        except Exception as e:
            # Step failed — call replanner with context of what succeeded
            new_plan = replanner_llm.invoke(
                f"Original plan: {state['plan']}\n"
                f"Completed steps: {state['plan'][:i]}\n"
                f"Failed at step {i}: {step}\n"
                f"Error: {e}\n"
                "Revise the remaining plan to still achieve the original goal."
            )
            state["plan"] = state["plan"][:i] + parse_plan(new_plan.content)
    return state</code></pre>
The replanner LLM call adds latency but prevents silent partial completions. For interview
answers: mention that the replanner sees completed steps to avoid re-doing work.
</div>

<h2>33.4 Reflexion</h2>
<p>Reflexion adds self-critique and episodic memory of past failures. After each attempt, the agent critiques its own output and generates a verbal reflection stored in memory. Subsequent attempts use that reflection.</p>
<p><strong>The key mechanic — how the loop actually works:</strong></p>
<ol>
  <li>Agent makes an attempt and writes it to <code>attempts</code>.</li>
  <li><code>reflect_node</code> reads the last attempt and asks the LLM to critique it: "what went wrong? what should you try instead?" The critique is stored in <code>reflections</code>.</li>
  <li>On the next attempt, the agent prompt is built from <em>all</em> prior reflections: "Previous attempt 1 failed because X. Attempt 2 failed because Y. Now try again with these lessons." The agent gets a richer prompt each round.</li>
  <li><code>should_continue</code> is the circuit breaker — it checks attempt count and routes to either "reflect" (another loop) or "end" (take best answer so far).</li>
</ol>
<p>The <code>attempts</code> list stores the outputs; the <code>reflections</code> list stores the critiques — they're kept separate so the next attempt prompt can interleave them clearly: "Attempt 1: [output]. Critique: [what was wrong]. Attempt 2: [output]. Critique: [what was wrong]. Now: [new attempt]."</p>
<div class="callout callout-warn">
  <strong>When Reflexion fails:</strong> If the task has no verifiable ground truth (no test that passes/fails, no external scorer), the self-critique is subjective — the model may criticise things that are actually fine, or fail to critique real errors. Reflexion works best when correctness is checkable: code that runs tests, SQL that executes, math with a verifiable answer. For open-ended writing tasks, the "spiral" failure mode is common: the agent second-guesses itself across 3 attempts and ends up with a worse result than attempt 1.
</div>
<pre><code class="language-python">class ReflexionState(TypedDict):
    input: str
    attempts: list[str]
    reflections: list[str]
    final_answer: str | None

def reflect_node(state: ReflexionState) -> ReflexionState:
    last = state["attempts"][-1]
    critique = llm.invoke(
        f"Critique this answer for accuracy: {last}\nWhat should you do differently?"
    ).content
    return {**state, "reflections": state["reflections"] + [critique]}

def should_continue(state: ReflexionState) -> str:
    return "end" if len(state["attempts"]) >= 3 else "reflect"</code></pre>
<p><strong>When Reflexion works:</strong> Tasks with verifiable correctness (code passing tests, math problems), clear quality criteria, reliable external scorer. <strong>When it fails:</strong> Vague tasks where self-critique has no ground truth — agent spirals. Always bound max attempts.</p>

<h2>33.5 Tool Selection at Scale &amp; Memory Taxonomy</h2>
<pre><code class="language-python"># With 50+ tools: retrieve the relevant subset dynamically
tool_docs = [Document(page_content=t.description, metadata={"name": t.name}) for t in all_tools]
tool_store = Chroma.from_documents(tool_docs, OpenAIEmbeddings())

def get_relevant_tools(query: str, k: int = 5) -> list[Tool]:
    relevant = tool_store.similarity_search(query, k=k)
    names = {doc.metadata["name"] for doc in relevant}
    return [t for t in all_tools if t.name in names]</code></pre>

 │                │                  │ search_web()    │                │
 │                │                  │ fetch_data()    │                │
 │                │◄─findings────────│                 │                │
 │                │──route────────────────────────────►│                │
 │                │                  │            compute_stats()       │
 │                │◄─analysis──────────────────────────│                │
 │                │──route─────────────────────────────────────────────►│
 │                │                  │                 │  draft_report()│
 │                │◄─draft──────────────────────────────────────────────│
 │                │                  │                 │                │
 │                │ [content present?]                 │                │
 │                │──route──────────────────────────────────────────────►│
 │                │                  │                 │  revise_draft()│
 │                │◄─final──────────────────────────────────────────────│
 │                │ [FINISH]          │                 │                │
 │◄─report────────│                  │                 │                │

Key: agents do NOT call each other directly.
     Supervisor reads shared state → routes to next agent → agent writes to state.
     Termination: supervisor emits FINISH when writer's output has content and no revision flags.</pre>
<p>A supervisor LLM routes work to specialist agents and aggregates results. The supervisor decides <em>who</em> does the work; specialist agents do the actual domain work.</p>
<pre><code class="language-text">User query → Supervisor → Research Agent → Supervisor
                        ↘ Analyst Agent  → Supervisor → Final answer
                        ↘ Writer Agent   → Supervisor</code></pre>
<pre><code class="language-python">from langgraph.graph import StateGraph, START, END
from typing import Literal

class SupervisorState(TypedDict):
    messages: Annotated[list, add_messages]
    next: str

def supervisor_node(state: SupervisorState) -> SupervisorState:
    system = """Route to the best agent:
    - research: needs web search or document retrieval
    - analyst:  needs numerical analysis or data processing
    - writer:   needs to compose a final response
    - FINISH:   work is complete"""
    response = llm_with_structured_output.invoke(
        [SystemMessage(content=system), *state["messages"]]
    )
    return {**state, "next": response.next}

def route(state: SupervisorState) -> Literal["research", "analyst", "writer", "FINISH"]:
    return END if state["next"] == "FINISH" else state["next"]

graph = StateGraph(SupervisorState)
graph.add_node("supervisor", supervisor_node)
for name, fn in [("research", research_agent), ("analyst", analyst_agent), ("writer", writer_agent)]:
    graph.add_node(name, fn)
    graph.add_edge(name, "supervisor")  # always return to supervisor

graph.add_edge(START, "supervisor")
graph.add_conditional_edges("supervisor", route)
app = graph.compile()</code></pre>
<div class="callout callout-info"><strong>How agents communicate: shared state, not function calls</strong>
In LangGraph, agents communicate by reading and writing to a shared Python dict (the State). Each
agent node receives the full state dict and returns a partial dict of fields it updates —
LangGraph merges the returned dict back into the state using field reducers.
<br><br>
This is different from function calls: the writer agent doesn't call the analyst agent; it reads
<code>state["analysis"]</code> that the analyst already wrote in a previous node execution. The supervisor
reads <code>state["messages"]</code> to decide who goes next. There is no message queue — just a growing
shared dict.
<br><br>
<strong>Key invariant:</strong> Every agent node only reads fields it needs and writes fields it owns.
When two agents write the same field, the reducer handles merging (<code>add_messages</code> for lists,
last-write-wins for scalars). Violating this causes silent state corruption.
</div>
<div class="callout callout-warn"><strong>Supervisor termination — the most common multi-agent bug</strong>
The supervisor outputs <code>"FINISH"</code> based on <em>its own judgement</em> of the messages it has seen.
If the writer's output is in <code>state["messages"]</code>, the supervisor should see it and route to
<code>FINISH</code>. Two common failure modes:
<br><br>
(1) <strong>Loop without termination:</strong> The writer appends its output but uses a different field;
the supervisor never sees it in messages → routes to writer again → infinite loop. Fix: always
use <code>state["messages"]</code> as the canonical output channel.
<br><br>
(2) <strong>Premature FINISH:</strong> The supervisor is called before the writer completes (async race).
Fix: always <code>add_edge(writer, supervisor)</code> — the edge ensures the supervisor only runs after the
writer has written. The supervisor logic should check <em>content</em>: "does messages contain a
final_answer?", not just the existence of a writer message.
</div>

<h2>34.3 Hierarchical Architecture</h2>
<p>Supervisor of supervisors. Each subgraph is a compiled LangGraph graph used as a node in the parent.</p>
<pre><code class="language-text">Orchestrator
  ├─ Research Supervisor → [Web Search, Doc Retrieval, Fact Check]
  ├─ Analysis Supervisor → [Financial Analyst, Risk Agent]
  └─ Output Supervisor   → [Writer, Editor]</code></pre>
<pre><code class="language-python"># Compile specialist subgraph
research_subgraph = research_builder.compile()

# Use as a single node in the parent graph
main_graph.add_node("research_team", research_subgraph)
main_graph.add_edge("orchestrator", "research_team")
main_graph.add_edge("research_team", "analysis_team")</code></pre>
<p><strong>When to use:</strong> 10+ agents, clear team boundaries, genuinely independent pipeline stages (research → analysis → output are separate domains of ownership).</p>

<h2>34.4 Collaborative / Debate Architecture</h2>
<p>In a supervisor architecture, a manager decides who handles what. In a debate architecture, <strong>two peer agents take turns</strong> — one generates, one critiques — until quality criteria are met or a maximum round count is reached. There is no central decision-maker; quality emerges from the adversarial back-and-forth.</p>
<p>The FE analogy: this is a <strong>code review loop</strong> — author submits a PR, reviewer comments, author revises, reviewer re-checks. Unlike the critic-revision loop in M42.1 (where one agent does both roles), here the generator and critic are <em>separate</em> LLM calls — you can give each a different system prompt, model, or temperature. The critic prompt says "be adversarial and find flaws"; the generator prompt says "incorporate the critique and improve."</p>
<p>The <code>DebateState</code> fields: <code>messages</code> accumulates the full dialogue (proposals + critiques interleaved, like a chat thread). <code>iterations</code> is the circuit breaker — without it, the loop could run indefinitely if the critic always finds something to object to.</p>
<pre><code class="language-python">class DebateState(TypedDict):
    messages: Annotated[list, add_messages]
    iterations: int

def generator(state: DebateState) -> DebateState:
    proposal = llm.invoke(state["messages"]).content
    return {**state,
            "messages": state["messages"] + [AIMessage(content=proposal)],
            "iterations": state["iterations"] + 1}

def critic(state: DebateState) -> DebateState:
    critique = llm.invoke(
        f"Critique for accuracy and completeness:\n{state['messages'][-1].content}"
    ).content
    return {**state, "messages": state["messages"] + [HumanMessage(content=critique)]}

def should_continue(state: DebateState) -> str:
    return "end" if state["iterations"] >= 3 else "critic"</code></pre>
<p><strong>When to use:</strong> High-quality requirements, tasks where a single agent self-critique is unreliable, adversarial review of legal/financial outputs.</p>

<h2>34.5 Handoff Protocols</h2>
<table>
  <tr><th>Pattern</th><th>How</th><th>Best for</th></tr>
  <tr><td>Message passing</td><td>Agents append to shared message list</td><td>Conversational multi-agent flows</td></tr>
  <tr><td>Structured state fields</td><td>Agents read/write typed fields</td><td>Pipeline-style with typed outputs</td></tr>
</table>
<pre><code class="language-python"># Message passing — append with agent name tag
def research_agent(state) -> dict:
    result = do_research(state["messages"][-1].content)
    return {"messages": [AIMessage(content=result, name="research_agent")]}

# Structured state — typed fields per stage
class PipelineState(TypedDict):
    query: str
    research_results: list[dict]   # written by research agent
    analysis: str                   # written by analyst agent
    final_answer: str               # written by writer agent</code></pre>

<h2>34.6 Production Considerations</h2>
<table>
  <tr><th>Concern</th><th>Mitigation</th></tr>
  <tr><td>Cost explosion (N agents × M calls)</td><td>Per-run cost tracking; budget caps in supervisor</td></tr>
  <tr><td>Latency chains (sequential compounding)</td><td>Parallelise independent agents via LangGraph branches</td></tr>
  <tr><td>Failure attribution</td><td>@traceable per agent + structured logging</td></tr>
  <tr><td>Circular dependencies</td><td>max_iterations + explicit done flag</td></tr>
  <tr><td>Context bloat</td><td>Summarise intermediate results; don't pass full history</td></tr>
</table>
<pre><code class="language-python"># Parallel execution in LangGraph
graph.add_edge("agent_1", "agent_2")
graph.add_edge("agent_1", "agent_3")  # runs concurrently with agent_2
graph.add_edge("agent_2", "agent_4")
graph.add_edge("agent_3", "agent_4")  # waits for both 2 and 3

# Per-agent tracing
from langsmith import traceable
@traceable(name="research_agent", metadata={"agent_type": "specialist"})
def research_agent(query: str) -> dict: ...</code></pre>
<div class="callout callout-info"><strong>Per-run budget tracking</strong>
<pre><code class="language-python">class SupervisorState(TypedDict):
    messages: Annotated[list, add_messages]
    next: str
    budget_used: float    # running cost in USD
    max_budget: float     # hard cap, default 0.10

def track_cost(state: SupervisorState, tokens_used: int, model: str) -&gt; SupervisorState:
    cost_per_token = {"claude-haiku": 0.0008e-3, "gpt-4o": 0.005e-3}
    new_cost = state["budget_used"] + tokens_used * cost_per_token.get(model, 0.005e-3)
    if new_cost &gt; state["max_budget"]:
        raise BudgetExceededError(f"Budget {state['max_budget']} exceeded at \${new_cost:.4f}")
    return {**state, "budget_used": new_cost}

# Call at the end of every agent node before returning state</code></pre>
LangSmith traces compiled subgraphs as expandable nested traces — you see "research_team" in the
outer trace, click to expand and see each specialist agent's individual spans with their own
token counts. Use <code>metadata={"agent_name": "research_agent"}</code> in each <code>@traceable</code> call to
make per-agent cost attribution work correctly in LangSmith dashboards.
</div>

<div class="callout callout-info"><strong>Apple PCC — what interviewers actually mean by "private AI"</strong>
Private Cloud Compute (PCC) is Apple's server-side AI infrastructure where inference code is
cryptographically attested — the hardware verifies that only Apple-signed software is running
before any user data enters the enclave. Unlike traditional cloud, no Apple employee can access
user requests; third-party auditors can verify the attestation logs. This makes PCC fundamentally
different from "encrypted in transit" — it is designed so even a compromised Apple employee
cannot exfiltrate inference data. Interview cue: when asked about privacy-preserving AI at
Apple, PCC is the answer for server-side; Core ML on-device is the answer for local inference.
<br><br>
<strong>Netflix AI profile correction:</strong> Netflix's core recommendation uses <em>two-tower neural models</em>
for retrieval (fast embedding similarity in FAISS) followed by gradient-boosted ranking models
(GBM/LightGBM) for the final sort. LLMs are used for content metadata enrichment and Q&amp;A —
not for personalised ranking. Interview trick: interviewers at Netflix will penalise you for
saying "I'd use GPT-4 for recommendations" — the correct answer is two-tower retrieval + learned
ranker + A/B controlled rollout.
<br><br>
<strong>Meta's Tupperware:</strong> Tupperware is Meta's internal cluster management system (analogous to
Kubernetes) — interviewers do NOT expect you to know Tupperware. Say "cluster manager" or
"container orchestration" if it comes up; the underlying concept maps to K8s.
</div>

<h2>36.1 From Perceptron to Transformer</h2>
<pre><code class="language-text">Perceptron (1957): output = σ(w₁x₁ + w₂x₂ + ... + b)
  σ = activation function (sigmoid → ReLU → GELU in modern LLMs)
  Limitation: single layer can't learn complex patterns

Feedforward Neural Network: stack layers
  Limitation: no sense of word order, can't handle variable-length sequences

RNN/LSTM (1997–2015): process tokens sequentially
  Limitation: vanishing gradient, inherently sequential (slow, no parallelism)
  Why vanishing gradient: hidden state is multiplied by weight matrix at every step.
  If max eigenvalue &lt; 1, errors shrink exponentially across steps (×0.9 × 0.9 × 0.9 …).
  By step 50, gradient ≈ 0 — early tokens stop influencing training.
  Fix: residual connections (skip connections add gradient path of 1.0, bypassing multiplication).

Transformer (Vaswani 2017 "Attention Is All You Need"):
  Every token attends to every other token simultaneously
  Fully parallelisable → GPU-friendly → scales to 405B parameters</code></pre>

<h2>36.2 Tokenisation</h2>
<pre><code class="language-python"># OpenAI tokenizer (tiktoken)

[enc.decode([t]) for t in tokens]
# ["Housing", ".com", " property", " search"]
# Note: " search" has a leading space — that's a real token boundary.
# "Housing.com" splits into 2 tokens because ".com" is common enough to be its own token.
# Rule of thumb: 1 token ≈ 0.75 words (English)

<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── BPE Tokenization Pipeline ────────────────────────────────────────────────

Raw text: "Housing.com property search in Bandra"
     │
     ▼
[BPE Tokenizer] — look up learned merge rules (100K vocab for GPT-4o)
     │
     ▼
Token IDs:  [39963,  916,    3241,    1718,   304,  87854  ]
     │
     ▼
Token str:  "Housing" ".com" " property" " search" " in" " Bandra"
     │              ↑
     │        note: space is part of the token " property" ≠ "property"
     ▼
Embedding lookup: each token ID → 4096-dimensional float vector
     │
     ▼
[Transformer layers process the sequence]

Billing impact:
  "Maharashtra" → ["Mah", "ar", "ashtra"] = 3 tokens (rare Indian proper noun)
  "the"         → ["the"]                  = 1 token  (common English word)
  Same 5 words in English vs Hindi may cost 2–4× different token counts.
  Rule: benchmark your domain's text with tiktoken before signing API contracts.</pre>
<p><strong>BPE (Byte-Pair Encoding):</strong> starts with byte-level vocab, iteratively merges most-frequent byte-pairs into new tokens until target vocab size (e.g. 100K for GPT-4o). Common words → 1 token. Rare domain terms → 3–6 tokens. Billing is per token, not per word. Different providers use different BPE vocabularies — never assume token counts are portable across models.</p>

<h2>36.3 Embeddings &amp; Positional Encoding</h2>
<pre><code class="language-text">token_id → lookup table → dense vector ∈ ℝ^d_model
  d_model: 768 (BERT), 4096 (Llama 3.1 8B), 8192 (GPT-4)

Embedding table size: vocab_size × d_model
  Llama 3.1 8B: 128K × 4096 = 500M params (7.5% of total model!)

RoPE (Rotary Position Embedding):
  Encodes relative positions directly into Q/K dot product
  Generalises to longer contexts than absolute positional encoding</code></pre>

<h2>36.4 The Transformer Block</h2>
<pre><code class="language-text">Input vectors
  ↓ LayerNorm
  ↓ Multi-Head Self-Attention   ← "reading" (which tokens matter?)
  ↓ + residual connection       ← prevents vanishing gradient
  ↓ LayerNorm
  ↓ Feed-Forward Network (MLP)  ← "memory" (factual knowledge in weights)
  ↓ + residual connection
Output vectors (enriched token representations)

Llama 3.1 8B = 32 of these blocks stacked
GPT-4 = ~96 blocks (exact count not disclosed)</code></pre>

<h2>36.5 Multi-Head Self-Attention (MHA)</h2>
<p>For each token: <em>"which other tokens in the sequence are relevant to me, and how much?"</em></p>
<p>The math notation below translates directly to PyTorch tensor operations. Before reading the code, two things to understand:</p>
<ul>
  <li><strong>PyTorch always adds a batch dimension <code>B</code>.</strong> A sequence of <code>T</code> tokens each of dimension <code>C</code> is stored as a tensor of shape <code>[B, T, C]</code> — batch first. This is why <code>x.shape</code> unpacks to <code>B, T, C</code>.</li>
  <li><strong>"Multi-head" means splitting the <code>C</code> dimension into <code>n_heads</code> independent sub-spaces.</strong> Each head runs attention on a slice of dimension <code>d_k = C / n_heads</code>, so different heads can learn to attend to syntax, semantics, coreference, etc. independently. The <code>.reshape(B, T, n_heads, d_k).transpose(1,2)</code> rearranges the tensor from <code>[B, T, C]</code> to <code>[B, n_heads, T, d_k]</code> — moving the head dimension to position 1 so the attention matrix computation treats each head separately.</li>
</ul>
<div class="callout callout-info">
  <strong>Causal masking — why <code>masked_fill(mask == 0, -1e9)</code>?</strong> During training, the transformer sees the full sequence at once (unlike an RNN which processes left to right). Without masking, token 5 could attend to tokens 6, 7, 8 — cheating by looking at the future. The causal mask sets all future-position attention scores to −1 billion before softmax. After softmax, e^(−10⁹) ≈ 0, so those positions get zero weight. Each token can only read tokens that came before it — making generation autoregressive. Without this mask, the model would learn to copy answers from future context and would fail completely at inference time.
</div>
<pre><code class="language-text">For token i:
  Query: Qᵢ = Wq × xᵢ   "what am I looking for?"
  Key:   Kⱼ = Wk × xⱼ   "what does token j advertise?"
  Value: Vⱼ = Wv × xⱼ   "what info does j contribute?"

  Attention score: aᵢⱼ = softmax(QᵢKⱼᵀ / √d_k)
  Output for i:   oᵢ = Σⱼ aᵢⱼ × Vⱼ</code></pre>
<pre><code class="language-python">class MultiHeadAttention(nn.Module):
    def __init__(self, d_model, n_heads):
        super().__init__()
        self.d_k = d_model // n_heads
        self.n_heads = n_heads
        self.Wq = nn.Linear(d_model, d_model)
        self.Wk = nn.Linear(d_model, d_model)
        self.Wv = nn.Linear(d_model, d_model)
        self.Wo = nn.Linear(d_model, d_model)

    def forward(self, x):
        B, T, C = x.shape
        Q = self.Wq(x).reshape(B, T, self.n_heads, self.d_k).transpose(1,2)
        K = self.Wk(x).reshape(B, T, self.n_heads, self.d_k).transpose(1,2)
        V = self.Wv(x).reshape(B, T, self.n_heads, self.d_k).transpose(1,2)
        scores = (Q @ K.transpose(-2,-1)) / math.sqrt(self.d_k)
        scores = scores.masked_fill(mask == 0, -1e9)  # causal mask
        out = F.softmax(scores, dim=-1) @ V
        return self.Wo(out.transpose(1,2).reshape(B, T, C))</code></pre>

<div class="callout callout-info"><strong>Attention worked example: how "bank" gets disambiguated</strong>
Sentence: "The bank near the river flooded."
<br>
Token "bank" has a Query vector that asks: "am I a financial institution or a river bank?"
<br>
The Key vectors of "river" and "flooded" respond strongly to the <em>river bank</em> meaning. The Key
vector of "money" or "deposit" (absent here) would respond to the financial meaning.
<br><br>
Score calculation for head 1:
<pre>attention_scores["bank"] × Keys:
  "The"   → 0.02  (low — function word)
  "bank"  → 0.08  (self — low)
  "near"  → 0.15  (proximity relation)
  "river" → 0.61  ← HIGH — "river" context shifts meaning
  "flood" → 0.14  (supports river meaning)
  → Value aggregation: pulls in "river" and "flood" representations</pre>
The output vector for "bank" is now enriched with the river-bank semantics, not the financial
meaning. This is attention: each token's final representation is a weighted blend of all other
tokens' value vectors, weighted by relevance.
</div>
<div class="callout callout-tip">
  <strong>Why multiple heads?</strong> Each head learns a different relationship type: Head 1 = syntactic (subject↔verb), Head 2 = coreference (pronoun↔noun), Head 3 = semantic similarity. Multi-head = multi-perspective reading simultaneously.
</div>
<p><strong>GQA (Grouped Query Attention):</strong> Used in Llama 3.1, Mistral, Gemma. Multiple query heads share a single KV head. Cuts KV cache size by 8×. Empirically, GQA loses less than 0.5% on benchmarks vs full MHA — because K and V represent "what tokens broadcast about themselves" and sharing across heads causes minimal information loss. The key enabler for 128K context windows without memory explosion.</p>

<h2>36.6 Feed-Forward Network &amp; What the FFN Stores</h2>
<p>After attention "reads the room" — gathering context from surrounding tokens — the FFN processes each token <strong>independently</strong>. No interaction between tokens here; it's a per-token transformation. Think of attention as asking "what context do I need?" and the FFN as "now look up the relevant fact given that context."</p>
<p>Empirically, the FFN weights are where <strong>factual associations are stored</strong>: the Paris→France connection, capital cities, chemical formulas. These were memorised during training. Attention decides which facts are relevant; the FFN retrieves them. This is why the FFN expand-then-contract shape matters — the 4× expansion creates a high-dimensional space in which facts can be encoded as superpositions without interfering with each other.</p>
<div class="callout callout-info">
  <strong>SwiGLU (used in Llama):</strong> The standard activation is GELU (smooth ReLU). Llama replaces it with SwiGLU — a gated variant that multiplies two linear projections together before activating. Empirically it improves language modelling quality and is now the standard in most open-source models. You don't need to understand its internals to use Llama; just know that it increases the FFN parameter count slightly (three projections instead of two), which is why Llama's FFN hidden dimension is 14,336 rather than the naive 4×4,096 = 16,384.
  <br><br>
  <strong>Parameter budget:</strong> A standard transformer with 32 layers, d_model=4096, has 32 × (3 × 4096² + 4 × 4096²) ≈ 7B parameters total. The FFN contributes ~4/7 of that — roughly 2/3 of all parameters live in FFN layers. This is why fine-tuning FFN weights (via LoRA targeting <code>gate_proj</code>, <code>up_proj</code>, <code>down_proj</code>) gives stronger task adaptation than fine-tuning attention alone.
</div>
<pre><code class="language-python">class FFN(nn.Module):
    def __init__(self, d_model):
        super().__init__()
        self.fc1 = nn.Linear(d_model, d_model * 4)  # expand
        self.fc2 = nn.Linear(d_model * 4, d_model)  # contract back

    def forward(self, x):
        return self.fc2(F.gelu(self.fc1(x)))
# Llama 3.1 8B: d_model=4096, hidden=14336, uses SwiGLU activation
# FFN holds ~2/3 of all model parameters — it's where factual knowledge lives</code></pre>

<h2>36.7 Full Forward Pass &amp; KV Cache</h2>
<pre><code class="language-text">1. Tokenise input → token IDs
2. Embed → dense vectors + add RoPE positional encoding
3. Pass through N transformer blocks (LayerNorm → Attention → FFN)
4. Final LayerNorm → Linear(d_model → vocab_size) → Softmax
5. Sample next token (temperature + top-p)
6. Append token → REPEAT from step 3 (autoregressive — same one process, looping)

IMPORTANT: This loop is ONE running process — NOT separate API calls.
  GPT-4 generating 500 words ≠ 500 HTTP requests.
  It is one connection: one forward pass per token, all streamed back.
  "Separate API call per token" is the most common misconception.

Concrete example — generating token 101:
  Context: 100 previously generated tokens (the prompt + first 100 generated)
  Forward pass: model reads ALL 100 tokens simultaneously via attention
  Output: logits vector over 128K vocab → softmax → sample "property"
  Token 101 = "property" is appended to context
  Next pass processes 101 tokens, outputs token 102
  This repeats until EOS token or max_tokens limit.

  Llama 3.1 8B timing on A100:
  - Prefill (first pass over prompt, N tokens): ~50ms for N=100
  - Decode (each additional token): ~10ms
  - 500 tokens generated: 50ms prefill + 500×10ms = ~5 seconds total

KV Cache:
  Without: recompute Keys and Values for ALL previous tokens each step → O(n²)
  With:    store K,V from previous tokens, compute only new token → O(n)
  Memory:  O(n_layers × n_kv_heads × d_head × seq_len × 2)
  128K context, Llama 3.1 8B → ~15GB just for KV cache</code></pre>
<div class="callout callout-info">
  <strong>KV Cache — the React.useMemo analogy</strong>
  Generating token 500 without a KV cache would require re-computing the Key and Value vectors for all 499 preceding tokens — reading the entire context window from scratch every step. That's O(n²) total work across n tokens.
  <br><br>
  KV cache is exactly like <code>React.useMemo</code> for the attention computation: once you've computed the Key and Value for a token, you cache them. On the next step, only the <em>new</em> token gets new K/V computed; everything before it is retrieved from cache. The attention score for the new token against all previous ones is then computed by reading K from cache — not recomputing it.
  <br><br>
  <strong>The cost:</strong> 128K context × 32 layers × 8 KV heads × 128 head dimension × 2 (K and V) × 2 bytes (FP16) = ~15GB of VRAM just to hold the KV cache for one request. This is why long context is expensive — not just the compute, but the memory. PagedAttention (Module 30.3) solves this by allocating KV cache in pages rather than pre-allocating the full context length upfront.
</div>

<h2>36.8 Context Window, Temperature &amp; Sampling</h2>
<table>
  <tr><th>Parameter</th><th>Effect</th><th>Recommended value</th></tr>
  <tr><td>temperature=0</td><td>Always pick top token (deterministic)</td><td>Classification, JSON, code</td></tr>
  <tr><td>temperature=0.7</td><td>Balanced creativity</td><td>General generation</td></tr>
  <tr><td>temperature=1.0</td><td>Sample proportionally to probs</td><td>Creative writing</td></tr>
  <tr><td>top_p=0.9</td><td>Cut off bottom 10% probability mass</td><td>Most use cases</td></tr>
  <tr><td>top_k=50</td><td>Only sample from top 50 tokens</td><td>When top_p alone too broad</td></tr>
</table>
<div class="callout callout-info"><strong>Context cost: compute vs API pricing are different things</strong>
<strong>Compute cost</strong> (what the GPU does): Attention is O(n²) in sequence length. A 128K context
query requires 128K × 128K = 16 billion attention score computations — ~256× more GPU work than
an 8K context query. This is the fundamental compute bottleneck.
<br><br>
<strong>API pricing</strong> (what Anthropic charges): Anthropic charges per input token <em>linearly</em> —
not quadratically. The quadratic cost is absorbed by Anthropic's infrastructure and amortised
across many users via batching. When you see "$3.00/1M input tokens", that's linear billing
regardless of context length within the supported window.
<br><br>
<strong>Why it still matters for you:</strong> even at linear billing, long contexts are expensive at scale.
At 128K context vs 8K context: you pay 16× more per call. Always profile average context lengths
and trim what's not needed.
</div>

<table>

<p><strong>Why graphs beat flat text for relational queries:</strong> "Who are all execs connected to Housing.com?" → graph traversal. "Localities with 2BHK under 2Cr near metro?" → multi-hop: locality → price → amenity. Flat RAG retrieves matching chunks but can't traverse relationships between them.</p>

<h2>37.2 Building a Knowledge Graph with an LLM</h2>
<pre><code class="language-python">from langchain_experimental.graph_transformers import LLMGraphTransformer
from langchain_community.graphs import Neo4jGraph
from langchain_anthropic import ChatAnthropic

llm = ChatAnthropic(model="claude-haiku-4-5-20251001", temperature=0)
transformer = LLMGraphTransformer(llm=llm)

docs = [Document(page_content="""
    Housing.com is an Indian real estate portal. Anuj Puri is the chairman.
    The Mumbai office is in Bandra West, near the BKC business district.
""")]
graph_docs = transformer.convert_to_graph_documents(docs)
# → Node(id='Housing.com', type='Organisation')
# → Relationship(source=Housing.com, target=Anuj_Puri, type='EMPLOYS')

graph = Neo4jGraph(url="bolt://localhost:7687", username="neo4j", password="...")
graph.add_graph_documents(graph_docs)</code></pre>
<div class="callout callout-tip"><strong>Cypher primer — 4 patterns you need to know</strong>
<pre><code class="language-cypher">// 1. Match a node with a label and property
MATCH (n:Organisation {name: 'Housing.com'}) RETURN n

// 2. Directed edge: source -[rel:TYPE]-> target
MATCH (person)-[:WORKS_FOR]->(company) RETURN person.name, company.name

// 3. Variable-length path: [*1..2] means 1 or 2 hops
MATCH (h {id: 'Housing.com'})-[*1..2]->(connected)
RETURN connected.id, labels(connected)

// 4. Filter on properties mid-traversal
MATCH (p:Property)-[:LOCATED_IN]->(l:Locality {name: 'Bandra'})
WHERE p.price &lt; 20000000
RETURN p.title, p.price, l.name</code></pre>
You don't need to master Cypher for most AI engineering roles — but understanding pattern matching
(<code>()-[]->()</code>) is necessary to explain GraphRAG's local search to an interviewer.
</div>

MATCH (h:Organisation {id: 'Housing.com'})-[*1..2]->(connected)

MATCH (p:Property)-[:LOCATED_IN]->(l:Locality {name: 'Bandra'})
WHERE p.price &lt; 20000000
