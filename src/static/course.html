<h2>37.3 GraphRAG — Microsoft's Architecture</h2>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── GraphRAG Offline Indexing Pipeline (runs once, expensive) ────────────────

 Source Documents (PDFs, articles, contracts)
        │
        ▼ chunk into 600-token windows
 ┌─────────────────────┐
 │  Chunks  [d1c1]     │  [d1c2]  [d2c1] ...  (N total chunks)
 └──────────┬──────────┘
            │ LLM call per chunk → extract named entities + relations
            ▼  ≈ $0.01–$0.05 per chunk (GPT-4o), so 1000 chunks = $10–$50
 ┌───────────────────────────────────────────────────────────────────────────┐
 │  Knowledge Graph  (entity1) ──[relation]──► (entity2)                   │
 │  e.g., (Housing.com) ──[operates_in]──► (Mumbai)                        │
 │       (PropTiger)    ──[acquired_by]──► (REA Group)                      │
 └──────────────────────────────┬────────────────────────────────────────────┘
                                │ Leiden community detection
                                ▼
 ┌──── Level 0: 10 broad clusters ──────────────────────────────────────────┐
 │  [Proptech companies]  [Regulatory bodies]  [Mumbai localities] ...      │
 │  └── Level 1: 50 clusters                                                │
 │       └── Level 2: 150 clusters                                          │
 │            └── Level 3: 500 fine clusters                                │
 └──────────────────────────────┬────────────────────────────────────────────┘
                                │ LLM summarises each cluster at each level
                                ▼
 Community summaries stored → used for global search (map-reduce over summaries)
 Raw graph stored           → used for local search (entity → neighbourhood hop)</pre>
<p><strong>Indexing pipeline (offline, expensive, run once):</strong></p>
<pre><code class="language-text">Documents → chunk (600 tokens)
  → LLM extracts (entity, relation, entity) triples per chunk
  → Merge into global knowledge graph (deduplicate entities)
  → Leiden algorithm: hierarchical community detection
      Level 0 = 10 broad themes
      Level 3 = 500 fine-grained clusters
  → LLM writes community summary for each cluster at each level
  → Stored: graph + community summaries + source text</code></pre>
<p>Before running these commands, understand what each flag does:</p>
<ul>
  <li><strong><code>--root ./my_project</code></strong> — the project directory must contain a <code>graphrag.config.yaml</code> file (auto-generated by <code>graphrag init</code>) and an <code>input/</code> folder with your source documents. GraphRAG writes all output (entity parquet files, community reports, embeddings) back into this directory under <code>output/</code>.</li>
  <li><strong><code>--method global</code></strong> — runs a map-reduce over all community summaries (the high-level clusters). Good for thematic synthesis: "what are the main risk factors across all contracts?" The LLM reads each community summary in parallel, then a final LLM call reduces them into one answer.</li>
  <li><strong><code>--method local</code></strong> — extracts named entities from your query, finds them in the knowledge graph, then retrieves their immediate graph neighbourhood (connected entities + relationships). Good for specific factual questions: "what projects did J. Smith approve?" The answer lives in the graph edges, not in any single document chunk.</li>
</ul>
<pre><code class="language-bash">pip install graphrag
graphrag index --root ./my_project   # offline indexing

# Global search (thematic): distribute across community summaries → map-reduce
graphrag query --root ./my_project --method global \
  --query "What are the main risk factors across all documents?"

# Local search (specific): extract entities → retrieve graph neighbourhood
graphrag query --root ./my_project --method local \
  --query "What is the relationship between Housing.com and PropTiger?"</code></pre>
<table>
  <tr><th></th><th>Standard RAG</th><th>GraphRAG</th></tr>
  <tr><td>Multi-doc synthesis</td><td>Poor</td><td>Excellent</td></tr>
  <tr><td>Thematic / global queries</td><td>Fails</td><td>Strong (community summaries)</td></tr>
  <tr><td>Specific factual lookup</td><td>Good</td><td>Good (local search)</td></tr>
  <tr><td>Indexing cost</td><td>Low ($)</td><td>High ($$$, many LLM calls)</td></tr>
  <tr><td>Best for</td><td>FAQ, factual lookup</td><td>Complex corpora, exploratory Q&amp;A</td></tr>
</table>
<div class="callout callout-info"><strong>Leiden algorithm — intuition before the math</strong>
Imagine the knowledge graph as a social network. Community detection finds clusters of nodes that
are densely connected internally but sparsely connected externally — the "friend groups."
<br><br>
Leiden works like this: (1) start with each node as its own community; (2) greedily merge
communities that increase the modularity score (ratio of internal to external edges); (3) refine
the partition by considering moving individual nodes across community boundaries; (4) repeat
until no improvement. The result is a hierarchy of communities at multiple resolutions — Level 0
has 10 broad themes ("Property Finance", "Legal", "Market Trends"), Level 3 has 500 fine-grained
clusters ("Bandra rental prices 2024", "RERA compliance notices").
<br><br>
GraphRAG writes an LLM summary for each community at each level. A "global search" distributes
the query to every community summary, runs a map step on each, and reduces the answers — this
is why global search costs many LLM calls and is slow, but surfaces corpus-wide themes that no
single chunk retrieval could find.
</div>
<div class="callout callout-tip">
  <strong>Leiden vs Louvain:</strong> Both are community detection algorithms. Leiden fixes Louvain's "resolution limit" bug (tendency to merge small distinct communities). GraphRAG defaults to Leiden for more stable, hierarchical partitions.
</div>

<h2>37.4 PageIndex — Vectorless RAG</h2>
<div class="callout callout-warn"><strong>PageIndex is research-stage (as of 2025) — not production-ready</strong>
The <code>pageindex</code> Python library is not stable; the API changes between releases, and the library is
not available on PyPI as a stable package. The concept is sound and the approach is promising for
structured documents, but do NOT plan a production deployment on PageIndex as of 2025. The
alternative for structured documents is <code>MarkdownHeaderTextSplitter</code> (stable, in LangChain) which
gives similar structural benefits for Markdown/HTML docs without the research-stage risk.
</div>
<p>PageIndex replaces the entire embedding-and-vector-search pipeline with <strong>LLM reasoning over a hierarchical table of contents</strong>. Instead of "which chunk is closest in vector space to the query?", it asks "which section of this document would a human expert navigate to in order to find this answer?"</p>
<p>Think of how you'd use a 200-page annual report: you don't read every paragraph and compute semantic similarity — you open the table of contents, read section titles, decide "operating margin is in Financial Results → Q3 section", and jump straight there. PageIndex teaches the LLM to navigate the same way. The LLM reads summaries at each tree level and reasons about which branch to descend — each level costs one LLM call, so a 4-level document tree costs 4 LLM calls per query (expensive, but precise for structured documents).</p>
<p><strong>Why it matters for structured documents:</strong> Fixed-size chunking often splits a table across chunk boundaries, or groups unrelated paragraphs because they appear on the same page. PageIndex preserves document structure — sections stay together, tables stay whole.</p>
<p>PageIndex (VectifyAI, 2025) replaces cosine similarity with LLM reasoning over a hierarchical tree index built from document structure. No embeddings. No vector database.</p>
<pre><code class="language-text">Indexing:
  1. Parse document → detect table of contents / section structure
  2. Build tree: root → sections → subsections → paragraphs
  3. LLM writes summary for each node (stored in tree)

Retrieval:
  1. LLM sees root summaries: "Appendix G covers Q3 financial results"
  2. LLM reasons: "Operating margin is likely in Financial Results → navigate"
  3. LLM drills down level by level to exact pages
  4. Only those pages enter generation context</code></pre>
<pre><code class="language-python">from pageindex import PageIndex

pi = PageIndex("annual_report.pdf")
pi.build_index()  # no embeddings, no vector store

answer = pi.query("What was the operating margin in Q3?")
# LLM traverses tree: root → Financial Results → Q3 → exact table</code></pre>
<table>
  <tr><th></th><th>Traditional RAG</th><th>PageIndex</th></tr>
  <tr><td>Retrieval mechanism</td><td>Cosine similarity on embeddings</td><td>LLM tree traversal (reasoning)</td></tr>
  <tr><td>Chunking</td><td>Fixed-size windows</td><td>Natural document structure</td></tr>
  <tr><td>Infrastructure</td><td>Vector DB required</td><td>None</td></tr>
  <tr><td>Failure mode</td><td>Semantic drift, boundary issues</td><td>Extra LLM calls (cost + latency)</td></tr>
  <tr><td>Best for</td><td>Large unstructured corpora</td><td>Structured docs: reports, manuals</td></tr>
</table>

<h2>37.5 Hybrid RAG: Vector + BM25 + Graph</h2>
<pre><code class="language-python">from langchain.retrievers import EnsembleRetriever
from langchain_community.retrievers import BM25Retriever

# 1. Vector retrieval (semantic similarity)
vector_retriever = chroma.as_retriever(search_kwargs={"k": 5})

# 2. Keyword retrieval (exact match, BM25)
bm25 = BM25Retriever.from_documents(docs, k=5)

# 3. Ensemble: EnsembleRetriever uses Reciprocal Rank Fusion (RRF), not raw score blending
# RRF formula: score(doc) = sum(1 / (rank_i + k)) across retrievers
# This is correct — raw scores from BM25 and cosine similarity are NOT comparable
ensemble = EnsembleRetriever(
    retrievers=[vector_retriever, bm25],
    weights=[0.6, 0.4]  # relative weight for rank fusion, not score multiplication
)

# 4. Optionally add graph retrieval for entity-centric queries
def graph_retriever(query: str) -> list[Document]:
    entities = extract_entities_llm(query)
    results = graph.query(
        "MATCH (e)-[r]-(n) WHERE e.id IN $ids RETURN e, r, n",
        params={"ids": entities}
    )
    return [Document(page_content=format_result(r)) for r in results]</code></pre>
<table>
  <tr><th>Query signal</th><th>Use BM25</th><th>Use Vector</th><th>Use Graph</th></tr>
  <tr><td>Exact product names / codes</td><td>✓</td><td>—</td><td>—</td></tr>
  <tr><td>"Properties similar to this listing"</td><td>—</td><td>✓</td><td>—</td></tr>
  <tr><td>"Who else works with X?" / relationships</td><td>—</td><td>—</td><td>✓</td></tr>
  <tr><td>General semantic questions</td><td>—</td><td>✓</td><td>—</td></tr>
  <tr><td>Broad thematic synthesis</td><td>—</td><td>—</td><td>✓ (GraphRAG global)</td></tr>
</table>

<div class="callout callout-maang">
  <strong>🎯 MAANG Interview Connection</strong>

<h2>38.1 Query Transformation</h2>
<div class="callout callout-info"><strong>HyDE — why it closes the vocabulary gap</strong>
Direct embedding problem: Query "What is the rental yield in Bandra?" lives in question space.
Documents about rental yields are written as answers: "The gross rental yield in Bandra West
averages 3.2% as of Q2 2024." These two vectors may not be close in embedding space because
one is a question, one is a fact-statement.
<br><br>
HyDE approach: generate a hypothetical answer: "Rental yields in Bandra typically range from
2.8%–3.5% depending on property type and floor..." → embed this. The hypothetical is in answer
space — same vocabulary and sentence structure as real documents → much closer cosine similarity.
<br><br>
Tradeoff: one extra LLM call per query (latency + cost). Worth it when your query vocabulary
differs significantly from your document vocabulary — e.g., users ask in colloquial Hindi/English,
documents are written in formal real estate language.
</div>
<p><strong>HyDE — Hypothetical Document Embedding:</strong> generate a hypothetical answer, embed that instead of the bare query. The hypothesis uses domain vocabulary → better vector match.</p>
<pre><code class="language-python">hyde_prompt = """Write a short, direct answer to this question as if you were an expert.
It will be used to find similar documents, not shown to the user.
Question: {question}"""

# Embed the hypothetical answer — not the original query
hyde_embedder = HypotheticalDocumentEmbedder.from_llm(
    llm=llm, base_embeddings=OpenAIEmbeddings(), custom_prompt=hyde_prompt
)
retriever = Chroma(embedding_function=hyde_embedder).as_retriever()</code></pre>
<p><strong>Multi-Query Retriever:</strong> generate 3–5 query reformulations, retrieve for each, union results for higher recall.</p>
<pre><code class="language-python">retriever = MultiQueryRetriever.from_llm(retriever=base_retriever, llm=llm)
# "2BHK in Bandra under 2Cr" generates:
# → "2 bedroom apartment Bandra price less than 2 crore"
# → "flat for sale Bandra west 2 bedroom budget 2Cr"</code></pre>
<p><strong>Self-Query Retrieval:</strong> parses natural language into semantic query + metadata filters simultaneously.</p>
<pre><code class="language-python">retriever = SelfQueryRetriever.from_llm(llm, vectorstore, "Property listings", metadata_field_info)
# "3BHK in Mumbai under 2Cr" →
#   semantic_query: "3 bedroom apartment"
#   filter: city=="Mumbai" AND bedrooms==3 AND price&lt;=20000000</code></pre>

<h2>38.2 Corrective RAG (CRAG)</h2>
<p>Standard RAG has a silent failure mode: the vector search returns documents that look semantically similar but are actually irrelevant to the specific question. The model then confidently answers based on bad context. <strong>CRAG (Corrective RAG)</strong> adds a grading step — an LLM evaluates each retrieved document and decides if it genuinely answers the query. If none pass, CRAG falls back to live web search instead of hallucinating from poor context.</p>
<p>Think of it like a <code>filter()</code> call with an AI-powered predicate: <code>docs.filter(doc => llm.grade(doc, query) === "relevant")</code>, plus a fallback data source when the filter returns an empty array. The grading calls use a cheap model (Haiku) because it's a binary yes/no decision — no reasoning depth needed.</p>
<pre><code class="language-python">def corrective_retriever(query: str) -> list[Document]:
    docs = vectorstore.similarity_search_with_score(query, k=3)
    relevant_docs = []
    for doc, score in docs:
        # Use Haiku not Sonnet — binary yes/no question doesn't need reasoning capability
        # Haiku: $0.00025/call vs Sonnet: $0.003/call = ~20x cheaper per grading call
        grading = haiku_llm.invoke(
            f"Is this relevant to '{query}'? Answer yes/no.\n{doc.page_content}"
        ).content.lower()
        if grading.startswith("yes"):
            relevant_docs.append(doc)
    if not relevant_docs:
        return web_search_retriever(query)  # fallback to live search
    return relevant_docs</code></pre>

<h2>38.3 Adaptive RAG</h2>
<p>Not every query needs the same retrieval strategy. "What is the EMI on a ₹1Cr loan?" needs arithmetic — retrieving property listings is wasteful. "What's the current market trend in Bandra?" needs live web search — your local vector store has stale data. "List 3BHK apartments under ₹2Cr in Powai" needs your property database.</p>
<p><strong>Adaptive RAG</strong> adds a classification step before retrieval — it acts as a router, dispatching each query to the right data source. This is the same pattern as an API gateway or an Express router: classify the request type, then dispatch to the appropriate handler. The classification call is cheap (one short prompt to a fast model); the savings from routing calculation queries away from the vector store more than offset it.</p>
<pre><code class="language-python">def route_query(query: str) -> str:
    return llm.invoke(
        f"""Classify as one word:
        - "local": answer from property database
        - "general": requires general real estate knowledge
        - "calculation": needs arithmetic (EMI, ROI)
        Query: {query}"""
    ).content.strip()

def adaptive_rag(query: str) -> str:
    route = route_query(query)
    context = {
        "local":       lambda q: vectorstore.similarity_search(q),
        "general":     lambda q: web_search(q),
        "calculation": lambda q: None,
    }[route](query)
    return generate_answer(query, context)</code></pre>

<h2>38.4 Self-RAG — Retrieve Only When Needed</h2>
<p>Standard RAG retrieves context for <em>every</em> query, regardless of whether it's needed. For "What is the standard stamp duty rate in Maharashtra?" — the LLM already knows this; retrieval adds 50–200ms and $0.001 of cost with no benefit. <strong>Self-RAG</strong> challenges the assumption that retrieval is always necessary.</p>
<p>The pattern is a pre-retrieval gate: before doing any search, ask the LLM "do you actually need external data to answer this?" — if no, generate directly. Think of it like a conditional <code>useEffect</code> in React: only fetch when the data you need isn't already available. Studies show 30–40% of chatbot queries are factual or computational and don't benefit from retrieval. Self-RAG eliminates that cost.</p>
<pre><code class="language-python">def self_rag(query: str) -> str:
    needs_retrieval = llm.invoke(
        f"Does answering '{query}' require looking up specific data? yes/no"
    ).content.lower().startswith("yes")

    if needs_retrieval:
        docs = vectorstore.similarity_search(query)
        return rag_chain.invoke({"question": query, "context": docs})
    return llm.invoke(query).content  # skip retrieval for factual/reasoning queries</code></pre>

<h2>38.5 Reranking</h2>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── Two-Stage Retrieval Pipeline ─────────────────────────────────────────────

User query: "3BHK sea view flat under ₹2Cr in Bandra West"
        │
        ▼ embed query (bi-encoder, ~5ms)
        │
STAGE 1: RETRIEVAL (Bi-encoder) — optimise recall
        │  query_vector = embed("3BHK sea view ...")
        │  ANN search over 100K property vectors
        │  → returns 20 candidate docs (fast: ~1ms)
        │
        │  Problem: bi-encoder misses "sea view" vs "garden view" distinction
        │  because vectors were encoded independently
        │
        ▼
 [20 candidates: some relevant, some not]
        │
STAGE 2: RERANKING (Cross-encoder) — optimise precision
        │  For each of 20 docs:
        │    score = cross_encoder(query + doc)  ← reads them TOGETHER
        │  Sort by score, keep top 3
        │  ~50-150ms (20 cross-encoder calls, each ~5ms)
        │
        ▼
 [TOP 3 highly relevant docs] → inject into LLM system prompt

Why not cross-encoder for stage 1?
  10,000 docs × 5ms = 50,000ms = 50 seconds — not viable online.
  20 docs × 5ms = 100ms — acceptable as reranking step.</pre>
<div class="callout callout-info"><strong>Bi-encoder vs cross-encoder — the speed/accuracy tradeoff</strong>
<table>
  <tr><th></th><th>Bi-encoder (embedding model)</th><th>Cross-encoder (reranker)</th></tr>
  <tr><td>Encoding</td><td>Query and document encoded SEPARATELY into vectors</td><td>Query + document encoded TOGETHER in one pass</td></tr>
  <tr><td>Comparison</td><td>Cosine similarity of independent vectors</td><td>Model scores the Q↔D pair directly</td></tr>
  <tr><td>Speed</td><td>Fast — doc vectors pre-computed offline</td><td>Slow — must run for every (query, doc) pair</td></tr>
  <tr><td>Latency at 10K docs</td><td>~1ms (vector lookup)</td><td>~2,000ms (10,000 model calls)</td></tr>
  <tr><td>Quality</td><td>Good — misses subtle Q↔D interactions</td><td>Better — "reads" query and doc together like a human</td></tr>
  <tr><td>Use case</td><td>First-stage retrieval (recall-optimised)</td><td>Second-stage reranking (precision-optimised)</td></tr>
</table>
<strong>Production pattern:</strong> Bi-encoder retrieves k=20 candidates fast → Cross-encoder reranks to top 3 accurate. Never run cross-encoder over all 10K docs — it is O(n) with high constant.
</div>
<pre><code class="language-python"># Cohere rerank (managed, best quality)
from cohere import Client
results = Client().rerank(
    model="rerank-english-v3.0", query=query,
    documents=[d.page_content for d in docs], top_n=3,
)
reranked = [docs[r.index] for r in results.results]

# FlashRank (self-hosted, free)
from flashrank import Ranker, RerankRequest
ranker = Ranker(model_name="ms-marco-MiniLM-L-12-v2")
results = ranker.rerank(RerankRequest(query=query,
    passages=[{"id": i, "text": d.page_content} for i, d in enumerate(docs)]))</code></pre>
<p><strong>Pattern:</strong> retrieve k=10 → rerank → take top 3 for generation. Vector cosine ≠ relevance to the specific question. Cross-encoder understands the Q↔D relationship accurately.</p>

<h2>38.6 Systematic RAG Diagnosis</h2>
<table>
  <tr><th>RAGAS metric low</th><th>Root cause</th><th>Fix</th></tr>
  <tr><td>context_precision</td><td>Irrelevant chunks retrieved</td><td>Shrink chunk_size, add metadata filters, use self-query</td></tr>
  <tr><td>context_recall</td><td>Relevant chunks missed</td><td>Increase k, use hybrid BM25+vector, multi-query</td></tr>
  <tr><td>faithfulness</td><td>Model hallucinating beyond context</td><td>Lower temperature to 0, add "only from context below" instruction, require citations</td></tr>
  <tr><td>answer_relevance</td><td>Answer is off-topic</td><td>Check query passing, add rewriting step</td></tr>
  <tr><td>All scores low</td><td>Dataset / indexing problem</td><td>Review chunk quality, embedding model, document loading</td></tr>
</table>

  const m = modById(39);
  return moduleShell(m, `
<div class="learning-obj">
  <div class="learning-obj-title">After this module you will be able to</div>
  <ol>
    <li>Design state schemas that avoid the add_messages gotcha</li>
    <li>Write nodes as pure functions returning partial state updates</li>
    <li>Build conditional edges with typed routing functions</li>
    <li>Create tools with <code>@tool</code> and bind them to an LLM</li>
    <li>Add multi-turn memory via SqliteSaver checkpoints keyed on thread_id</li>
    <li>Implement HITL interrupts for human approval before irreversible actions</li>
    <li>Stream individual LLM tokens and tool events from a running graph</li>
  </ol>
  <div class="obj-meta">
    <span class="obj-time">⏱ ~90 minutes</span>
    <span class="obj-diff">Difficulty: ★★★★☆</span>
    <span class="obj-diff">Prerequisites: Module 24 (LangGraph overview)</span>
  </div>
</div>

<h2>39.1 State Design</h2>
<p>Before writing a single node, you design the <strong>shared state schema</strong> — a TypedDict that every node in the graph reads from and writes to. Think of it as a Redux store: every node gets the full store, reads what it needs, and returns a partial update with only the fields it changed. LangGraph then merges that partial update back into the full state.</p>
<p>The single most important decision in state design: <strong>for any list that accumulates over time, annotate it with <code>Annotated[list, add_messages]</code></strong>. Without this annotation, returning <code>{"messages": [new_msg]}</code> from a node replaces the entire list — wiping all conversation history — instead of appending. The <code>Annotated</code> syntax tells LangGraph which <em>reducer function</em> to use when merging the returned value. <code>add_messages</code> is LangGraph's built-in reducer that appends new messages and deduplicates by ID.</p>
<pre><code class="language-python">from typing import TypedDict, Annotated
from langgraph.graph.message import add_messages

# Conversational agent — add_messages APPENDS (never replaces)
class ChatState(TypedDict):
    messages: Annotated[list, add_messages]

# Pipeline — typed fields per stage
class PipelineState(TypedDict):
    query: str
    retrieved_docs: list[dict]
    generated_answer: str
    error: str | None

# GOTCHA: without add_messages
state["messages"] = [new_msg]   # REPLACES history — loses all prior turns
# WITH add_messages:
return {"messages": [new_msg]}  # APPENDS — correct</code></pre>
<div class="callout callout-warn"><strong>LangGraph state merge: last-write-wins for all non-annotated fields</strong>
For fields WITHOUT a reducer annotation, returning a value from a node REPLACES the field — not
merges. This is last-write-wins (shallow dict merge). Returning
<code>{"retrieved_docs": [new_doc]}</code> from a node <em>replaces</em> the entire list, not appends.
<br><br>
<strong>Rules:</strong> Use <code>Annotated[list, add_messages]</code> for message history (append). Use plain
<code>list[dict]</code> for pipeline stages where each stage produces a complete new output (replace).
Use <code>Annotated[list, operator.add]</code> to accumulate results across multiple parallel nodes.
Never mutate <code>state</code> directly inside a node — always return a new dict.
</div>

<h2>39.2 Nodes</h2>
<p>A node is any Python function that takes the current state and returns a <strong>partial dict</strong> of only the fields it changed. LangGraph merges your return value into the full state — you never return the full state object. This is exactly like a Redux reducer that returns <code>{ ...state, updatedField: newValue }</code>, except you only return the changed fields, not the whole store.</p>
<p><strong>Nodes must be pure with respect to state:</strong> read from <code>state</code>, return a new dict, never mutate <code>state</code> directly. Side effects (API calls, DB writes) are fine inside a node — just don't modify the state argument in place.</p>
<p>Two message types you'll see below that need explanation:</p>
<ul>
  <li><strong><code>ToolMessage(content=..., tool_call_id=...)</code></strong> — a LangChain message type specifically for tool execution results. The <code>tool_call_id</code> must match the <code>id</code> field from the preceding <code>AIMessage</code>'s <code>tool_calls</code> list. This pairing is how the LLM knows which tool call produced which result. Getting this ID wrong causes the LLM to hallucinate or ignore tool results.</li>
  <li><strong>Async nodes</strong> — use <code>async def</code> when the node does I/O (HTTP calls, DB queries). LangGraph supports both sync and async nodes in the same graph; async nodes let multiple I/O calls run concurrently via <code>asyncio.gather</code> — the same speedup as <code>Promise.all()</code>.</li>
</ul>
<pre><code class="language-python">def intent_node(state: AgentState) -> dict:
    intent = classify_intent(state["messages"][-1].content)
    return {"intent": intent}  # return only fields you changed

def llm_node(state: AgentState) -> dict:
    response = llm_with_tools.invoke([
        SystemMessage(content="You are a housing assistant."),
        *state["messages"],
    ])
    return {"messages": [response]}

def tool_executor_node(state: AgentState) -> dict:
    call = state["messages"][-1].tool_calls[0]
    result = execute_tool(call["name"], call["args"])
    return {"messages": [ToolMessage(content=str(result), tool_call_id=call["id"])]}

# Async node (for I/O-bound operations)
async def async_search_node(state: AgentState) -> dict:
    results = await asyncio.gather(*[search(q) for q in state["queries"]])
    return {"retrieved_docs": list(results)}</code></pre>

<h2>39.3 Edges &amp; Conditional Routing</h2>
<pre><code class="language-python">from langgraph.graph import StateGraph, START, END
from typing import Literal

graph = StateGraph(AgentState)
graph.add_node("intent", intent_node)
graph.add_node("llm",    llm_node)
graph.add_node("tools",  tool_executor_node)

graph.add_edge(START,   "intent")   # entry
graph.add_edge("intent","llm")      # always
graph.add_edge("tools", "llm")      # loop back after tool exec

def route_after_llm(state: AgentState) -> Literal["tools", "__end__"]:
    last = state["messages"][-1]
    if hasattr(last, "tool_calls") and last.tool_calls:
        return "tools"
    return "__end__"

graph.add_conditional_edges("llm", route_after_llm, {"tools": "tools", "__end__": END})</code></pre>

<h2>39.4 The @tool Decorator</h2>
<pre><code class="language-python">from langchain_core.tools import tool
from pydantic import BaseModel, Field

@tool
def search_properties(query: str, max_results: int = 5) -> list[dict]:
    """Search property listings by natural language query.
    Args:
        query: Natural language description of desired property
        max_results: Maximum number of results to return
    """
    return property_db.search(query, limit=max_results)

# Typed schema (preferred for complex inputs)
class FilterInput(BaseModel):
    city: str      = Field(description="City name, e.g. 'Mumbai'")
    bedrooms: int  = Field(ge=1, le=10)
    max_price: int = Field(description="Price in INR")

@tool(args_schema=FilterInput)
def filter_properties(city: str, bedrooms: int, max_price: int) -> list[dict]:
    """Filter property listings by specific criteria."""
    return property_db.filter(city=city, bedrooms=bedrooms, max_price=max_price)

# Bind tools to LLM — LLM's JSON schema is auto-generated from type hints
llm_with_tools = llm.bind_tools([search_properties, filter_properties])</code></pre>
<div class="callout callout-info"><strong>What @tool actually does at runtime</strong>
<code>@tool</code> is a LangChain decorator that wraps the function into a <code>StructuredTool</code> object. After
decoration, <code>search_properties</code> is no longer just a function — it is an object with:
<ul>
  <li><code>search_properties.name</code> = "search_properties" (auto from function name)</li>
  <li><code>search_properties.description</code> = the docstring (this is what the LLM reads!)</li>
  <li><code>search_properties.args_schema</code> = Pydantic model auto-generated from type hints</li>
  <li><code>search_properties.invoke({"query": "...", "max_results": 5})</code> = calls the original function</li>
</ul>
When you call <code>llm.bind_tools([search_properties])</code>, LangChain sends the JSON schema of
<code>args_schema</code> to the LLM in the system prompt. The LLM generates a tool call JSON that matches
that schema. <code>ToolNode</code> receives the JSON, validates it against <code>args_schema</code>, and calls
<code>search_properties.invoke()</code> with the validated args. If validation fails (wrong type, missing
required arg), <code>ToolNode</code> returns a <code>ToolMessage</code> with the validation error — the LLM retries.
</div>

<h2>39.5 ToolNode — Prebuilt Tool Dispatch</h2>
<p>After building your tools with <code>@tool</code>, you need something to <em>actually call</em> them when the LLM decides to. That's <code>ToolNode</code> — a prebuilt LangGraph node that handles the dispatch automatically.</p>
<p>Here's what it does behind the scenes: it reads <code>state["messages"][-1].tool_calls</code> (the list of tool calls the LLM returned), looks up each tool by name in the registered list, calls it with the provided arguments (validating against the Pydantic schema if you set one), and returns a <code>ToolMessage</code> for each result — with the correct <code>tool_call_id</code> so the LLM can match each result to its request.</p>
<p><strong><code>tools_condition</code></strong> is the routing function that pairs with it. It checks whether the last message has any <code>tool_calls</code>. If yes, it returns <code>"tools"</code> (route to ToolNode). If no, it returns <code>END</code> (the LLM is done). You pass it to <code>add_conditional_edges</code> and it handles all the branching logic — no custom routing function needed for the standard agentic loop.</p>
<pre><code class="language-python">from langgraph.prebuilt import ToolNode, tools_condition

tools     = [search_properties, filter_properties, calculate_emi]
tool_node = ToolNode(tools)  # auto-dispatches based on tool_calls in last message

graph.add_conditional_edges("llm", tools_condition)  # routes to "tools" or END
graph.add_edge("tools", "llm")                        # loop back</code></pre>

<h2>39.6 Checkpointing — Persistent Memory</h2>
<pre><code class="language-python">from langgraph.checkpoint.memory import MemorySaver
from langgraph.checkpoint.sqlite import SqliteSaver

# Dev: in-memory
app = graph.compile(checkpointer=MemorySaver())

# Production (small scale): SQLite — fine for single-process, up to ~50 concurrent users
with SqliteSaver.from_conn_string("./checkpoints.db") as checkpointer:
    app = graph.compile(checkpointer=checkpointer)
# Production (multi-process / multi-instance): PostgresSaver — use connection pooling
# from langgraph.checkpoint.postgres import PostgresSaver
# Multiple FastAPI instances each need their own checkpointer connection

config = {"configurable": {"thread_id": "user_123_session_456"}}
# Turn 1
app.invoke({"messages": [HumanMessage("What's the price in Bandra?")]}, config)
# Turn 2 — checkpoint auto-loaded, context preserved
app.invoke({"messages": [HumanMessage("And in Powai?")]}, config)</code></pre>

<h2>39.7 Human-in-the-Loop Interrupts</h2>
<p>Sometimes an agent must pause and wait for human approval before taking a high-stakes action — booking a purchase, sending an email, deleting records. <code>interrupt_before=["tools"]</code> is LangGraph's built-in mechanism for this.</p>
<p><strong>What physically happens when a graph is interrupted:</strong> LangGraph saves the complete graph state to the checkpointer, then returns from <code>app.invoke()</code> as if the graph completed — but the graph is actually frozen mid-execution. Your API endpoint can respond to the HTTP request immediately: "Here's what the agent wants to do: [show tool_calls]. Approve?" The graph state is safely persisted. Only when you call <code>app.invoke(None, config)</code> with the same <code>thread_id</code> does execution resume from exactly the paused node — LangGraph loads the saved state and continues.</p>
<p>This is analogous to an <code>await userConfirmation()</code> in an async function — the coroutine suspends, the event loop is free to handle other requests, and execution resumes when the human responds. The difference: the "await" spans HTTP requests, not just event loop ticks. That's why a checkpointer (persisted to disk) is required — in-memory state would be lost between requests.</p>
<pre><code class="language-python">app = graph.compile(
    checkpointer=memory,
    interrupt_before=["tools"],  # pause BEFORE tool execution
)
config = {"configurable": {"thread_id": "hitl_flow_1"}}

# Run until interrupt — no tool has fired yet
state = app.invoke({"messages": [HumanMessage("Buy listing #456")]}, config)
print(state["messages"][-1].tool_calls)
# → [{"name": "execute_purchase", "args": {"listing_id": 456}}]

# Approve: resume with None
# invoke(None) means: no new input — load checkpoint state for this thread_id,
# pick up from the interruption point, and continue executing the graph.
# LangGraph loads the saved state, skips already-completed nodes, runs from where it paused.
result = app.invoke(None, config)

# Reject: inject a message and resume
from langgraph.types import Command
result = app.invoke(
    Command(update={"messages": [HumanMessage("Rejected: requires manager approval.")]}),
    config
)</code></pre>

<h2>39.8 Streaming</h2>
<pre><code class="language-python">async for event in app.astream_events(
    {"messages": [HumanMessage("Find 3BHK in Bandra")]},
    config=config, version="v2",
):
    if event["event"] == "on_chat_model_stream":
        print(event["data"]["chunk"].content, end="", flush=True)
    elif event["event"] == "on_tool_start":
        print(f"\n[Tool: {event['name']}]")
    elif event["event"] == "on_tool_end":
        print(f"[Result: {str(event['data']['output'])[:80]}...]")</code></pre>

  "Build a stateful multi-turn agent with tool use." → TypedDict state + add_messages reducer → nodes as pure partial-state functions → conditional edge on tool_calls presence → ToolNode dispatch → SqliteSaver keyed on thread_id for multi-user isolation → interrupt_before for high-risk operations.
</div>

<h2>40.1 What MCP Is</h2>
<p>MCP (Model Context Protocol) is the "USB-C for AI": a standard protocol so any LLM host (Claude Desktop, Claude Code, Cursor, VS Code) can connect to any tool server without custom integration code. Before MCP: 10 tools × 5 hosts = 50 custom integrations. With MCP: 10 servers × 5 hosts = 15 total (each writes one adapter).</p>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;overflow-x:auto">┌─────────────────────────────────────────────────────────────────────────────┐
│  MCP HOST  (Claude Code / Claude Desktop / Cursor / VS Code)               │
│  ┌──────────────────────┐   ┌──────────────────────┐                       │
│  │  MCP Client A        │   │  MCP Client B        │  (one per server)     │
│  │  (in-process)        │   │  (in-process)        │                       │
│  └──────────┬───────────┘   └──────────┬───────────┘                       │
└─────────────│─────────────────────────│─────────────────────────────────────┘
              │ stdio (subprocess)       │ HTTP+SSE (remote)
              ↓                          ↓
┌─────────────────────────┐  ┌──────────────────────────────────────┐
│  MCP Server A           │  │  MCP Server B                        │
│  (your FastMCP code)    │  │  (remote HTTP server)                │
│  ├── @mcp.tool()        │  │  ├── @mcp.tool()                    │
│  ├── @mcp.resource()    │  │  ├── @mcp.resource()                │
│  └── @mcp.prompt()      │  │  └── @mcp.prompt()                  │
└──────────┬──────────────┘  └───────────────┬──────────────────────┘
           ↓                                  ↓
    Local DB / FS                    Remote API / Cloud DB

Security model: stdio server inherits HOST OS permissions (trust boundary, not security boundary)
HTTP+SSE server runs in isolated container — preferred for production.</pre>
<table>
  <tr><th>Primitive</th><th>Analogy</th><th>Purpose</th><th>Who calls it?</th></tr>
  <tr><td><strong>Tools</strong></td><td>POST endpoint</td><td>Execute code, cause side effects</td><td>LLM during a conversation turn — the LLM decides when to invoke</td></tr>
  <tr><td><strong>Resources</strong></td><td>GET endpoint</td><td>Load data/context into LLM</td><td>Host application at session start — injects data before LLM runs</td></tr>
  <tr><td><strong>Prompts</strong></td><td>Prompt templates</td><td>Reusable LLM prompt patterns</td><td>User explicitly via slash commands or host UI</td></tr>
</table>
<div class="callout callout-info"><strong>Protocol lifecycle — initialize first, always</strong>
(1) Host always sends <code>initialize</code> first — server responds with its capabilities (which tools,
resources, prompts it supports and the protocol version). (2) Client and server agree on a
protocol version; if incompatible, the client closes. (3) Host then calls <code>tools/list</code> to
discover tools. (4) During conversation, host sends <code>tools/call</code> when the LLM requests a tool.
(5) For stdio, the connection lives as long as the subprocess — no reconnect. For HTTP+SSE, the
client must handle reconnects. <strong>Interview pattern:</strong> initialize → negotiate → list → call → list
again if server updates (tools can change at runtime in MCP v2025+).
</div>

<h2>40.2 Building an MCP Server with FastMCP</h2>
<pre><code class="language-python">from mcp.server.fastmcp import FastMCP

mcp = FastMCP("Housing Property Search")

@mcp.tool()
def search_listings(city: str, max_price: int, bedrooms: int = 2) -> list[dict]:
    """Search property listings by city, price, and bedroom count.
    Args:
        city: City name, e.g. 'Mumbai', 'Bangalore'
        max_price: Maximum price in INR
        bedrooms: Number of bedrooms required (default: 2)
    """
    return property_db.search(city=city, max_price=max_price, bedrooms=bedrooms)

@mcp.resource("listings://{city}/summary")
def city_summary(city: str) -> str:
    """Get a market summary for a city."""
    stats = property_db.get_city_stats(city)
    return f"{city}: {stats['count']} listings, avg ₹{stats['avg_price']:,}"

@mcp.prompt()
def property_advisor(city: str, budget: int) -> str:
    """Property advisor persona for a specific city and budget."""
    return f"""You are a Housing.com advisor for {city}.
    The user's budget is ₹{budget:,}. Focus on value-for-money.
    Always mention price per square foot when comparing properties."""

if __name__ == "__main__":
    mcp.run()               # stdio — default
    # mcp.run(transport="sse", port=8001)  # HTTP+SSE for cloud</code></pre>

<h2>40.3 Wire Protocol (JSON-RPC 2.0)</h2>
<p>MCP uses <strong>JSON-RPC 2.0</strong> as its wire format — a simple remote procedure call protocol where every request and response is a JSON object sent over a transport (stdio pipe or HTTP SSE stream).</p>
<p>If you've only used REST APIs, the key difference: REST has <em>many endpoints</em> (one URL per operation). JSON-RPC has <em>one endpoint</em> and the operation name goes inside the JSON body as a <code>"method"</code> field. Think of it like GraphQL or tRPC — one POST endpoint, operation specified in the request body. The <code>"id"</code> field is a correlation ID: the response will carry the same <code>"id"</code> so the client can match async responses to their requests — identical to how SSE event IDs work, or <code>X-Request-ID</code> headers.</p>
<p>The three-message handshake below is what happens when Claude Desktop connects to your MCP server:</p>
<ol>
  <li><strong><code>initialize</code></strong> — client announces its protocol version and capability flags. Server responds with its own capabilities.</li>
  <li><strong><code>tools/list</code></strong> — client asks "what tools do you expose?" Server responds with an array of tool schemas. This is when Claude learns what your server can do.</li>
  <li><strong><code>tools/call</code></strong> — client invokes a specific tool with arguments. You never write any of this JSON manually; FastMCP serialises/deserialises it automatically from your Python function signatures.</li>
</ol>
<pre><code class="language-json">{"jsonrpc":"2.0","id":1,"method":"initialize",
 "params":{"protocolVersion":"2025-11-25","capabilities":{"tools":{}}}}

{"jsonrpc":"2.0","id":2,"method":"tools/list"}
// → [{"name":"search_listings","inputSchema":{"type":"object","properties":{...}}}]

{"jsonrpc":"2.0","id":3,"method":"tools/call",
 "params":{"name":"search_listings","arguments":{"city":"Mumbai","max_price":20000000}}}</code></pre>
<p>FastMCP handles this entire protocol automatically. Your Python function signature is all the schema you need to write.</p>

<h2>40.5 Housing.com MCP Server</h2>
<pre><code class="language-python">from mcp.server.fastmcp import FastMCP
from sqlalchemy import text
from src.db.engine import get_engine

mcp = FastMCP("Housing.com Agent Tools")

@mcp.tool()
async def search_properties(city: str, bedrooms: int | None = None,
                             max_price: int | None = None, limit: int = 10) -> list[dict]:
    """Search Housing.com listings with optional filters."""
    async with get_engine().connect() as conn:
        q = "SELECT * FROM properties WHERE city = :city"
        p: dict = {"city": city}
        if bedrooms:   q += " AND bedrooms = :bedrooms";  p["bedrooms"] = bedrooms
        if max_price:  q += " AND price &lt;= :max_price";  p["max_price"] = max_price
        q += " ORDER BY price ASC LIMIT :limit"; p["limit"] = limit
        return [dict(r) for r in (await conn.execute(text(q), p)).mappings()]

@mcp.tool()
def calculate_emi(principal: int, annual_rate: float, years: int) -> dict:
    """Calculate monthly EMI, total payment, and total interest for a home loan."""
    r = annual_rate / 100 / 12
    n = years * 12
    emi = principal * r * (1 + r)**n / ((1 + r)**n - 1)
    return {"emi_monthly": round(emi), "total_payment": round(emi * n),
            "total_interest": round(emi * n - principal)}

@mcp.resource("market://{city}/stats")
async def market_stats(city: str) -> str:
    """Real-time market statistics for a city."""
    async with get_engine().connect() as conn:
        row = (await conn.execute(text(
            "SELECT COUNT(*) cnt, AVG(price) avg_price, MIN(price) min_price "
            "FROM properties WHERE city = :city"), {"city": city}
        )).mappings().first()
        return f"{city}: {row['cnt']} listings | Avg ₹{row['avg_price']:,.0f} | From ₹{row['min_price']:,}"

if __name__ == "__main__":
    mcp.run()</code></pre>

<h2>40.6 Security Considerations</h2>
<div class="callout callout-warn"><strong>stdio transport security model — runs with HOST permissions</strong>
stdio transport runs the MCP server as a subprocess of the host application (e.g. Claude Code).
The subprocess <em>inherits the host's OS permissions</em> — it can read files in your home directory,
access environment variables, and make network calls with your user credentials.
<br><br>
This is intentional: stdio servers are trusted tools you explicitly install and configure. But it
means: (1) never install MCP servers from untrusted sources — they run with your permissions;
(2) validate all inputs inside your server code — an LLM-controlled server could pass adversarial
args if the LLM is compromised (prompt injection); (3) for production server-to-server use,
prefer HTTP+SSE transport with explicit auth headers — stdio is a local dev primitive.
</div>
<table>
  <tr><th>Risk</th><th>Mitigation</th></tr>
  <tr><td>LLM sends malformed inputs</td><td>Validate all tool inputs; treat as user input (potential injection)</td></tr>
  <tr><td>Unbounded tool loops</td><td>Rate limit tool calls; add max_calls guard in host config</td></tr>
  <tr><td>Secrets in server code</td><td>Inject via <code>env</code> in mcp.json — never hardcode</td></tr>
  <tr><td>Over-exposed API surface</td><td>Only expose tools needed for the task — not the entire API</td></tr>
  <tr><td>Write side effects without approval</td><td>Claude Code prompts user before calling side-effect tools</td></tr>
  <tr><td>SQL injection via LLM-controlled args</td><td>Use SQLAlchemy <code>text()</code> with named bound parameters — parameterised at driver level, NOT string interpolation</td></tr>
</table>
<div class="callout callout-info"><strong>Is the Housing.com search_properties SQL safe from injection?</strong>
Yes. SQLAlchemy's <code>text("... WHERE city = :city")</code> with <code>{"city": city}</code> as the params dict is
safe — the driver substitutes the values as parameterised bindings at the database protocol level.
The value <code>"'; DROP TABLE properties;--"</code> passed as <code>city</code> would be treated as a literal string,
not executed as SQL. Contrast with <strong>UNSAFE</strong>: <code>f"WHERE city = '{city}'"</code> — this IS
vulnerable to SQL injection because it concatenates user input directly into the query string.
The rule: always use named parameters (<code>:city</code>) or positional parameters (<code>?</code>) — never f-strings.
</div>

<h2>41.1 Claude Code Skills System</h2>
<p><strong>Skills</strong> are Markdown files that act as reusable slash commands — you write the instructions once, and invoke them by name in any Claude Code session with <code>/skill-name</code>. The filename (without <code>.md</code>) becomes the slash command. Think of them like <code>.eslintrc</code> rules or Git hooks: checked into the repo, shared with the team, executed automatically on demand.</p>
<p><strong>CLAUDE.md</strong> is Claude Code's project-level memory — it is automatically prepended to every session's context window before you type anything. Claude reads it before every task, so it always knows your stack, conventions, and constraints. This solves the "re-explaining the project every session" problem. Because it's injected as the first part of the system prompt, it qualifies for prompt caching — you pay full price once, then ~10% on every subsequent call (see section 41.4).</p>
<p>The mechanism: Claude Code watches for <code>/name</code> typed in the prompt. If a file <code>.claude/skills/name.md</code> exists, Claude Code loads its contents and executes the instructions. No API calls needed to register them — the filesystem is the registry.</p>
<pre><code class="language-text">.claude/
  skills/
    code-review.md     → invoked as /code-review
    ai-review.md       → invoked as /ai-review
    deploy-check.md    → invoked as /deploy-check
CLAUDE.md              → injected into every session (project context)
settings.json          → hooks, permissions, allowed tools</code></pre>
<pre><code class="language-markdown">---
name: ai-review
description: Review staged changes for AI-specific issues
args:
  - name: focus
    description: "Optional: security | cost | quality"
    required: false
---

Review staged changes. Focus on:
1. Prompt strings that could enable prompt injection
2. LLM calls without max_tokens (unbounded cost risk)
3. Tool schemas missing type annotations (JSON parse failures)
4. Missing eval coverage for new RAG pipelines

Run: git diff --staged
Provide bulleted issues with severity (critical/medium/low) and fix.</code></pre>

<h2>41.2 Hooks — Automated Pre/Post Actions</h2>
<p>Hooks are shell commands that Claude Code runs automatically before or after specific tool calls — the same concept as <strong>git pre-commit hooks</strong> or <strong>Webpack plugin lifecycle hooks</strong>. You configure them once in <code>settings.json</code>, and they execute silently on every relevant action.</p>
<p>Two lifecycle points:</p>
<ul>
  <li><strong><code>PreToolUse</code></strong> — runs before Claude writes or edits a file. If the command exits with code 1, Claude Code <em>blocks</em> the tool call. This is your last line of defence: prevent secret leaks, enforce naming conventions, block writes to protected files.</li>
  <li><strong><code>PostToolUse</code></strong> — runs after the tool completes. Use for side effects: regenerate API docs, run a formatter, trigger a test on the changed file.</li>
</ul>
<p><strong><code>$CLAUDE_TOOL_INPUT_PATH</code></strong> is a Claude Code environment variable injected into every hook command. It points to a temporary JSON file containing the tool's input arguments — for a <code>Write</code> tool call this includes the file path and new content. Your hook script reads this file to inspect what Claude is about to write, without Claude Code having to pipe the content through shell arguments (which would be a command injection risk).</p>
<pre><code class="language-json">// settings.json
{
  "hooks": {
    "PreToolUse": [{
      "matcher": "Write|Edit",
      "hooks": [{
        "type": "command",
        "command": "grep -rE 'api_key|password|secret' $CLAUDE_TOOL_INPUT_PATH && echo 'BLOCK: secret' && exit 1 || exit 0"
      }]
    }],
    "PostToolUse": [{
      "matcher": "Write",
      "hooks": [{
        "type": "command",
        "command": "python scripts/update_api_docs.py $CLAUDE_TOOL_INPUT_PATH"
      }]
    }]
  }
}</code></pre>

<h2>41.3 GitHub Actions — AI-Powered PR Review</h2>
<pre><code class="language-yaml">name: Claude AI Code Review
on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ai-review:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - name: Install Claude Code
        run: npm install -g @anthropic-ai/claude-code

      - name: Run AI review
        env:
          ANTHROPIC_API_KEY: \${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # Write diff to file first — do NOT interpolate untrusted git content
          # directly into a shell string. Crafted commit messages can inject commands.
          git diff origin/main...HEAD > /tmp/pr_diff.txt
          python3 - <<'PYEOF'
          import anthropic, sys
          diff = open('/tmp/pr_diff.txt').read()[:12000]  # cap at ~3k tokens
          client = anthropic.Anthropic()
          response = client.messages.create(
              model="claude-haiku-4-5-20251001",
              max_tokens=1024,
              messages=[{"role": "user", "content":
                  f"Review this PR diff for correctness, security, missing tests, "
                  f"and AI-specific concerns. Format as GitHub markdown.\n\`\`\`diff\n{diff}\n\`\`\`"
              }]
          )
          open('review.md', 'w').write(response.content[0].text)
          PYEOF

      - name: Post comment
        uses: actions/github-script@v7
        with:
          script: |
            const body = require('fs').readFileSync('review.md','utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner, repo: context.repo.repo, body
            });</code></pre>

<h2>41.4 Prompt Caching</h2>
<p>Every request to Anthropic's API that includes a long static system prompt pays the full input token price — even if that prompt is identical to the one you sent 100ms ago. Prompt caching lets the API reuse the KV cache from a previous call: you pay full price once (the cache write), then ~10% of the normal input token price for every subsequent call that hits the cache.</p>
<p><strong>The one rule that makes it work: the cached content must come first.</strong> Anthropic's cache key is the <em>exact prefix</em> of your input. If you put dynamic content (user message, active filters, search results) before the static system prompt, every call has a different prefix — always a cache miss. Put your stable taxonomy, rules, and tool descriptions first; inject dynamic data after. The <code>cache_control: {"type": "ephemeral"}</code> marker tells the API where the cacheable prefix ends.</p>
<pre><code class="language-python">import anthropic
client = anthropic.Anthropic()

response = client.messages.create(
    model="claude-haiku-4-5-20251001",
    max_tokens=1024,
    system=[{
        "type": "text",
        "text": LONG_SYSTEM_PROMPT,   # 2000 tokens of taxonomy
        "cache_control": {"type": "ephemeral"},  # cache 5 minutes
    }],
    messages=[{"role": "user", "content": user_query}],
)
# Call 1: full prompt tokens charged
# Calls 2-N: cache_read_tokens (90% cheaper) for static system prompt</code></pre>
<div class="callout callout-info"><strong>Savings at scale + TTL behaviour</strong>
1M calls/day × 2K-token system prompt × $0.80/1M = $1,600/day without cache. With cache: $160/day.
Always cache static system prompts.
<br><br>
<strong>Cache TTL resets on every cache hit:</strong> Anthropic's ephemeral cache has a 5-minute TTL
that resets each time the cache is hit. Meaning: if you make calls every 2–3 minutes, the cache
stays warm indefinitely. If calls stop for &gt;5 minutes, the cache expires and the next call is a
full cache miss (charged at full input token rate). At low traffic (1 call/minute), you may pay
full price more often than expected. Solution: batch requests or use prompt caching only for high-
frequency endpoints.
<br><br>
<strong>CLAUDE.md and prompt caching:</strong> CLAUDE.md is injected by Claude Code as the first part of
the system prompt — it qualifies for prompt caching if you add <code>cache_control</code>. Keep CLAUDE.md
stable between sessions to maintain cache hits. Every line changed is a new cache miss.
</div>
<div class="callout callout-warn">
  <strong>What breaks the prompt cache?</strong>
  Anthropic caches the <em>prefix</em> of your system prompt. If <em>anything</em> in the cached block changes between calls, every request is a full cache miss — you pay 100% cost, not 10%.
<pre style="margin-top:8px"><code class="language-python"># WRONG: dynamic data injected into the cached block
system = [{
    "type": "text",
    "text": f"Today is {datetime.now().strftime('%Y-%m-%d')}. Taxonomy: {TAXONOMY}",
    "cache_control": {"type": "ephemeral"},   # date changes → cache always misses!
}]

# RIGHT: static content cached, dynamic content in the user message
system = [{
    "type": "text",
    "text": f"Taxonomy: {TAXONOMY}",           # never changes → 90% cache hit rate
    "cache_control": {"type": "ephemeral"},
}]
messages = [{
    "role": "user",
    "content": f"Today is {datetime.now().strftime('%Y-%m-%d')}. Query: {user_query}"
}]</code></pre>
  Rule: only stable, session-independent content goes in the cached block. Current date, user name, request ID — all go in the user message.
</div>

<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── API Request Structure ──────────────────────────────────────────────────────
system: [
  ┌─────────────────────────────────────────────────────────────────────────┐
  │  CACHED BLOCK (ephemeral)  ~2,000 tokens                               │
  │  Taxonomy, domain rules, tool schemas, Housing.com persona             │
  │  Cost: 10% of input token rate after first call                        │
  │  ✓ Stable across all requests (never changes turn-to-turn)             │
  └──────────────────────── cache_control: {type:"ephemeral"} ─────────────┘
]
messages: [
  ┌─────────────────────────────────────────────────────────────────────────┐
  │  DYNAMIC CONTENT  (always charged at full rate)                        │
  │  Today's date, session_id, active_filters, conversation history        │
  │  Retrieved property chunks (changes every request)                     │
  │  ✓ Changes every turn — never put this in the cached block             │
  └─────────────────────────────────────────────────────────────────────────┘
]

Call 1: cache_creation_input_tokens=2000 (100% rate) + uncached tokens
Call 2+: cache_read_input_tokens=2000 (10% rate) + uncached tokens
         ↑ 90% savings on system prompt every subsequent call</pre>

<h2>41.5 Context Window Management</h2>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── Context Memory Strategies ─────────────────────────────────────────────────
┌──────────────────────┐  ┌──────────────────────┐  ┌──────────────────────┐
│  TRIM (sliding       │  │  SUMMARISE (compress │  │  ENTITY MEMORY       │
│  window)             │  │  before trim)        │  │  (structured store)  │
│                      │  │                      │  │                      │
│  Keep last N turns   │  │  LLM summarises old  │  │  Extract key facts   │
│  Drop oldest first   │  │  context → 3 lines   │  │  to dict/DB outside  │
│                      │  │  Append as system    │  │  LLM context         │
│ + Simple, cheap      │  │  message             │  │                      │
│ - Loses early facts  │  │                      │  │ + Scales to 1000s    │
│ - Good for stateless │  │ + Preserves meaning  │  │   of turns           │
│   Q&A bots           │  │ - 1 extra LLM call   │  │ + Precise, explicit  │
│                      │  │ - Summary may lose   │  │ - Extra complexity   │
│                      │  │   exact values       │  │ - Need schema design │
└──────────────────────┘  └──────────────────────┘  └──────────────────────┘
Housing.com: trim is sufficient (each turn is mostly independent property search)
Agents needing long memory: use entity memory (budget, confirmed preferences, etc.)</pre>
<div class="callout callout-warn"><strong>trim_messages is for cost control — but trimmed turns are permanently gone</strong>
When you call <code>trim_messages</code> and drop old turns, those turns are gone from the LLM's context.
The LLM cannot see them, cannot reference them, and will behave as if the conversation started
from the oldest remaining turn. This is acceptable for stateless Q&amp;A but dangerous for agents
that rely on earlier decisions.
<br><br>
<strong>When trimming loses critical context:</strong> "Earlier you said the budget was ₹2Cr" — if that
message was trimmed, the LLM cannot verify or use it. Use the summarisation approach instead:
compress old turns into a system message summary before trimming. The summary preserves the key
facts; the trimming removes the verbose dialogue.
</div>
<pre><code class="language-python">def trim_messages(messages: list, max_tokens: int = 6000) -> list:
    if count_tokens(messages) &lt;= max_tokens:
        return messages
    system  = [m for m in messages if m["role"] == "system"]
    conv    = [m for m in messages if m["role"] != "system"]
    while count_tokens(system + conv) > max_tokens and len(conv) > 2:
        conv.pop(0)  # drop oldest turn
    return system + conv

def summarise_old_context(messages: list) -> list:
    if len(messages) &lt; 10:
        return messages
    old, recent = messages[:-4], messages[-4:]
    summary = llm.invoke(f"Summarise in 3 sentences: {old}").content
    return [{"role": "system", "content": f"Prior context: {summary}"}] + recent</code></pre>

<h2>42.1 Agent Team Patterns</h2>
<p>The modules so far used a single orchestrator routing to specialist sub-graphs. LangGraph also supports patterns where <strong>agents hand off to each other directly</strong>, run in parallel, or loop against each other. Three patterns cover most real-world needs.</p>

<h3>Swarm (emergent handoff)</h3>
<div class="callout callout-info">
  <strong>What is a Swarm?</strong> In a supervisor architecture (Module 34), a central agent decides who handles what. In a <strong>Swarm</strong>, there is no central decider — each agent decides for itself whether to handle the request or hand it to a better-suited agent. Control "emerges" from the agents' own routing decisions, not from a manager above them.
  <br><br>
  <strong>The FE analogy:</strong> Think of a JavaScript event bus where any handler can re-dispatch an event. Instead of a parent component deciding which child handles a click, any handler can call <code>dispatch({ type: 'ROUTE_TO_FINANCE' })</code> and a different handler picks it up. In LangGraph, this is done with the <code>Command</code> return type.
  <br><br>
  <strong>Key types you'll see in this code:</strong>
  <ul style="margin:6px 0 0 16px">
    <li><code>Command(goto="node_name", update={...})</code> — instead of returning a plain state dict, a node returns a <code>Command</code> that says both "update the state like this" AND "immediately route to this specific node next." Normal dict returns let LangGraph's edges decide routing; <code>Command</code> overrides that with an explicit destination.</li>
    <li><code>SwarmState</code> — a TypedDict you define (not a LangGraph built-in). It must include a <code>messages</code> field annotated with <code>Annotated[list, add_messages]</code> so messages accumulate rather than overwrite.</li>
    <li><code>AIMessage(...)</code> — a LangChain message type for assistant-generated content. Equivalent to <code>{ role: "assistant", content: "..." }</code> in the OpenAI messages array. You use it here so the message appends correctly into the <code>messages</code> list.</li>
  </ul>
</div>
<pre><code class="language-python">from langgraph.types import Command

def triage_agent(state: SwarmState) -> Command:
    intent = classify(state["messages"][-1].content)
    return Command(
        goto="search_agent" if intent == "property_search" else "finance_agent",
        update={"intent": intent}
    )

def search_agent(state: SwarmState) -> Command:
    results = search_properties(state["messages"][-1].content)
    if not results:
        return Command(goto="triage_agent",  # hand back if no results
                       update={"messages": [AIMessage("No results — retrying")]})
    return Command(goto=END, update={"messages": [AIMessage(str(results))]})</code></pre>
<div class="callout callout-warn">
  <strong>When does Swarm beat Supervisor?</strong> Use Swarm when agents genuinely need to loop back on each other (search hands back to triage on failure) or when the routing logic is deeply contextual and each specialist knows best who to call next. Use Supervisor when you need a clear audit trail of who decided what — the supervisor's routing is explicit and observable. Swarm routing is emergent and harder to debug.
</div>

<h3>Parallel fan-out + aggregation</h3>
<div class="callout callout-info">
  <strong>What is fan-out?</strong> Fan-out means running multiple agents simultaneously in parallel — the same concept as <code>Promise.all([p1, p2, p3])</code> in JavaScript. You add multiple edges from one node (the orchestrator) to several child nodes (the searchers). LangGraph's execution engine runs all children concurrently and <strong>waits for every one of them to complete</strong> before the aggregator runs — exactly like <code>Promise.all()</code> blocking until all promises resolve.
  <br><br>
  <strong>How <code>make_search_node(i)</code> works:</strong> This is a <strong>factory function</strong> — it takes an index <code>i</code> and returns a node function pre-configured to use query <code>i</code> from the state. The same pattern as a React hook factory: <code>const makeHandler = (id) => () => handleItem(id)</code>. Each returned function closes over its own <code>i</code>, so all four search nodes are independent.
</div>
<pre><code class="language-python"># Four search agents run concurrently
def orchestrator(state) -> dict:
    return {"queries": ["Bandra prices", "Powai prices", "rental yields", "infra projects"]}

for i in range(4):
    graph.add_node(f"search_{i}", make_search_node(i))
    graph.add_edge("orchestrator", f"search_{i}")  # fan out
    graph.add_edge(f"search_{i}", "aggregator")    # fan in

# LangGraph waits for ALL fan-in edges before running aggregator
def aggregator(state) -> dict:
    return {"analysis": synthesise(state["search_results"])}</code></pre>
<div class="callout callout-tip">
  <strong>The "superstep" model:</strong> LangGraph executes nodes in rounds called supersteps. All nodes that receive an edge in the same superstep run concurrently. The aggregator is only eligible to run in the <em>next</em> superstep — after all four search nodes have written to state. You don't need to write any synchronisation code; the graph structure encodes the barrier.
</div>

<h3>Critic-revision loop</h3>
<div class="callout callout-info">
  <strong>What is the critic-revision pattern?</strong> One agent produces a draft; a second agent critiques it; a routing function decides whether to send it back for revision or declare it good enough. This repeats up to a maximum number of times.
  <br><br>
  <strong>The FE analogy:</strong> An automated CI loop — run linter → read failures → fix code → re-run linter → stop when green or max retries reached. The writer is "your code", the critic is "the linter", and <code>revision_count</code> is the circuit breaker.
  <br><br>
  <strong>The <code>ReviewState</code> TypedDict</strong> you must define before this code works:
  <pre style="margin:6px 0;font-size:11px;background:#1e1e2e;padding:8px;border-radius:4px"><code class="language-python">class ReviewState(TypedDict):
    messages:        Annotated[list, add_messages]  # conversation history
    draft:           str                             # current draft text
    critique:        str | None                      # critic's last feedback
    revision_count:  int                             # circuit breaker</code></pre>
  <code>route_review</code> below is the conditional edge function — you pass it to <code>graph.add_conditional_edges("critic", route_review)</code>. LangGraph calls it after every critic execution to decide: revise again, or end?
</div>
<pre><code class="language-python">def writer(state: ReviewState) -> dict:
    prompt = (f"Revise based on: {state['critique']}\nDraft: {state['draft']}"
              if state.get("critique") else f"Write report for: {state['messages'][-1].content}")
    return {"draft": llm.invoke(prompt).content,
            "revision_count": state.get("revision_count", 0) + 1}

def critic(state: ReviewState) -> dict:
    return {"critique": llm.invoke(f"Critique for accuracy:\n{state['draft']}").content}

def route_review(state: ReviewState) -> str:
    if state["revision_count"] >= 3: return "end"
    if "looks good" in state["critique"].lower(): return "end"
    return "revise"</code></pre>

<h2>42.2 Google A2A Protocol</h2>
<div class="callout callout-info"><strong>A2A spec maturity — stable for HTTP, evolving for enterprise features</strong>
A2A v1.0 was released in April 2025 and donated to the Linux Foundation in June 2025 — it is
production-stable at the HTTP+SSE + OAuth2 + Agent Card level. The core task lifecycle
(submitted → working → input-required → completed/failed) and Agent Card discovery are stable.
<br><br>
What is still evolving (as of 2025): push notifications, streaming fidelity across complex tasks,
enterprise auth beyond OAuth2 (SPIFFE/SVID), and streaming resumption after network drops. For
a production A2A server today, the stable core is sufficient. Interview note: 150+ org supporters
(Google, MongoDB, SAP, Salesforce, Anthropic, Meta) — this is not a niche standard.
</div>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── Three-Layer Agent Architecture with A2A ───────────────────────────────────

<p>A2A (Agent2Agent) — open standard donated to Linux Foundation (June 2025), 150+ org supporters. Defines how agents from different vendors discover, delegate, and exchange results.</p>

<h2>42.3 Debugging with LangSmith</h2>
<p>LangSmith captures every function decorated with <code>@traceable</code> as a <strong>span</strong> in a hierarchical trace. The outermost decorated function becomes the <strong>root span</strong>; every LLM call and tool call inside it appears as a <strong>child span</strong>. Each span records its input arguments, output value, latency in ms, token count, and cost in USD.</p>
<p>Reading a LangSmith trace is like reading a <strong>browser network waterfall</strong>: you see exactly which step took the most time, what data flowed in and out, and where the cost accumulated. When a user reports a bad response, you filter by their <code>session_id</code>, open the trace, and immediately see which node produced the wrong output — without adding any debug logging.</p>
<pre style="font-size:11px;background:#1e1e2e;color:#cdd6f4;padding:10px;border-radius:4px;margin:8px 0;overflow-x:auto">── LangSmith Trace: property_search_agent (annotated mockup) ────────────────

▶ property_search_agent           [TOTAL: 820ms, $0.0018]     ← root span
  │  input:  {"query": "3BHK in Bandra under 2Cr"}
  │  output: {"response": "Found 4 listings...", "properties": [...]}
  │
  ├─▶ safety_node                 [12ms, no LLM]              ← node span
  │     input:  "3BHK in Bandra under 2Cr"

  ├─▶ route_domain_node           [25ms, 60 tokens, $0.00005] ← SLM call
  │     model:  claude-haiku-4-5-20251001
  │     cached: true (system prompt cache hit — 90% cheaper)
  │     output: {domain: "property_search", confidence: 0.98}

<h2>42.4 LangGraph State Inspector &amp; Studio</h2>
<p>When you compile a LangGraph graph with a checkpointer (e.g. <code>MemorySaver</code>), it saves a complete snapshot of the state after <strong>every node execution</strong>. This creates a replayable audit log — you can ask "what was the exact state when the agent decided to call the search tool?" and inspect it directly.</p>
<p>This is the same concept as <strong>Redux DevTools time-travel</strong>: you can scrub backwards through the state history and even re-run the graph from any checkpoint. Three things the API gives you:</p>
<ul>
  <li><strong><code>app.get_state(config)</code></strong> — returns the current checkpoint. <code>state.values</code> is the full state dict. <code>state.next</code> is a tuple of node names that will execute on the next <code>invoke()</code> call — useful for verifying the graph is paused at the right point during HITL flows.</li>
  <li><strong><code>app.get_state_history(config)</code></strong> — returns all past checkpoints for that <code>thread_id</code>, newest first. Each snapshot has its own <code>config</code> you can pass back to <code>invoke()</code> to replay from that exact point.</li>
  <li><strong><code>app.get_graph().draw_ascii()</code></strong> — prints the compiled graph structure. Run this whenever you add a new node to verify the edges connected the way you intended — catches wiring bugs before runtime.</li>
</ul>
<pre><code class="language-python"># ASCII graph structure
print(app.get_graph().draw_ascii())
# ┌────────┐   ┌─────┐   ┌───────┐
# │ intent │→  │ llm │→  │ tools │
# └────────┘   └─────┘   └───────┘
#                 ↑           │
#                 └───────────┘

# Inspect live checkpoint state
config = {"configurable": {"thread_id": "debug_1"}}
state = app.get_state(config)
print(state.values)   # all fields
print(state.next)     # which node runs next

# Time-travel: replay from any point
for snapshot in app.get_state_history(config):
    print(snapshot.config, snapshot.values["messages"][-1].content)

# Mermaid diagram for documentation
print(app.get_graph().draw_mermaid())</code></pre>

<div class="callout callout-tip"><strong>LangGraph Studio scope — dev tool only</strong>
LangGraph Studio (<code>langgraph dev</code>) is a development tool that runs the graph in-process on your
machine. It is NOT a production monitoring dashboard. Do not use it to monitor live traffic.
For production: LangSmith traces + your custom <code>monitor_node</code> decorator + Prometheus metrics.
Studio is for understanding your graph structure, debugging state transitions, and prototyping
new edges — not for watching production users.
<br><br>
<strong>LangGraph parallel execution — superstep model:</strong> When multiple edges fan into the same
node (e.g., both agent_2 and agent_3 → agent_4), LangGraph uses a superstep model: it waits
for ALL incoming branches to complete before executing agent_4. This is synchronised fan-in,
not streaming. If agent_2 finishes in 100ms and agent_3 takes 2s, agent_4 waits for agent_3.
Design parallel branches to have similar expected latency; otherwise your p95 is dominated by
the slowest branch.
</div>

<h2>42.5 Production Monitoring</h2>
<pre><code class="language-python">def monitor_node(node_name: str):
    def decorator(fn):
        @wraps(fn)
        def wrapper(state, *args, **kwargs):
            start = time.time()
            try:
                result = fn(state, *args, **kwargs)
                log.info("node_ok", node=node_name,
                          latency_ms=round((time.time()-start)*1000),
                          tokens=result.get("_tokens", 0))
                return result
            except Exception as e:
                log.error("node_fail", node=node_name, error=str(e)); raise
        return wrapper
    return decorator</code></pre>

<h2>42.6 Debugging Checklist</h2>
<pre><code class="language-text">1. LangSmith trace first
   → Which node failed? What was input/output?

2. State at failure: app.get_state(config).values
   → What was in state when it went wrong?

3. Tool schemas: print(tool.args_schema.schema())
   → Add better Field(description=...) if LLM misuses the tool

4. Routing logic: print state before conditional edge
   → Is the route function seeing what you expect?

5. add_messages gotcha
   → return {"messages": [...]}  ← correct (appends)
   → state["messages"] = [...]   ← wrong (replaces)

6. Infinite loops: is max_iterations set? Is there a "done" condition?

7. Cost attribution: which node consumes most tokens?
   → Can you cache or trim its inputs?</code></pre>
